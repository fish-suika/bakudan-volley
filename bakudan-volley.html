// 左右を入れ替えたポーズ（L ↔ R。ry と rz は向きが逆になる）
function mirrorPose(p) {
  const out = { hipsDrop: p.hipsDrop };
  for (const k in p) {
    if (k === 'hipsDrop') continue;
    const m = k.endsWith('L') ? k.slice(0, -1) + 'R' : k.endsWith('R') ? k.slice(0, -1) + 'L' : k;
    out[m] = [p[k][0], -p[k][1], -p[k][2]];
  }
  return out;
}

// 2 つのポーズを k（0〜1）で混ぜる。無い関節は 0
function blendPose(a, b, k) {
  const out = { hipsDrop: (a.hipsDrop || 0) + ((b.hipsDrop || 0) - (a.hipsDrop || 0)) * k };
  for (const n of JOINTS) {
    const ra = a[n] || [0, 0, 0], rb = b[n] || [0, 0, 0];
    out[n] = [ra[0] + (rb[0] - ra[0]) * k, ra[1] + (rb[1] - ra[1]) * k, ra[2] + (rb[2] - ra[2]) * k];
  }
  return out;
}

// クリップ = [[時刻, ポーズ名], ...]。時刻 t のポーズを、前後のキーの間でなめらかに（smoothstep）混ぜて返す
function sampleClip(clip, t) {
  if (t <= clip[0][0]) return POSES[clip[0][1]];
  for (let i = 1; i < clip.length; i++) {
    if (t === clip[i][0]) return POSES[clip[i][1]];       // ちょうどキーの時刻（混ぜると小数の誤差が出るので、そのまま返す）
    if (t < clip[i][0]) {
      const [t0, p0] = clip[i - 1], [t1, p1] = clip[i];
      const k = (t - t0) / (t1 - t0), s = k * k * (3 - 2 * k);
      return blendPose(POSES[p0], POSES[p1], s);
    }
  }
  return POSES[clip[clip.length - 1][1]];
}

// クリップの時刻は「爆弾に触る瞬間」を 0 にする（ブロックは跳んだ最高点、空振りは振り下ろす瞬間）。
// アタック・ブロックの踏み切りは -0.43（riseTime）、着地は +0.43。ゲームの判定の時刻と合わせてある
const CLIPS = {
  attack: [[-1.2, 'approachReady'], [-0.75, 'step1'], [-0.6, 'step2'], [-0.5, 'armsBack'], [-0.43, 'takeoff'],
    [-0.25, 'spikeBack'], [-0.04, 'spikeBack'], [0, 'spikeHit'], [0.15, 'spikeFollow'], [0.43, 'landing'], [0.75, 'ready']],
  direct: [[-0.6, 'ready'], [-0.5, 'armsBack'], [-0.43, 'takeoff'], [-0.25, 'spikeBack'], [-0.04, 'spikeBack'],
    [0, 'spikeHit'], [0.15, 'spikeFollow'], [0.43, 'landing'], [0.75, 'ready']],
  standSpike: [[-0.5, 'ready'], [-0.25, 'spikeBack'], [-0.03, 'spikeBack'], [0, 'spikeHit'], [0.2, 'spikeFollow'], [0.6, 'ready']],
  receive: [[-0.6, 'receiveReady'], [-0.12, 'receive'], [0, 'receivePush'], [0.3, 'receivePush'], [0.6, 'ready']],
  toss: [[-0.6, 'tossReady'], [-0.1, 'toss'], [0, 'tossPush'], [0.3, 'tossPush'], [0.6, 'ready']],
  block: [[-0.75, 'blockReady'], [-0.55, 'blockDip'], [-0.43, 'blockTakeoff'], [-0.1, 'blockReach'], [0.15, 'blockReach'],
    [0.43, 'landing'], [0.75, 'ready']],
  serve: [[-2.2, 'serveHold'], [-1.35, 'serveHold'], [-1.25, 'serveToss'], [-1.0, 'approachReady'], [-0.8, 'step1'], [-0.62, 'step2'],
    [-0.5, 'armsBack'], [-0.43, 'takeoff'], [-0.25, 'spikeBack'], [-0.04, 'spikeBack'], [0, 'spikeHit'], [0.15, 'spikeFollow'], [0.43, 'landing'], [0.75, 'ready']],
  whiff: [[-0.4, 'ready'], [-0.2, 'spikeBack'], [0, 'spikeHit'], [0.2, 'spikeFollow'], [0.6, 'ready']],
};
CLIPS.return = CLIPS.receive;
CLIPS.bump = CLIPS.receive;
CLIPS.blockNoop = CLIPS.block;
const LAND_CLIP = [[0, 'landing'], [0.35, 'ready']];
const WAIT_POSE = { receive: 'receiveReady', bump: 'receiveReady', return: 'receiveReady', toss: 'tossReady',
  serve: 'serveHold', attack: 'approachReady', block: 'blockReady', blockNoop: 'blockReady' };

// クリップの 0 の時刻（まだ決まっていなければ null）
function clipAnchor(t) {
  if (t.kind === 'serve') return t.hold + CFG.jumpServe.tossTime;
  if (t.kind === 'block' || t.kind === 'blockNoop') return t.jumpAt != null ? t.jumpAt + riseTime() : null;
  if (t.kind === 'whiff') return t.start + 0.4;
  return t.contactAt != null ? t.contactAt : null;
}

// 近い所へ動くときはサイドステップ（ネットを向いたまま）
function isShuffle(a) { return a.moving && a.moveLeft < CFG.motion.shuffleDist; }

// 走る・サイドステップの脚は、歩いた距離で回す（時間で回すと、速さと脚が合わない）
function runPose(a) {
  const k = (Math.sin(a.stride / CFG.motion.strideLen * Math.PI * 2) + 1) / 2;
  return isShuffle(a) ? blendPose(POSES.shuffle1, POSES.shuffle2, k) : blendPose(POSES.run1, POSES.run2, k);
}

// 選手の状態（15-actors.js の actor）から、今とるべきポーズを返す
function motionFor(a, simT) {
  if (a.stun > 0) return POSES.stagger;
  const h = a.lastHit;
  if (h && CLIPS[h.kind] && simT - h.at < 0.8) return sampleClip(CLIPS[h.kind], simT - h.at);   // 打ったあとの続き
  const t = a.task;
  if (t && CLIPS[t.kind]) {
    const at = clipAnchor(t);
    if (at !== null && simT - at >= CLIPS[t.kind][0][0]) return sampleClip(CLIPS[t.kind], simT - at);   // 予定の時刻が近づいた
  }
  if (a.y > 0) return POSES.jump;
  if (a.landT != null && simT - a.landT < 0.35) return sampleClip(LAND_CLIP, simT - a.landT);
  if (a.moving) return runPose(a);
  if (t && WAIT_POSE[t.kind]) return POSES[WAIT_POSE[t.kind]];
  return POSES.ready;
}

// 体の向き（root の y 回転）。止まっている・近くへ動く・吹っ飛んでいるときはネットのほう、遠くへ走るときは進む向き
function facingFor(a) {
  const net = a.team === 0 ? Math.PI / 2 : -Math.PI / 2;
  if (!a.moving || isShuffle(a) || a.fly) return net;
  return Math.atan2(a.mdx, a.mdz);
}

// 吹っ飛んでいる人のポーズ（20-blast.js の fly.state から）
function flyPose(f, simT) {
  if (f.state === 'air' || f.state === 'hang') return Math.sin(simT * 18) > 0 ? POSES.flail1 : POSES.flail2;
  if (f.state === 'stick') return POSES.splat;
  if (f.state === 'getup') return f.t < CFG.blast.getupTime * 0.5 ? POSES.lie : POSES.ready;
  return POSES.lie;
}
// ===== 爆発（一瞬の静止と白い光 → 火の玉 2 重 → 爆風の輪 → 煙・火花・床板の破片 → 揺れ。煙は数秒で晴れる） =====
const FX = { scene: null, light: null, geo: null, list: [], shake: 0, freeze: 0, glow: 0 };

function initFx(scene) {
  FX.scene = scene;
  FX.light = new THREE.PointLight(0xffb040, 0, 40);       // 最初から置いておく（途中で光を足すと描画が一瞬止まるため）
  scene.add(FX.light);
  FX.geo = {                                              // 形は使い回す（材質は 1 つずつ作って、消えるときに捨てる）
    sphere: new THREE.SphereGeometry(1, 20, 14),
    small: new THREE.SphereGeometry(1, 6, 4),
    box: new THREE.BoxGeometry(1, 1, 1),
    ring: new THREE.RingGeometry(0.85, 1, 48),
  };
}

function addPart(kind, geo, mat, pos, vel, life, size, extra) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(pos.x, pos.y, pos.z);
  m.scale.setScalar(size);
  FX.scene.add(m);
  FX.list.push(Object.assign({ kind, m, vel, life, size, t: 0 }, extra));
}

function spawnExplosion(x, z) {
  const rnd = Math.random, basic = (c, o) => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: o === undefined ? 1 : o, depthWrite: false });
  // 一瞬の静止・白い光・揺れ
  FX.freeze = CFG.fx.freeze;
  FX.shake = 1.0;
  FX.glow = 9;
  FX.light.position.set(x, 2.5, z);
  const flash = document.getElementById('flash');
  flash.style.transition = 'none';
  flash.style.opacity = '0.85';
  requestAnimationFrame(() => { flash.style.transition = 'opacity .35s'; flash.style.opacity = '0'; });
  // 火の玉（白っぽい芯と、外側のオレンジ）と、床を走る輪
  addPart('fire', FX.geo.sphere, basic(0xfff2b0), { x, y: 0.8, z }, null, 0.6, 0.6, { grow: 4.5, hue: 0.13 });
  addPart('fire', FX.geo.sphere, basic(0xff8a20, 0.9), { x, y: 1.0, z }, null, 1.0, 0.8, { grow: 6.5, hue: 0.07 });
  addPartRing(x, z);
  // 煙：まわりに広がりながら上がり、ゆっくり薄くなる（＝煙が晴れる）
  for (let i = 0; i < 14; i++) {
    const a = rnd() * Math.PI * 2, r = 0.5 + rnd() * 2;
    const mat = new THREE.MeshLambertMaterial({ color: 0x5a5a5a, transparent: true, opacity: 0.5, depthWrite: false });
    addPart('smoke', FX.geo.sphere, mat, { x: x + Math.cos(a) * r, y: 0.5 + rnd() * 2, z: z + Math.sin(a) * r },
      { x: Math.cos(a) * (1 + rnd() * 1.5), y: 0.8 + rnd() * 1.2, z: Math.sin(a) * (1 + rnd() * 1.5) }, 3.2 + rnd() * 1.2, 1.1 + rnd() * 0.8);
  }
  // 火花
  for (let i = 0; i < 36; i++) {
    const a = rnd() * Math.PI * 2, up = 0.3 + rnd() * 0.9, sp = 8 + rnd() * 8;
    addPart('spark', FX.geo.small, basic(0xffd060), { x, y: 0.6, z },
      { x: Math.cos(a) * sp * (1 - up * 0.5), y: sp * up, z: Math.sin(a) * sp * (1 - up * 0.5) }, 0.8 + rnd() * 0.6, 0.07);
  }
  // 床板の破片
  for (let i = 0; i < 12; i++) {
    const a = rnd() * Math.PI * 2, sp = 4 + rnd() * 5;
    const mat = new THREE.MeshLambertMaterial({ color: 0xb07840, transparent: true, opacity: 1 });
    addPart('debris', FX.geo.box, mat, { x, y: 0.3, z },
      { x: Math.cos(a) * sp, y: 6 + rnd() * 6, z: Math.sin(a) * sp }, 2.5, 1,
      { dims: [0.35 + rnd() * 0.3, 0.05, 0.12 + rnd() * 0.1], spin: { x: rnd() * 12 - 6, y: rnd() * 12 - 6, z: rnd() * 12 - 6 } });
  }
}

function addPartRing(x, z) {
  const mat = new THREE.MeshBasicMaterial({ color: 0xffe0a0, transparent: true, opacity: 0.85, side: THREE.DoubleSide, depthWrite: false });
  addPart('ring', FX.geo.ring, mat, { x, y: 0.03, z }, null, 0.9, 1);
  FX.list[FX.list.length - 1].m.rotation.x = -Math.PI / 2;
}

function updateFx(dt) {
  for (const p of FX.list) {
    p.t += dt;
    const a = Math.min(1, p.t / p.life), m = p.m, v = p.vel;
    if (p.kind === 'fire') {
      m.scale.setScalar(p.size + p.grow * Math.sqrt(a));
      m.material.opacity = (1 - a) * (1 - a);
      m.material.color.setHSL(p.hue * (1 - a), 1, 0.65 - 0.4 * a);
    } else if (p.kind === 'ring') {
      m.scale.setScalar(1 + 15 * a);
      m.material.opacity = 0.85 * (1 - a);
    } else if (p.kind === 'smoke') {
      m.position.x += v.x * dt; m.position.y += v.y * dt; m.position.z += v.z * dt;
      const drag = Math.max(0, 1 - dt * 0.7);
      v.x *= drag; v.z *= drag;
      m.scale.setScalar(p.size * (1 + 1.3 * a));
      m.material.opacity = 0.5 * Math.pow(1 - a, 1.5);   // 濃すぎると爆心のまわりが何も見えないので薄め
    } else if (p.kind === 'spark') {
      v.y -= CFG.gravity * dt;
      m.position.x += v.x * dt; m.position.y += v.y * dt; m.position.z += v.z * dt;
      if (m.position.y < 0.05) { m.position.y = 0.05; v.y = -v.y * 0.3; }
      m.scale.setScalar(p.size * (1 - a));
    } else if (p.kind === 'debris') {
      v.y -= CFG.gravity * dt;
      m.position.x += v.x * dt; m.position.y += v.y * dt; m.position.z += v.z * dt;
      if (m.position.y < 0.03) { m.position.y = 0.03; v.y = -v.y * 0.35; v.x *= 0.7; v.z *= 0.7; p.spin.x *= 0.6; p.spin.y *= 0.6; p.spin.z *= 0.6; }
      m.rotation.x += p.spin.x * dt; m.rotation.y += p.spin.y * dt; m.rotation.z += p.spin.z * dt;
      m.scale.set(p.dims[0], p.dims[1], p.dims[2]);
      m.material.opacity = a < 0.7 ? 1 : (1 - a) / 0.3;
    }
  }
  for (let i = FX.list.length - 1; i >= 0; i--) {
    const p = FX.list[i];
    if (p.t < p.life) continue;
    FX.scene.remove(p.m);
    p.m.material.dispose();                               // 形は使い回しなので捨てない
    FX.list.splice(i, 1);
  }
  FX.glow = Math.max(0, FX.glow - dt * 12);
  FX.light.intensity = FX.glow;
  FX.shake = Math.max(0, FX.shake - dt * 1.2);
}
// ===== カメラ（中継の角度：コートの横、斜め上から）。爆発の間は画角を広げて爆発のほうへ振り、天井まで飛ぶ人も倒れた人も入れる =====
const CAM = { cam: null, x: 0, y: null, lx: 0, ly: null, lz: 0, fov: null };

// focusX：爆弾の x（少しだけ追って横に振る）。boomAt：爆発した場所（爆発の間だけ）
function updateCamera(dt, focusX, boomAt) {
  const c = CFG.camera, s = FX.shake;
  const goal = boomAt
    ? { x: boomAt.x * 0.3, y: c.y, lx: boomAt.x * 0.45, ly: c.boomLookY, lz: boomAt.z * 0.2, fov: c.boomFov }
    : { x: focusX * c.follow, y: c.y, lx: focusX * c.follow, ly: c.lookY, lz: 0, fov: c.fov };
  const k = Math.min(1, dt * (boomAt ? 3 : 1.5));
  for (const key in goal) CAM[key] = CAM[key] === null ? goal[key] : CAM[key] + (goal[key] - CAM[key]) * k;
  if (Math.abs(CAM.cam.fov - CAM.fov) > 0.01) { CAM.cam.fov = CAM.fov; CAM.cam.updateProjectionMatrix(); }
  CAM.cam.position.set(CAM.x + (Math.random() - 0.5) * s, CAM.y + (Math.random() - 0.5) * s, c.z);
  CAM.cam.lookAt(CAM.lx, CAM.ly, CAM.lz);
}
// ===== 爆発のリプレイ（記録と当て直し。three.js の物は作らない） =====
// 毎フレーム、選手と爆弾の見た目（位置・回転・関節）を記録しておき、点が入ったら爆発の前後をスローで見せ直す
function makeRecorder() { return { frames: [] }; }

// t は実時間。keep 秒より古いフレームは捨てる
function recordFrame(rec, t, players, bomb, keep) {
  rec.frames.push({
    t,
    players: players.map(pl => ({
      p: [pl.root.position.x, pl.root.position.y, pl.root.position.z],
      ry: pl.root.rotation.y,
      tr: [pl.tumble.rotation.x, pl.tumble.rotation.z],
      hy: pl.j.hips.position.y,
      j: JOINTS.map(n => [pl.j[n].rotation.x, pl.j[n].rotation.y, pl.j[n].rotation.z]),
    })),
    ball: bomb.g.visible ? [bomb.g.position.x, bomb.g.position.y, bomb.g.position.z] : null,
  });
  while (rec.frames.length && rec.frames[0].t < t - keep) rec.frames.shift();
}

// 時刻 t 以前で一番新しいフレーム（t が最初より前なら最初）
function frameAt(rec, t) {
  const F = rec.frames;
  let lo = 0, hi = F.length - 1;
  if (t <= F[0].t) return F[0];
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (F[mid].t <= t) lo = mid; else hi = mid - 1;
  }
  return F[lo];
}

// フレームの見た目を、選手と爆弾に当て直す
function applyFrame(f, players, bomb) {
  f.players.forEach((s, i) => {
    const pl = players[i];
    pl.root.position.x = s.p[0]; pl.root.position.y = s.p[1]; pl.root.position.z = s.p[2];
    pl.root.rotation.y = s.ry;
    pl.tumble.rotation.x = s.tr[0]; pl.tumble.rotation.z = s.tr[1];
    JOINTS.forEach((n, k) => { const r = pl.j[n].rotation; r.x = s.j[k][0]; r.y = s.j[k][1]; r.z = s.j[k][2]; });
    pl.j.hips.position.y = s.hy;
  });
  bomb.g.visible = bomb.shadow.visible = !!f.ball;
  if (f.ball) {
    bomb.g.position.x = f.ball[0]; bomb.g.position.y = f.ball[1]; bomb.g.position.z = f.ball[2];
    bomb.shadow.position.x = f.ball[0]; bomb.shadow.position.z = f.ball[2];
  }
}
// ===== 壁の人型の跡（張り付いた所に大の字のへこみが残る。試合中は増えていき、最大 12 個） =====
const DECALS = { scene: null, list: [], geo: null, mat: null };

function initDecals(scene) {
  DECALS.scene = scene;
  const rect = (cx, cy, w, h, ang) => {                   // 中心 (cx, cy)、幅 w・長さ h、ang だけ傾けた長方形
    const s = new THREE.Shape(), c = Math.cos(ang), n = Math.sin(ang);
    const pts = [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]].map(([x, y]) => [cx + x * c - y * n, cy + x * n + y * c]);
    s.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < 4; i++) s.lineTo(pts[i][0], pts[i][1]);
    s.closePath();
    return s;
  };
  const head = new THREE.Shape();
  head.absarc(0, 0.72, 0.17, 0, Math.PI * 2, false);
  const shapes = [
    head,
    rect(0, 0.15, 0.44, 0.78, 0),                         // 胴
    rect(0.48, 0.72, 0.17, 0.8, -1.0), rect(-0.48, 0.72, 0.17, 0.8, 1.0),   // 腕（斜め上へ開く）
    rect(0.3, -0.65, 0.2, 0.95, 0.4), rect(-0.3, -0.65, 0.2, 0.95, -0.4),   // 脚（斜め下へ開く）
  ];
  DECALS.geo = new THREE.ShapeGeometry(shapes);
  DECALS.mat = new THREE.MeshLambertMaterial({ color: 0x6b7670, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
}

// stick の出来事（axis, sign, x, y, z）から跡を足す。手前の壁（見えない）には残さない
function addDecal(e) {
  if (e.axis === 'z' && e.sign > 0) return;
  const G = CFG.gym, m = new THREE.Mesh(DECALS.geo, DECALS.mat);
  const y = clamp(e.y, 1.0, G.ceil - 1.0);
  if (e.axis === 'x') { m.position.set(e.sign * (G.halfX - 0.01), y, e.z); m.rotation.y = -e.sign * Math.PI / 2; }
  else { m.position.set(e.x, y, e.sign * (G.halfZ - 0.01)); m.rotation.y = 0; }
  m.rotation.z = (Math.random() - 0.5) * 0.6;            // 少し傾いて張り付く
  m.receiveShadow = true;
  DECALS.scene.add(m);
  DECALS.list.push(m);
  if (DECALS.list.length > 12) DECALS.scene.remove(DECALS.list.shift());
}

function clearDecals() {
  for (const m of DECALS.list) DECALS.scene.remove(m);
  DECALS.list.length = 0;
}
// ===== 入力：4 つの行動ボタン（スマホはタップ）と 1〜4 キー =====

}

// ===== 起動とメインループ =====
(function boot() {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  buildGym(scene);
  initFx(scene);
  initDecals(scene);
  const camera = new THREE.PerspectiveCamera(CFG.camera.fov, innerWidth / innerHeight, 0.1, 200);
  CAM.cam = camera;

  const R = newRally();
  const players = R.actors.map(a => {
    const pl = makePlayer(scene, a.team);
    placePlayer(pl, a.x, a.z);                            // 向き（ネットのほう）を決める
    return pl;
  });
  const bombMesh = makeBombMesh(scene);
  let titleOn = true, replay = null, pendingResult = null, lastBoom = null, realT = 0;
  const rec = makeRecorder(), CMT = { until: 0, prio: -1, last: '' };
  initInput(act => { if (!titleOn && !replay) choose(R, act); });
  addEventListener('pointerdown', sndInit);
  addEventListener('keydown', sndInit);
  window.GAME = { R, choose: act => choose(R, act), start: () => startGame() };   // 確認用

  addEventListener('resize', () => {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  });

  // 試合を始める（タイトルの「試合開始」・勝敗の画面の「もう一回」）
  function startGame() {
    titleOn = false; replay = null; pendingResult = null; lastBoom = null;
    setTitle(false); setReplayTag(false); hideResult(); hideChoice();
    clearDecals();
    newGame(R);                                           // 積まれた①の選択は、次のフレームでボタンに出る
    setScore(R.score);
  }
  // タイトルへ：後ろで AI どうしの試合を流す
  function showTitle() {
    titleOn = true; replay = null; pendingResult = null;
    setTitle(true); setReplayTag(false); hideResult(); hideChoice();
    newGame(R);
    R.events.length = 0;
  }
  // リプレイ：爆発の before 秒前から after 秒後までを、speed 倍の速さで、低い角度から見せ直す
  function startReplay() {
    const P = CFG.replay;
    replay = { t: lastBoom.t - P.before, end: lastBoom.t + P.after, boom: lastBoom, fired: false };
    lastBoom = null;
    setReplayTag(true); hideChoice();
  }
  function endReplay() {
    replay = null;
    setReplayTag(false);
    FX.freeze = 0;
    if (pendingResult) { showResult(pendingResult.winner, pendingResult.score); pendingResult = null; }
  }
  function stepReplay(dt) {
    const P = CFG.replay, b = replay.boom;
    replay.t += dt * P.speed;
    applyFrame(frameAt(rec, replay.t), players, bombMesh);
    if (!replay.fired && replay.t >= b.t) { replay.fired = true; spawnExplosion(b.x, b.z); FX.freeze = 0; sndBoom(); }
    updateFx(dt * P.speed);
    camera.fov = P.fov; camera.updateProjectionMatrix();
    // 爆心と、吹っ飛んだ側の選手の両方が入るように見る（爆弾がコートの外に落ちると、爆心だけを見ていたら選手が映らなかった）
    const f = frameAt(rec, replay.t), side = R.actors.map((a, i) => a.team === b.side ? f.players[i].p : null).filter(Boolean);
    const pts = [[b.x, 1.0, b.z], ...side];
    const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length, cy = pts.reduce((s, p) => s + p[1], 0) / pts.length;
    const cz = pts.reduce((s, p) => s + p[2], 0) / pts.length;
    const spread = Math.max(...pts.map(p => Math.hypot(p[0] - cx, (p[1] - cy) * 1.5, p[2] - cz)));
    const dist = clamp(spread * 1.9 + 4, 7, 16);           // 広がっているほど引く
    const goal = { x: clamp(cx + (cx < 0 ? 1 : -1) * dist * 0.35, -13.5, 13.5), y: 1.4 + dist * 0.12, z: Math.min(cz + dist, 16),
      lx: cx, ly: Math.max(1.6, cy + 0.6), lz: cz };
    const k = replay.cam ? Math.min(1, dt * 4) : 1;       // 最初の 1 回はそのまま、あとはなめらかに追う
    replay.cam = replay.cam || {};
    for (const key in goal) replay.cam[key] = replay.cam[key] === undefined ? goal[key] : replay.cam[key] + (goal[key] - replay.cam[key]) * k;
    const c = replay.cam;
    camera.position.set(c.x, c.y, c.z);
    camera.lookAt(c.lx, c.ly, c.lz);
    if (replay.t >= replay.end) endReplay();
  }
  // タイトル中の試合：プレイヤーの番も、少し待ってから場面に合う行動を自動で選ぶ
  function demoPick(c) {
    if (c.scene === 'serve') return 'serve';
    if (c.scene === 'tossed') return 'attack';
    return c.attack && Math.random() < 0.4 ? 'block' : 'receive';
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('againBtn').addEventListener('click', startGame);
  document.getElementById('titleBtn').addEventListener('click', showTitle);
  addEventListener('pointerdown', () => { if (replay) endReplay(); });
  addEventListener('keydown', () => { if (replay) endReplay(); });
  showTitle();
  const clock = new THREE.Clock();
  function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 1 / 30);
    realT += dt;
    if (replay) { stepReplay(dt); renderer.render(scene, camera); return; }
    if (FX.freeze > 0) { FX.freeze -= dt; renderer.render(scene, camera); return; }   // 爆発の瞬間の一瞬の静止
    if (titleOn && R.state === 'choose' && R.choose.left < CFG.choiceTime - 0.8) choose(R, demoPick(R.choose));
    tickRally(R, dt);
    for (const e of R.events) {
      const line = pickComment(CMT, e, realT);
      if (line) showCaption(line);
      if (e.type === 'choose') { if (!titleOn) { showChoice(e.scene, e.attack); sndSlow(); } }
      else if (e.type === 'chosen') { hideChoice(); if (e.action === null) showToast('時間切れ！', 1.0); }
      else if (e.type === 'floor') hideChoice();         // 選んでいる途中で床に落ちたら、ボタンを消す
      else if (e.type === 'explode') {
        lastBoom = { t: realT, x: e.x, z: e.z, side: e.side };
        sndBoom();
        spawnExplosion(e.x, e.z);
        showToast(e.side === 0 ? '味方コートで爆発！' : '相手コートで爆発！');
      }
      else if (e.type === 'point') {
        sndPoint(e.scorer === 0);
        setScore(e.score);
        if (e.score[e.scorer] < CFG.winScore) showToast(e.scorer === 0 ? '味方に 1 点！' : '相手に 1 点……', 1.4);   // 最後の 1 点は勝敗の画面に任せる
        if (!titleOn && lastBoom && realT - lastBoom.t < CFG.replay.keep - CFG.replay.after) startReplay();
      }
      else if (e.type === 'gameover') {
        if (titleOn) newGame(R);                          // タイトル中の試合は、終わったらそのまま次へ
        else if (replay) pendingResult = e;               // リプレイを見せてから勝敗の画面
        else showResult(e.winner, e.score);
      }
      else if (e.type === 'bump') showToast('ゴツン！', 0.8);
      else if (e.type === 'stick') addDecal(e);
      else if (e.type === 'crash') { FX.shake = Math.min(1.2, FX.shake + 0.35); sndCrash(); }   // 壁・天井に激突
      else if (e.type === 'hit') sndHit(e.kind);
      else if (e.type === 'land' || e.type === 'net') sndLand();
      else if (e.type === 'collide') sndCrash();
    }
    R.events.length = 0;
    if (R.state === 'choose') { setTimer(R.choose.left / CFG.choiceTime); setCount(R.choose.left); }
    const slow = R.state === 'choose' ? CFG.slowScale : 1;
    const shown = R.ball && !(R.state === 'boom' && R.boom.fired) ? R.ball : null;   // 爆発したら爆弾を消す
    const focus = R.ball ? R.ball.pos : { x: 0, y: 3, z: 0 };
    R.actors.forEach((a, i) => updatePlayer(players[i], a, dt, R.simT, focus));
    updateBombMesh(bombMesh, shown, dt * slow);
    updateFx(dt);
    updateCamera(dt, R.ball ? R.ball.pos.x : 0, R.state === 'boom' && R.boom.fired ? R.boom.hit : null);
    recordFrame(rec, realT, players, bombMesh, CFG.replay.keep);
    renderer.render(scene, camera);
  }
  frame();
})();
</script>
</body>
</html>
