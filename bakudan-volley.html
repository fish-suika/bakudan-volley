<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>爆弾バレー</title>
<style>
  :root{--ink:#fff;--jp:"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Meiryo","Noto Sans JP",sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#20242a;color:var(--ink);font-family:var(--jp);
    touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100%;height:100%}

  /* ---- 操作の案内 ---- */
  #hint{position:fixed;left:16px;top:14px;z-index:5;font-size:13px;opacity:.8;pointer-events:none;text-shadow:0 1px 6px #000}

  /* ---- 4 つの行動ボタン（選ぶ場面だけ明るくなる） ---- */
  #actions{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;
    display:flex;flex-wrap:wrap;gap:8px 10px;width:min(640px,calc(100vw - 32px));opacity:.35;transition:opacity .15s;pointer-events:none}
  #actions.on{opacity:1;pointer-events:auto}
  #actions button{flex:1 1 0;min-width:0;padding:10px 4px;border:2px solid rgba(255,255,255,.55);border-radius:12px;
    background:rgba(20,24,30,.72);color:#fff;font:700 clamp(14px,2.6vw,18px) var(--jp);letter-spacing:.06em;cursor:pointer;touch-action:manipulation}
  #actions.on button{border-color:#ffd04a;background:rgba(60,44,10,.85)}
  #actions button b{display:block;font-size:11px;font-weight:400;opacity:.7}
  #actions button:active{transform:scale(.96)}
  #timer{flex:0 0 100%;height:5px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden}
  #timer i{display:block;height:100%;width:0;background:#ffd04a}

  /* ---- 選ぶ場面の文字 ---- */
  #scene{position:fixed;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 84px);transform:translateX(-50%);z-index:6;
    font-size:clamp(16px,3vw,22px);font-weight:700;letter-spacing:.1em;text-shadow:0 2px 10px #000;white-space:nowrap;
    opacity:0;transition:opacity .15s;pointer-events:none}
  #scene.on{opacity:1}

  /* ---- お知らせ ---- */
  #toast{position:fixed;left:50%;top:22%;z-index:7;transform:translate(-50%,-50%);width:max-content;max-width:90vw;
    font-size:clamp(22px,5vw,40px);font-weight:700;letter-spacing:.08em;text-align:center;
    text-shadow:0 2px 16px rgba(0,0,0,.8);opacity:0;transition:opacity .25s;pointer-events:none}
  #toast.on{opacity:1}
  /* ---- 爆発の白い光 ---- */
  #flash{position:fixed;inset:0;z-index:4;background:#fff;opacity:0;pointer-events:none}

  /* ---- スマホが縦向きのときの案内 ---- */
  #rotate{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;
    text-align:center;font-size:20px;background:#20242a}
  @media (orientation: portrait) and (pointer: coarse){#rotate{display:flex}}
  /* ---- 点数 ---- */
  #score{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:10px;
    padding:6px 16px;border-radius:20px;background:rgba(10,12,16,.6);font-size:15px;letter-spacing:.08em;pointer-events:none}
  #score b{font-size:24px;min-width:1ch;text-align:center}
  #score .t0{color:#8fb6ff}
  #score .t1{color:#ff9a8f}
  @media (max-width:820px){#hint{display:none}}

  /* ---- 勝敗の画面 ---- */
  #result{position:fixed;inset:0;z-index:12;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:16px;text-align:center;background:rgba(10,12,16,.72)}
  #result.on{display:flex}
  #result h2{font-size:clamp(30px,7vw,56px);letter-spacing:.08em}
  #result p{font-size:20px;letter-spacing:.12em}
  #againBtn{margin-top:8px;font:700 18px var(--jp);letter-spacing:.15em;color:#fff;background:#d8433a;border:0;
    border-radius:28px;padding:12px 34px;cursor:pointer}
</style>
</head>
<body>
<div id="hint">スローになったら 1〜4 キー（スマホはボタン）で次の行動を選ぶ</div>
<div id="scene"></div>
<div id="actions">
  <button data-act="receive"><b>1</b>レシーブ</button>
  <button data-act="attack"><b>2</b>アタック</button>
  <button data-act="block"><b>3</b>ブロック</button>
  <button data-act="serve"><b>4</b>サーブ</button>
  <div id="timer"><i></i></div>
</div>
<div id="score"><span class="t0">味方</span><b id="s0">0</b><span>-</span><b id="s1">0</b><span class="t1">相手</span></div>
<div id="result"><h2 id="resultText"></h2><p id="resultScore"></p><button id="againBtn">もう一回</button></div>
<div id="flash"></div>
<div id="toast"></div>
<div id="rotate">横画面にしてください</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
// ===== 数値（遊びながら調整する） =====
const CFG = {
  gravity: 9.8,
  court: { halfLen: 9, halfWid: 4.5 },                    // コートは x:-9..9, z:-4.5..4.5。ネットは x=0
  net: { top: 2.43, bottom: 1.43, halfWid: 5.5, thick: 0.06 },
  gym: { halfX: 15, halfZ: 11, ceil: 12 },                // 壁は x=±15, z=±11、天井は 12m
  ball: { r: 0.3, bounce: 0.65, netBounce: 0.25, playerBounce: 0.5, maxStep: 1 / 240 },
  player: { r: 0.4, h: 1.9, hipY: 0.95 },                 // 当たり判定は足元から高さ h の円柱
  startSpots: [                                           // 構える位置（team 0 = 味方・左、1 = 敵・右）
    { team: 0, x: -5, z: -2 }, { team: 0, x: -5, z: 2 },
    { team: 1, x: 5, z: -2 },  { team: 1, x: 5, z: 2 },
  ],
  explodeDelay: 0.25,                                     // 床に触れてから爆発するまでの「一瞬の間」（秒）
  // ---- Phase 2：行動と選択 ----
  slowScale: 0.08,                                        // 選ぶ間の時間の速さ
  choiceTime: 4.0,                                        // 選べる時間（実時間・秒）。過ぎたら味方に任せる
  afterBoom: 1.6,                                         // 爆発してから次のサーブまで（秒）
  runSpeed: 7,                                            // 選手が走る速さ m/s
  reach: 1.0,                                             // 爆弾に手が届く横の距離 m
  jumpH: 0.9,                                             // アタック・ブロック・サーブで跳ぶ高さ m
  contactH: { receive: 0.8, toss: 2.3, attack: 3.4, direct: 2.4, serve: 2.8 },   // 爆弾に触る高さ m
  serveSpot: 9.5,                                         // サーブを打つ位置（ネットからの距離。エンドラインの 0.5m 外）
  serveHold: 0.9,                                         // サーブ前に構える「真剣な間」（秒）
  hardSpeed: 13,                                          // これより速い球は「強い球」（直接打ち返しにくい）
  shots: {
    pass: { toX: 2.0, apex: 5.5 },                        // レシーブ → ネットから 2m の自陣へ高く上げる
    set: { toX: 1.2, apex: 6.0 },                         // トス → ネットから 1.2m のアタック位置へ
    spikeSpeed: 17, serveApex: 4.2, returnApex: 5.0,
  },
  success: {                                              // 場面 × 行動の成功率（仕様書 3.3）
    serve: { receive: 0.3, attack: 0.4, serve: 0.9 },
    incoming: { receive: 0.9, directSoft: 0.7, directHard: 0.25, block: 0.6 },
    tossed: { receive: 0.95, attack: 0.9 },
  },
  ai: {                                                   // 味方と敵の AI（ミスの確率は両チーム同じ）
    receive: 0.85, dig: 0.45, toss: 0.9, attack: 0.8, serve: 0.9, block: 0.5,   // 成功率（dig は強い球のレシーブ）
    blockTry: 0.35,                                       // 相手のアタックにブロックへ跳ぶ確率
    delay: [0.05, 0.3], slowChance: 0.15, slowDelay: 0.5, // 反応の遅れ（秒）。slowChance の確率でさらに slowDelay 遅れる
    bothGo: 0.12,                                         // 2 人とも同じ球へ向かってしまう確率
    earlyJump: 0.1,                                       // アタックでジャンプが早すぎて空振りする確率
    bumpStun: 0.7,                                        // ぶつかったときによろけて動けない時間（秒）
  },
  // ---- Phase 3：ラリーと点数 ----
  winScore: 3,                                            // 先に取ったほうの勝ち
  resetMax: 3.0,                                          // 点が決まってから、定位置へ戻るのを待つ最長（秒）
  // ---- Phase 4a：吹っ飛び・爆発 ----
  blast: {
    radius: 12, minPower: 0.45,                           // 爆発した側：中心から遠いほど弱まるが、最低でもこの強さで飛ぶ
    nearRadius: 4, nearPower: 0.4,                        // 反対側：この距離以内なら軽く飛ぶ
    speed: 11, up: 13, jitter: 0.35,                      // 横・上の初速（強さ 1 のとき m/s）と毎回のばらつき（±35%）
    superChance: 0.15, superMul: 1.7,                     // たまに 1 人だけ異常に高く飛ぶ（上の初速が 1.7 倍）
    spin: 14,                                             // 空中で回る速さの幅（rad/s）
    center: 1.0, r: 0.45,                                 // 体の中心の高さ、体の当たり判定（球）の半径
    bounce: 0.45, floorBounce: 0.3, landSpeed: 4,         // 跳ね返り。床へ秒速 landSpeed 以上で落ちたら弾む
    friction: 4,                                          // 床を滑るときの減速 m/s²（秒速 8m なら 8m 滑る）
    stickSpeed: 8, stickTime: 0.35, slideDown: 3.5,       // この速さ以上で壁に当たると張り付き、少ししてずり落ちる
    netHang: 0.25, hangTime: 1.0,                         // ネットに引っかかる確率と、ぶら下がる時間
    downTime: 0.8, getupTime: 0.6,                        // 倒れている時間、起き上がるのにかかる時間
    maxTime: 6,                                           // 爆発からこれ以上は待たずに点を進める（秒）
    outward: 0.5,                                         // 飛ぶ向きを自陣の奥（横の壁）へ寄せる強さ
    zFront: 0.15, zBack: 0.8,                             // 手前（カメラ側）・奥へ飛ぶ速さの倍率。手前へ飛ぶと画面の外へ出るので弱める
  },
  fx: { freeze: 0.12 },                                   // 爆発の瞬間に画面を止める時間（秒）
  camera: { y: 8.5, z: 17, lookY: 2.0, fov: 42, follow: 0.25, boomFov: 58, boomLookY: 3.3 },   // 爆発の間は画角を広げて、天井・横の壁・倒れた人まで入れる
};
// ===== 爆弾の物理（three.js 非依存） =====
// 爆弾は床に触れたときだけ爆発する。天井・壁・ネット・選手には跳ね返るだけ。
function newBall(x, y, z) {
  return { pos: { x, y, z }, vel: { x: 0, y: 0, z: 0 }, live: true };
}
function sideOf(x) { return x < 0 ? 0 : 1; }             // 0 = 味方（左）、1 = 敵（右）
function inCourt(x, z) { return Math.abs(x) <= CFG.court.halfLen && Math.abs(z) <= CFG.court.halfWid; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

// dt 秒進める。床に触れたら { x, z, side } を返して live=false にする。それ以外は null。
// players: [{ x, z }] 選手の足元。rand: 0..1 の乱数（テストで固定するため）
function stepBall(b, dt, players, rand) {
  if (!b.live) return null;
  rand = rand || Math.random;
  const n = Math.max(1, Math.ceil(dt / CFG.ball.maxStep - 1e-9));   // すり抜けないよう細かく刻む
  const h = dt / n, g = CFG.gravity;
  for (let i = 0; i < n; i++) {
    b.pos.x += b.vel.x * h;
    b.pos.y += (b.vel.y - 0.5 * g * h) * h;              // 重力一定なので、この刻みでも放物線は正確
    b.pos.z += b.vel.z * h;
    b.vel.y -= g * h;
    const hit = collideBall(b, players || [], rand);
    if (hit) return hit;
  }
  return null;
}

function collideBall(b, players, rand) {
  const r = CFG.ball.r, G = CFG.gym, e = CFG.ball.bounce, p = b.pos, v = b.vel;
  // 床：ここだけ爆発する
  if (p.y - r <= 0) {
    p.y = r;
    b.live = false;
    return { x: p.x, z: p.z, side: sideOf(p.x) };
  }
  // 天井・壁（手前の壁は見えないが当たる）
  if (p.y + r > G.ceil)   { p.y = G.ceil - r;   if (v.y > 0) v.y = -v.y * e; }
  if (p.x - r < -G.halfX) { p.x = -G.halfX + r; if (v.x < 0) v.x = -v.x * e; }
  if (p.x + r >  G.halfX) { p.x =  G.halfX - r; if (v.x > 0) v.x = -v.x * e; }
  if (p.z - r < -G.halfZ) { p.z = -G.halfZ + r; if (v.z < 0) v.z = -v.z * e; }
  if (p.z + r >  G.halfZ) { p.z =  G.halfZ - r; if (v.z > 0) v.z = -v.z * e; }
  // ネット（白帯から下 1m の薄い板）
  const N = CFG.net;
  sphereBox(b, { minX: -N.thick / 2, maxX: N.thick / 2, minY: N.bottom, maxY: N.top, minZ: -N.halfWid, maxZ: N.halfWid }, CFG.ball.netBounce);
  for (const pl of players) hitPlayer(b, pl, rand);
  return null;
}

// 球と箱。重なっていれば外へ押し出し、面の向きの速さを反転して e 倍にする
function sphereBox(b, box, e) {
  const p = b.pos, v = b.vel, r = CFG.ball.r;
  let dx = p.x - clamp(p.x, box.minX, box.maxX);
  let dy = p.y - clamp(p.y, box.minY, box.maxY);
  let dz = p.z - clamp(p.z, box.minZ, box.maxZ);
  const d2 = dx * dx + dy * dy + dz * dz;
  if (d2 >= r * r) return false;
  let d = Math.sqrt(d2);
  if (d < 1e-6) {                                         // 中心が箱の中：x の向きに押し出す（ネットは薄いので）
    const left = p.x < (box.minX + box.maxX) / 2;
    p.x = left ? box.minX - r : box.maxX + r;
    dx = left ? -1 : 1; dy = 0; dz = 0; d = 1;
  } else {
    const k = (r - d) / d;
    p.x += dx * k; p.y += dy * k; p.z += dz * k;
  }
  const nx = dx / d, ny = dy / d, nz = dz / d;
  const vn = v.x * nx + v.y * ny + v.z * nz;
  if (vn < 0) { const j = (1 + e) * vn; v.x -= j * nx; v.y -= j * ny; v.z -= j * nz; }
  return true;
}

// 選手は足元から高さ h の円柱。横から当たれば横へ、頭の上なら上へ弾く
function hitPlayer(b, pl, rand) {
  const R = CFG.player.r, H = CFG.player.h, r = CFG.ball.r, e = CFG.ball.playerBounce, p = b.pos, v = b.vel;
  const dx = p.x - pl.x, dz = p.z - pl.z, d = Math.hypot(dx, dz);
  if (p.y - r >= H || d >= R + r) return false;
  if (p.y > H && d < R) {                                 // 頭の上：上へ弾く。真上で止まらないよう横にも押す
    p.y = H + r;
    if (v.y < 0) v.y = -v.y * e;
    const a = rand() * Math.PI * 2;
    v.x += Math.cos(a) * 1.2; v.z += Math.sin(a) * 1.2;
    return true;
  }
  const nx = d < 1e-6 ? 1 : dx / d, nz = d < 1e-6 ? 0 : dz / d;
  p.x = pl.x + nx * (R + r); p.z = pl.z + nz * (R + r);
  const vn = v.x * nx + v.z * nz;
  if (vn < 0) { const j = (1 + e) * vn; v.x -= j * nx; v.z -= j * nz; }
  return true;
}
// ===== 打ち出しの計算（three.js 非依存） =====
// from から打ち出し、床からの高さ apex の最高点を通って、to（x, z）の地点で床に触れる初速を返す。
// 「床に触れる」は爆弾の中心が半径 r の高さになったとき。apex が打つ高さより低いときは打つ高さを最高点とする
function shotVelocity(from, to, apex) {
  const g = CFG.gravity, r = CFG.ball.r;
  const top = Math.max(apex, from.y + 0.01, r + 0.01);
  const vy = Math.sqrt(2 * g * (top - from.y));
  const t = vy / g + Math.sqrt(2 * (top - r) / g);          // 上がる時間＋最高点から床までの時間
  return { x: (to.x - from.x) / t, y: vy, z: (to.z - from.z) / t };
}

// 爆弾を試しに動かして（選手は無視）、高さ h まで降りてきたときの位置と、今からの時間を返す。
// 上りの途中で h を通っても数えない。先に床に触れるなら null
function predictDescent(ball, h, maxT) {
  const b = { pos: { ...ball.pos }, vel: { ...ball.vel }, live: true };
  const dt = 1 / 120;
  for (let t = 0; t < (maxT || 6); ) {
    const hit = stepBall(b, dt, [], () => 0.5);
    t += dt;
    if (hit) return h <= CFG.ball.r + 0.05 ? { x: hit.x, z: hit.z, t } : null;   // 床の高さを聞かれたなら、床に触れた場所が答え（刻みの間に抜けるため）
    if (b.vel.y < 0 && b.pos.y <= h) return { x: b.pos.x, z: b.pos.z, t };
  }
  return null;
}

// 強打：from から to（x, z の床）へ、横の速さ speed で叩き込む初速。
// ネットの白帯にかかるなら、速さを落として（＝山なりにして）越えられる速さを探す
function spikeVelocity(from, to, speed) {
  const g = CFG.gravity, r = CFG.ball.r, N = CFG.net;
  const dx = to.x - from.x, dz = to.z - from.z, dist = Math.hypot(dx, dz);
  for (let s = speed; s >= 6; s -= 0.5) {
    const t = dist / s;
    const v = { x: dx / t, y: (r - from.y + 0.5 * g * t * t) / t, z: dz / t };
    if (from.x * to.x >= 0) return v;                     // ネットを越えない打球は確かめない
    const tc = -from.x / v.x;                             // ネットの真上を通る時刻
    const yc = from.y + v.y * tc - 0.5 * g * tc * tc;
    if (yc - r > N.top + 0.05) return v;
  }
  return shotVelocity(from, to, from.y + 1.5);            // どうしても越えないなら山なりで
}
// ===== 選手の動き（three.js 非依存） =====
// actor = { id, team, x, z, y（跳んでいる高さ）, vy, home（仕事が無いとき戻る所）, base（定位置）, task, moving, lastHit }
// task  = { kind, ok, contact, h, at, pending, jump, jumpAt, jumped, jumpOnArrive, whiff, end, then, target, hold, contactAt, start }
function newActor(id, team, x, z) {
  return { id, team, x, z, y: 0, vy: 0, home: { x, z }, base: { x, z }, task: null, moving: false, lastHit: null, stun: 0, fly: null };
}
function dirOf(team) { return team === 0 ? 1 : -1; }      // 相手コートの向き（x の符号）
function riseTime() { return Math.sqrt(2 * CFG.jumpH / CFG.gravity); }   // 踏み切ってから最高点まで

// dt 進める。地上なら task.at（仕事が無ければ home）へ走る。jumpAt を過ぎたら跳ぶ
function stepActor(a, dt, simT) {
  const t = a.task;
  if (a.y > 0) {
    a.vy -= CFG.gravity * dt;
    a.y += a.vy * dt;
    if (a.y <= 0) { a.y = 0; a.vy = 0; }
  }
  const g = t ? t.at : a.home;
  a.moving = false;
  if (a.stun > 0) a.stun = Math.max(0, a.stun - dt);
  const waiting = t && t.delay && simT < t.start + t.delay;   // 反応が遅れて、まだ動き出さない
  if (a.y === 0 && !waiting && !(a.stun > 0)) {
    const dx = g.x - a.x, dz = g.z - a.z, d = Math.hypot(dx, dz), step = CFG.runSpeed * dt;
    if (d > 0.02) {
      a.moving = true;
      if (d <= step) { a.x = g.x; a.z = g.z; } else { a.x += dx / d * step; a.z += dz / d * step; }
    }
  }
  if (t && t.jumpOnArrive && t.jumpAt == null && !a.moving) t.jumpAt = simT;
  if (t && t.jumpAt != null && !t.jumped && simT >= t.jumpAt && a.y === 0) {
    t.jumped = true;
    a.vy = Math.sqrt(2 * CFG.gravity * CFG.jumpH);
    a.y = 1e-4;
  }
}

// 爆弾に触れたか。'hit' / 'miss' / null（まだ）
function checkContact(a, ball) {
  const t = a.task;
  if (!t || !t.contact || t.pending || !ball.live || ball.held) return null;
  const p = ball.pos;
  if (t.kind === 'block') {                               // 手の範囲（ネット側へ 0.15m、肩幅＋腕 ±0.45m、跳んだ高さ＋1.8〜2.3m）に触れたら止める
    const hx = a.x + dirOf(a.team) * 0.15, r = CFG.ball.r;
    const dx = Math.max(Math.abs(p.x - hx) - 0.12, 0);
    const dz = Math.max(Math.abs(p.z - a.z) - 0.45, 0);
    const dy = Math.max(a.y + 1.8 - p.y, p.y - (a.y + 2.3), 0);
    if (a.y > 0.1 && dx * dx + dy * dy + dz * dz <= r * r) return 'hit';
    if (p.x * dirOf(a.team) < -1.0) return 'miss';        // 自陣の奥へ抜けた
    return null;
  }
  if (ball.vel.y > 0 || p.y > t.h) return null;           // まだ上にある
  if (Math.hypot(p.x - a.x, p.z - a.z) <= CFG.reach) return t.whiff ? 'miss' : 'hit';
  if (p.y < t.h - 0.6) return 'miss';
  return null;
}

// 選手どうしが重ならないよう押し合う。2 人とも爆弾へ走っていてぶつかったら、よろけて少し動けない
function separateActors(R) {
  const A = R.actors, min = CFG.player.r * 2;
  for (let i = 0; i < A.length; i++) for (let j = i + 1; j < A.length; j++) {
    const a = A[i], b = A[j];
    if (a.y > 0 || b.y > 0 || a.fly || b.fly) continue;
    const dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz);
    if (d >= min) continue;
    const nx = d > 1e-6 ? dx / d : 1, nz = d > 1e-6 ? dz / d : 0, push = (min - d) / 2;
    a.x -= nx * push; a.z -= nz * push;
    b.x += nx * push; b.z += nz * push;
    const chasing = o => o.task && o.task.contact && o.moving && !(o.stun > 0);
    if (chasing(a) && chasing(b)) {
      a.stun = b.stun = CFG.ai.bumpStun;
      R.events.push({ type: 'bump', a, b });
    }
  }
}
// ===== ラリーの流れ（three.js 非依存） =====
// R.state: 'choose'（スローで選択中）/ 'play'（それ以外の試合中）/ 'boom'（床に触れたあと）/ 'reset'（点のあと定位置へ戻る）/ 'over'（試合終了）
// 選ぶ場面: 'serve' ①自分のサーブ番 / 'incoming' ②相手が打った（attack なら相手のトス＝アタックが来る）/ 'tossed' ③味方が自分にトスした
// 描画側へは R.events に出来事を積む：choose / chosen / hit / miss / floor / explode / point / gameover / bump
const ACTIONS = ['receive', 'attack', 'block', 'serve'];

function newRally(rand) {
  const actors = CFG.startSpots.map((s, i) => newActor(i, s.team, s.x, s.z));
  return {
    state: 'play', simT: 0, ball: null, actors, me: actors[0], mate: actors[1],
    choose: null, boom: null, awaiting: false, events: [], rand: rand || Math.random,
    score: [0, 0], winner: null, resetT: 0, nextServe: 0, enemyServer: 0,
    idle: [false, false],                                 // テスト用：true のチームは AI が受けに行かない
  };
}
function partnerOf(R, a) { return R.actors.find(o => o.team === a.team && o !== a); }
function roll(R, p) { return R.rand() < p; }

function mishap(R, p) { return R.rand() >= 1 - p; }       // AI のミス（rand が 0 なら起きない）
function speedOf(b) { return Math.hypot(b.vel.x, b.vel.y, b.vel.z); }
// AI の反応の遅れ（秒）
function reaction(R) {
  const D = CFG.ai.delay;
  return D[0] + R.rand() * (D[1] - D[0]) + (mishap(R, CFG.ai.slowChance) ? CFG.ai.slowDelay : 0);
}
// AI のレシーブ（強い球なら成功率が下がる。反応の遅れあり）
function aiReceive(R, a, kind, hard) {
  const t = giveTask(R, a, kind || 'receive', roll(R, hard ? CFG.ai.dig : CFG.ai.receive), { h: CFG.contactH.receive });
  t.delay = reaction(R);
  return t;
}

// こちらの球が敵の側へ来た：落下地点に近いほうがレシーブ。bothGo なら 2 人とも向かう
function enemyDefend(R) {
  if (R.idle[1]) return;
  const land = predictDescent(R.ball, CFG.contactH.receive);
  const free = R.actors.filter(a => a.team === 1 && !(a.task && a.task.kind === 'block'));
  if (!land || !free.length) return;
  const dist = a => Math.hypot(a.x - land.x, a.z - land.z);
  free.sort((a, b) => dist(a) - dist(b));
  const hard = speedOf(R.ball) > CFG.hardSpeed;
  aiReceive(R, free[0], 'receive', hard);
  if (free[1] && mishap(R, CFG.ai.bothGo)) aiReceive(R, free[1], 'receive', hard);
}

// こちらのアタッカーがアタックに入った：blockTry の確率で、アタッカーに近い敵がブロックに跳ぶ
function enemyMaybeBlock(R, attacker) {
  if (R.idle[1] || !mishap(R, CFG.ai.blockTry)) return;
  const z = attacker.task.at.z;
  const opp = R.actors.filter(a => a.team === 1).sort((a, b) => Math.abs(a.z - z) - Math.abs(b.z - z));
  giveBlock(R, opp[0], roll(R, CFG.ai.block));
}

// サーブする人と、その立ち位置
function serverOf(R, team) { return team === 0 ? R.me : R.actors[2 + R.enemyServer]; }
function serveSpotOf(a) { return { x: -dirOf(a.team) * CFG.serveSpot, z: a.base.z * 0.5 }; }

// 試合を始める（0-0、自分のサーブ）
function newGame(R) {
  R.score = [0, 0]; R.winner = null;
  startPoint(R, 0);
}

// 全員を定位置に置いて、すぐ team のサーブを始める（試合の最初とテスト用）
function startPoint(R, team) {
  for (const a of R.actors) {
    a.task = null; a.y = 0; a.vy = 0; a.lastHit = null; a.stun = 0; a.fly = null;
    a.home = { ...a.base }; a.x = a.base.x; a.z = a.base.z;
  }
  const s = serverOf(R, team);
  s.home = serveSpotOf(s); s.x = s.home.x; s.z = s.home.z;
  startServe(R, team);
}

// その場からサーブを始める。0 ならプレイヤーの①の選択、1 なら敵がサーブ（2 人が交代で打つ）
function startServe(R, team) {
  R.boom = null; R.choose = null; R.awaiting = false; R.state = 'play';
  const s = serverOf(R, team);
  R.ball = newBall(s.x, 1.2, s.z);
  R.ball.held = s;
  if (team === 0) { openChoice(R, 'serve'); return; }
  R.enemyServer ^= 1;
  giveServe(R, s, roll(R, CFG.ai.serve));
}

// 爆発を見せきったあと：点を入れ、勝敗が決まっていなければ定位置へ戻り始める
function endPoint(R, loser) {
  const scorer = 1 - loser;
  R.score[scorer]++;
  R.events.push({ type: 'point', scorer, score: R.score.slice() });
  R.boom = null; R.ball = null;
  for (const a of R.actors) { a.task = null; a.home = { ...a.base }; }
  if (R.score[scorer] >= CFG.winScore) {
    R.state = 'over'; R.winner = scorer;
    R.events.push({ type: 'gameover', winner: scorer, score: R.score.slice() });
    return;
  }
  R.state = 'reset'; R.resetT = 0; R.nextServe = loser;   // 取られた側がサーブ
  const s = serverOf(R, loser);
  s.home = serveSpotOf(s);
}

// 4 つの行動はどの場面でも押せる。場面に合わない行動は、合わないなりの動きになる（本人の判断、2026-10-05）
function openChoice(R, scene, attack) {
  R.state = 'choose';
  R.choose = { scene, attack: !!attack, left: CFG.choiceTime };
  R.events.push({ type: 'choose', scene, attack: !!attack });
}

// 爆弾がそのまま落ちると team の側か
function headingTo(R, team) {
  const l = predictDescent(R.ball, CFG.ball.r + 0.01);
  return !!l && sideOf(l.x) === team;
}

// 仕事を渡す。爆弾がもう自分の側へ来ているなら、すぐ行き先を決める（来ていなければ pending のまま）
function giveTask(R, a, kind, ok, extra) {
  a.task = Object.assign({ kind, ok, contact: true, pending: true, at: { x: a.x, z: a.z }, start: R.simT }, extra);
  const t = a.task;
  if (t.contact && t.pending && headingTo(R, a.team)) aimTask(R, a);
  return t;
}

// 落ちてくる場所を予測して行き先を決める。ネットを越えて相手側へは行かない
function aimTask(R, a) {
  const t = a.task, p = predictDescent(R.ball, t.h);
  if (!p) return;
  const G = CFG.gym;
  let x = clamp(p.x, -G.halfX + 0.5, G.halfX - 0.5);
  x = a.team === 0 ? Math.min(x, -0.4) : Math.max(x, 0.4);
  t.at = { x, z: clamp(p.z, -G.halfZ + 0.5, G.halfZ - 0.5) };
  t.pending = false;
  t.contactAt = R.simT + p.t;
  if (t.jump) t.jumpAt = t.contactAt - riseTime();
}
function retarget(R, team) {
  for (const a of R.actors) if (a.team === team && a.task && a.task.pending && a.task.kind !== 'block') aimTask(R, a);
}

function giveServe(R, a, ok) {
  const t = giveTask(R, a, 'serve', ok, { h: CFG.contactH.serve, pending: false, hold: R.simT + CFG.serveHold, jump: true });
  t.jumpAt = t.hold + 0.3;
}
function giveReceive(R, a, ok) { return giveTask(R, a, 'receive', ok, { h: CFG.contactH.receive }); }
function giveReturn(R, a, ok) { return giveTask(R, a, 'return', ok, { h: CFG.contactH.receive }); }
function giveToss(R, a, target) { return giveTask(R, a, 'toss', roll(R, CFG.ai.toss), { h: CFG.contactH.toss, target }); }
function giveAttack(R, a, ok, kind) {
  const whiff = !ok && R.rand() < 0.5;                    // 失敗の半分は空振り、残りはネットにかける
  const t = giveTask(R, a, kind || 'attack', ok, { h: kind === 'direct' ? CFG.contactH.direct : CFG.contactH.attack, jump: true, whiff });
  if (a !== R.me && t.jumpAt != null && mishap(R, CFG.ai.earlyJump)) {   // AI：ジャンプが早すぎて空振り
    t.jumpAt -= 0.35;
    t.whiff = true;
  }
  if (a.team === 0) enemyMaybeBlock(R, a);
  return t;
}
// ブロック：相手のアタッカーの正面のネット際へ行き、打つ瞬間に合わせて跳ぶ
function giveBlock(R, a, ok) {
  const opp = R.actors.find(o => o.team !== a.team && o.task && (o.task.kind === 'attack' || o.task.kind === 'direct'));
  const z = opp ? opp.task.at.z : R.ball.pos.z;
  const t = giveTask(R, a, 'block', ok, { pending: false, at: { x: -dirOf(a.team) * 0.5, z: clamp(z, -4, 4) } });
  if (opp && opp.task.contactAt != null) t.jumpAt = opp.task.contactAt - riseTime() + 0.05;
  else t.jumpOnArrive = true;
  return t;
}
// 場面に合わない動き：'blockNoop' はネット際で跳ぶだけ、'whiff' はその場でサーブの構えをして空振り
function giveNoop(R, a, kind, then) {
  if (kind === 'blockNoop') return giveTask(R, a, kind, false, { contact: false, pending: false, at: { x: -dirOf(a.team) * 0.5, z: a.z }, jumpOnArrive: true, then });
  return giveTask(R, a, kind, false, { contact: false, pending: false, end: R.simT + 1.0, then });
}

// プレイヤーが選んだ（action が null なら時間切れ）
function choose(R, action) {
  if (R.state !== 'choose') return;
  const sc = R.choose.scene, attack = R.choose.attack, me = R.me, mate = R.mate, P = CFG.success, b = R.ball;
  R.choose = null; R.state = 'play';
  R.events.push({ type: 'chosen', action, scene: sc });
  if (sc === 'serve') {
    if (action === 'serve' || action === null) giveServe(R, me, roll(R, P.serve.serve));
    else if (action === 'block') giveNoop(R, me, 'blockNoop', () => openChoice(R, 'serve'));   // 爆弾を持ったままネット際で跳び、戻ってもう一度選ぶ
    else {                                                // その場で爆弾を放り上げ、レシーブかアタックで打つ
      const d = dirOf(me.team);
      b.held = null;
      b.pos = { x: me.x + d * 0.3, y: 1.3, z: me.z };
      b.vel = { x: 0, y: action === 'receive' ? 2.5 : 4, z: 0 };
      giveTask(R, me, action === 'receive' ? 'bump' : 'standSpike', roll(R, P.serve[action]),
        { h: action === 'receive' ? 0.9 : 1.9, pending: false });
    }
    return;
  }
  if (sc === 'incoming') {
    R.awaiting = true;
    const hard = attack || speedOf(b) > CFG.hardSpeed;
    if (action === 'receive') {
      giveReceive(R, me, roll(R, P.incoming.receive));
      if (mishap(R, CFG.ai.bothGo)) aiReceive(R, mate, 'receive', hard);   // 味方も向かってしまう
    } else if (action === 'attack') {
      giveAttack(R, me, roll(R, hard ? P.incoming.directHard : P.incoming.directSoft), 'direct');
    } else {
      if (action === 'block') giveBlock(R, me, attack && roll(R, P.incoming.block));
      else if (action === 'serve') giveNoop(R, me, 'whiff');
      aiReceive(R, mate, 'receive', hard);                // 空いた所は味方がカバー（時間切れも同じ）
    }
    return;
  }
  // 'tossed'
  if (action === 'attack') giveAttack(R, me, roll(R, P.tossed.attack));
  else if (action === 'receive') giveReturn(R, me, roll(R, P.tossed.receive));
  else if (action === 'block') giveNoop(R, me, 'blockNoop');
  else if (action === 'serve') giveNoop(R, me, 'whiff');
  else aiReceive(R, mate, 'return', false);              // 時間切れ：味方が返す
}

// 相手がブロックに跳んでいれば、そのブロックの成否に合わせてコースを決める：
// 成功（ok）なら手のある線へ打ち込む（＝手に当たって止まる）、失敗なら手の横 1.4m を抜く線にする
function spikeTarget(R, a, from, to) {
  const blk = R.actors.find(o => o.team !== a.team && o.task && o.task.kind === 'block');
  if (!blk) return to;
  const bx = blk.task.at.x + dirOf(blk.team) * 0.15;
  const bz = blk.task.at.z + (blk.task.ok ? 0 : (R.rand() < 0.5 ? -1.4 : 1.4));
  const W = CFG.court.halfWid - 0.3, dz = bz - from.z;
  let k = (to.x - from.x) / (bx - from.x);                // 手の位置を通る線を、床まで延ばす
  if (Math.abs(dz) > 1e-6) k = Math.min(k, (Math.sign(dz) * W - from.z) / dz);   // コートの横からはみ出さない所まで
  k = Math.max(k, 1.5);
  return { x: from.x + (bx - from.x) * k, z: from.z + dz * k };
}

// 打った球の初速。成功なら狙いどおり、失敗なら笑える方向へ
function shotFor(R, a, t) {
  const d = dirOf(a.team), p = R.ball.pos, rnd = R.rand, S = CFG.shots, W = CFG.court.halfWid - 0.7;
  const from = { x: p.x, y: p.y, z: p.z };
  const opp = (x0, x1) => ({ x: d * (x0 + rnd() * (x1 - x0)), z: (rnd() * 2 - 1) * W });   // 相手コートのネットから x0〜x1 m
  const shank = () => shotVelocity(from, { x: -d * (9.5 + rnd() * 3), z: (rnd() * 2 - 1) * 7 }, from.y + 1.5 + rnd() * 2);   // 自陣の後ろへ弾く
  const intoNet = () => { const dx = -p.x, dy = 1.7 - p.y, n = Math.hypot(dx, dy) || 1; return { x: dx / n * 14, y: dy / n * 14, z: 0 }; };
  switch (t.kind) {
    case 'receive': return t.ok ? shotVelocity(from, { x: -d * S.pass.toX, z: 0 }, S.pass.apex) : shank();
    case 'toss':
      return t.ok ? shotVelocity(from, { x: -d * S.set.toX, z: clamp(t.target.z, -3.5, 3.5) }, S.set.apex)
                  : shotVelocity(from, { x: -d * 0.3, z: p.z }, from.y + 0.8);          // 低いトスでネット際に落ちる
    case 'attack': case 'direct': case 'standSpike':
      return t.ok ? spikeVelocity(from, spikeTarget(R, a, from, opp(4.5, 8.5)), S.spikeSpeed) : intoNet();
    case 'block': return spikeVelocity(from, opp(1.5, 4), 10);
    case 'return': return t.ok ? shotVelocity(from, opp(5, 8.5), S.returnApex) : shank();
    case 'bump': return t.ok ? shotVelocity(from, opp(5, 8.5), S.returnApex) : shotVelocity(from, { x: p.x - d * 0.6, z: p.z + 0.4 }, from.y + 1.2);   // 足元に落とす
    case 'serve': return t.ok ? shotVelocity(from, opp(3, 8.5), S.serveApex) : shotVelocity(from, { x: -d * 0.6, z: p.z * 0.5 }, from.y + 0.3);   // ネットに届かない
  }
  return { x: 0, y: 0, z: 0 };
}

// 打ったあと：レシーブ → 相方がトス、トス → 相方（レシーブした人）がアタック。相手側へ飛んだら相手の pending を決める
function afterHit(R, a, t) {
  const partner = partnerOf(R, a);
  if (a.team === 0) R.awaiting = false;
  if (t.ok && t.kind === 'receive') giveToss(R, partner, a);
  if (t.ok && t.kind === 'toss') {
    if (partner === R.me) openChoice(R, 'tossed');
    else giveAttack(R, partner, roll(R, CFG.ai.attack));
    if (a.team === 1 && !R.awaiting && R.state !== 'choose') openChoice(R, 'incoming', true);   // 敵のトス＝アタックが来る
  }
  if (!headingTo(R, a.team)) {                            // 相手側へ飛んだ
    retarget(R, 1 - a.team);
    if (a.team === 0) enemyDefend(R);
    if (a.team === 1 && !R.awaiting && R.state !== 'choose') openChoice(R, 'incoming', false);
  }
}

function resolveContact(R, a, c) {
  const t = a.task;
  a.task = null;
  a.home = { ...a.base };                                 // サーブを打ったら定位置へ戻る
  if (c === 'miss') { R.events.push({ type: 'miss', actor: a, kind: t.kind }); return; }   // 2 人で追っていれば、もう 1 人はそのまま追う
  const p = partnerOf(R, a);
  if (p.task && p.task.contact && p.task.kind === t.kind) p.task = null;   // もう 1 人が触った球は追わない
  a.lastHit = { kind: t.kind, at: R.simT };
  R.ball.vel = shotFor(R, a, t);
  R.events.push({ type: 'hit', actor: a, kind: t.kind, ok: t.ok });
  afterHit(R, a, t);
}

function onFloor(R, hit) {
  for (const a of R.actors) a.task = null;
  R.state = 'boom'; R.choose = null;
  R.boom = { t: 0, hit, fired: false };
  R.events.push({ type: 'floor', x: hit.x, z: hit.z, side: hit.side });
}

// realDt（実時間）進める。選択中はゲームの時間を slowScale 倍にする
function tickRally(R, realDt) {
  const dt = R.state === 'choose' ? realDt * CFG.slowScale : realDt;
  if (R.state === 'choose') R.choose.left -= realDt;
  R.simT += dt;
  for (const a of R.actors) { if (a.fly) stepFly(a, dt, R); else stepActor(a, dt, R.simT); }
  separateActors(R);
  collideFlyers(R);
  for (const a of R.actors) {                             // 爆弾に触らない動き（空振り・跳ぶだけ）の終わり
    const t = a.task;
    if (!t || t.contact) continue;
    if (t.end != null ? R.simT >= t.end : (t.jumped && a.y === 0)) { a.task = null; if (t.then) t.then(); }
  }
  const b = R.ball;
  if (b && b.held) {
    const a = b.held, d = dirOf(a.team), t = a.task;
    b.pos = { x: a.x + d * 0.35, y: a.y + 1.15, z: a.z };
    if (t && t.kind === 'serve' && R.simT >= t.hold) {    // 構えの間が終わったらトスを上げる
      b.held = null;
      b.pos = { x: a.x + d * 0.3, y: 2.0, z: a.z };
      b.vel = { x: d * 0.4, y: 4.5, z: 0 };
    }
  } else if (b && b.live) {
    for (const a of R.actors) { const c = checkContact(a, b); if (c) resolveContact(R, a, c); }
    const colliders = R.actors.filter(a => !(a.task && a.task.contact) && !(a.lastHit && R.simT - a.lastHit.at < 0.4)).map(a => ({ x: a.x, z: a.z }));   // 打とうとしている人・打ったばかりの人には当たらない（打った球を自分の体で弾かない）
    const hit = stepBall(b, dt, colliders, R.rand);
    if (hit) onFloor(R, hit);
  }
  if (R.state === 'choose' && R.choose.left <= 0) choose(R, null);   // 時間切れ：味方に任せる
  if (R.state === 'boom') {
    R.boom.t += realDt;
    if (!R.boom.fired && R.boom.t >= CFG.explodeDelay) {
      R.boom.fired = true;
      R.events.push({ type: 'explode', x: R.boom.hit.x, z: R.boom.hit.z, side: R.boom.hit.side });
      blastActors(R, R.boom.hit);                         // 選手を吹っ飛ばす
    }
    const settled = R.actors.every(a => !a.fly);          // 全員が起き上がった
    if (R.boom.t >= CFG.explodeDelay + CFG.afterBoom && (settled || R.boom.t >= CFG.blast.maxTime)) endPoint(R, R.boom.hit.side);
  }
  if (R.state === 'reset') {                              // 全員が定位置（サーブの人はサーブ位置）に着いたら次のサーブ
    R.resetT += realDt;
    const flying = R.actors.some(a => a.fly);
    if (flying) R.resetT = 0;
    const home = R.actors.every(a => Math.hypot(a.x - a.home.x, a.z - a.home.z) < 0.05);
    if (!flying && (home || R.resetT > CFG.resetMax)) startServe(R, R.nextServe);
  }
}
// ===== 吹っ飛び（three.js 非依存） =====
// 爆発で選手を体ごと飛ばす。体は中心の高さ center・半径 r の球として、天井・壁・床・ネット・他の選手に当たる
// actor.fly = { pos（体の中心）, vel, rx, rz（回転）, spinX, spinZ, state, t, hung }
// state: 'air' 飛んでいる / 'stick' 壁に張り付き→ずり落ちる / 'slide' 床を滑る / 'hang' ネットにぶら下がる / 'down' 倒れている / 'getup' 起き上がる
// 起き上がり終わると actor.fly は null に戻り、普段の動き（stepActor）に戻る

// 体ごと飛ばす（今の仕事は捨てる）
function launch(R, a, vel) {
  const B = CFG.blast;
  a.task = null; a.stun = 0;
  a.fly = {
    pos: { x: a.x, y: a.y + B.center, z: a.z }, vel, rx: 0, rz: 0,
    spinX: (R.rand() - 0.5) * B.spin, spinZ: (R.rand() - 0.5) * B.spin, state: 'air', t: 0, hung: false,
  };
}

// 爆発（hit = { x, z, side }）で選手を飛ばす。爆発した側は全員、反対側は爆心の近くの人だけ軽く
function blastActors(R, hit) {
  const B = CFG.blast;
  for (const a of R.actors) {
    const dx = a.x - hit.x, dz = a.z - hit.z, d = Math.hypot(dx, dz);
    let k;
    if (a.team === hit.side) k = Math.max(B.minPower, 1 - d / B.radius);
    else if (d < B.nearRadius) k = B.nearPower * (1 - d / B.nearRadius);
    else continue;
    let nx, nz;
    if (d > 0.1) { nx = dx / d; nz = dz / d; }
    else { const ang = R.rand() * Math.PI * 2; nx = Math.cos(ang); nz = Math.sin(ang); }   // 真上で爆発したら向きはでたらめ
    nx += (a.x < 0 ? -1 : 1) * B.outward;                 // 自陣の奥（横の壁）のほうへ寄せる
    const nn = Math.hypot(nx, nz) || 1;
    nx /= nn; nz /= nn;
    nz *= nz > 0 ? B.zFront : B.zBack;                    // カメラのほう（+z）へはあまり飛ばさない（画面の外へ出るため）
    const jit = () => 1 + (R.rand() - 0.5) * 2 * B.jitter;
    const side = B.speed * k * jit();
    const up = B.up * k * jit() * (mishap(R, B.superChance) ? B.superMul : 1);
    launch(R, a, { x: nx * side, y: up, z: nz * side });
  }
}

// 体とネット（白帯から下 1m の薄い板）。引っかかったら true
function hitNetBody(a, R) {
  const f = a.fly, p = f.pos, v = f.vel, N = CFG.net, B = CFG.blast, r = B.r;
  const dx = p.x - clamp(p.x, -N.thick / 2, N.thick / 2);
  const dy = p.y - clamp(p.y, N.bottom, N.top);
  const dz = p.z - clamp(p.z, -N.halfWid, N.halfWid);
  const d = Math.hypot(dx, dy, dz);
  if (d >= r) return false;
  const side = p.x < 0 ? -1 : 1;
  if (!f.hung && mishap(R, B.netHang)) {                  // ネットに引っかかってぶら下がる
    f.hung = true; f.state = 'hang'; f.t = 0;
    p.x = side * 0.3; p.y = N.top - 0.35; p.z = clamp(p.z, -N.halfWid + 0.5, N.halfWid - 0.5);
    v.x = v.y = v.z = 0;
    R.events.push({ type: 'net', actor: a });
    return true;
  }
  if (d < 1e-6) {                                         // 中心がネットの中：来た側へ押し出す
    p.x = side * (N.thick / 2 + r);
    if (v.x * side < 0) v.x = -v.x * B.bounce;
    return false;
  }
  const k = (r - d) / d;
  p.x += dx * k; p.y += dy * k; p.z += dz * k;
  const nx = dx / d, ny = dy / d, nz = dz / d, vn = v.x * nx + v.y * ny + v.z * nz;
  if (vn < 0) { const j = (1 + B.bounce) * vn; v.x -= j * nx; v.y -= j * ny; v.z -= j * nz; }
  return false;
}

// 壁（x=±halfX, z=±halfZ）。速く当たったら張り付く（true）、遅ければ跳ね返る
function hitWallsBody(a, R, canStick) {
  const f = a.fly, p = f.pos, v = f.vel, G = CFG.gym, B = CFG.blast;
  for (const [ax, lim] of [['x', G.halfX], ['z', G.halfZ]]) {
    if (Math.abs(p[ax]) + B.r <= lim) continue;
    const s = Math.sign(p[ax]);
    p[ax] = s * (lim - B.r);
    if (v[ax] * s <= 0) continue;                         // 離れていく向き
    if (canStick && Math.abs(v[ax]) > B.stickSpeed) {
      f.state = 'stick'; f.t = 0;
      v.x = v.y = v.z = 0;
      R.events.push({ type: 'crash', actor: a, x: p.x, y: p.y, z: p.z });
      return true;
    }
    v[ax] = -v[ax] * B.bounce;
  }
  return false;
}

// 飛んでいる人を dt 進める
function stepFly(a, dt, R) {
  const f = a.fly, B = CFG.blast, G = CFG.gym, p = f.pos, v = f.vel;
  f.t += dt;
  if (f.state === 'air') {
    v.y -= CFG.gravity * dt;
    p.x += v.x * dt; p.y += v.y * dt; p.z += v.z * dt;
    f.rx += f.spinX * dt; f.rz += f.spinZ * dt;
    if (p.y + B.r > G.ceil) {                             // 天井
      p.y = G.ceil - B.r;
      if (v.y > 0) { v.y = -v.y * B.bounce; R.events.push({ type: 'crash', actor: a, x: p.x, y: p.y, z: p.z }); }
    }
    if (!hitWallsBody(a, R, true) && !hitNetBody(a, R) && p.y - B.r <= 0) {   // 床
      p.y = B.r;
      R.events.push({ type: 'land', actor: a, x: p.x, z: p.z });
      if (v.y < -B.landSpeed) { v.y = -v.y * B.floorBounce; f.spinX *= 0.6; f.spinZ *= 0.6; }
      else { v.y = 0; f.state = 'slide'; f.t = 0; }
    }
  } else if (f.state === 'stick') {                       // 壁に張り付いて、少ししたらずり落ちる
    if (f.t > B.stickTime) {
      p.y -= B.slideDown * dt;
      if (p.y - B.r <= 0) { p.y = B.r; f.state = 'down'; f.t = 0; }
    }
  } else if (f.state === 'slide') {                       // 床を滑る
    const s = Math.hypot(v.x, v.z), ns = Math.max(0, s - B.friction * dt);
    if (s > 0) { v.x *= ns / s; v.z *= ns / s; }
    p.x += v.x * dt; p.z += v.z * dt;
    hitWallsBody(a, R, false);
    f.spinX *= Math.max(0, 1 - dt * 3); f.spinZ *= Math.max(0, 1 - dt * 3);
    if (ns < 0.3) { f.state = 'down'; f.t = 0; }
  } else if (f.state === 'hang') {                        // ネットにぶら下がって、落ちる
    if (f.t > B.hangTime) { f.state = 'air'; f.t = 0; v.x = (p.x < 0 ? -1 : 1) * 0.8; v.y = 0; v.z = 0; }
  } else if (f.state === 'down') {
    if (f.t > B.downTime) { f.state = 'getup'; f.t = 0; }
  } else if (f.state === 'getup') {
    if (f.t > B.getupTime) { a.x = p.x; a.z = p.z; a.y = 0; a.vy = 0; a.fly = null; return; }
  }
  a.x = p.x; a.z = p.z;
}

// 飛んでいる体どうし、飛んでいる体と立っている人のぶつかり。立っている人は一緒に吹っ飛ぶ
function collideFlyers(R) {
  const A = R.actors, B = CFG.blast, min = B.r * 2;
  const airborne = o => o.fly && o.fly.state === 'air';
  for (let i = 0; i < A.length; i++) for (let j = i + 1; j < A.length; j++) {
    const a = A[i], b = A[j];
    if (!airborne(a) && !airborne(b)) continue;
    if ((a.fly && !airborne(a)) || (b.fly && !airborne(b))) continue;   // 寝ている・張り付いている人とはぶつからない
    const pa = a.fly ? a.fly.pos : { x: a.x, y: B.center, z: a.z };
    const pb = b.fly ? b.fly.pos : { x: b.x, y: B.center, z: b.z };
    const dx = pb.x - pa.x, dy = pb.y - pa.y, dz = pb.z - pa.z, d = Math.hypot(dx, dy, dz);
    if (d >= min || d < 1e-6) continue;
    if (!b.fly || !a.fly) {                                // 立っている人に当たった：勢いを半分ずつ分ける
      const flyer = a.fly ? a : b, other = a.fly ? b : a, v = flyer.fly.vel;
      launch(R, other, { x: v.x * 0.5, y: Math.abs(v.y) * 0.5 + 3, z: v.z * 0.5 });
      v.x *= 0.5; v.y *= 0.5; v.z *= 0.5;
    } else {                                               // 飛んでいる体どうし：ぶつかる向きの速さを交換する
      const va = a.fly.vel, vb = b.fly.vel, nx = dx / d, ny = dy / d, nz = dz / d;
      const rel = (va.x - vb.x) * nx + (va.y - vb.y) * ny + (va.z - vb.z) * nz;
      if (rel <= 0) continue;                             // 離れていく向き
      const k = rel * 0.9;
      va.x -= k * nx; va.y -= k * ny; va.z -= k * nz;
      vb.x += k * nx; vb.y += k * ny; vb.z += k * nz;
    }
    R.events.push({ type: 'collide', a, b });
  }
}
// ===== 音（Web Audio で作る。音声ファイルは使わない） =====
// ブラウザは最初の操作（クリック・タップ・キー）まで音を出せないので、そのときに作る
const SND = { ctx: null, out: null, noise: null };

function sndInit() {
  if (SND.ctx) { if (SND.ctx.state === 'suspended') SND.ctx.resume(); return; }
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    SND.ctx = new C();
    SND.out = SND.ctx.createGain();
    SND.out.gain.value = 0.6;
    SND.out.connect(SND.ctx.destination);
    const len = SND.ctx.sampleRate * 2, buf = SND.ctx.createBuffer(1, len, SND.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    SND.noise = buf;
  } catch (e) { SND.ctx = null; }                         // 音が出せない環境では鳴らさないだけ
}

// 音程のある音（freq から to へ下がる・上がる）
function sndTone(freq, to, dur, type, vol, delay) {
  if (!SND.ctx) return;
  const t0 = SND.ctx.currentTime + (delay || 0), o = SND.ctx.createOscillator(), g = SND.ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, to), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(SND.out);
  o.start(t0); o.stop(t0 + dur + 0.02);
}

// ざらついた音（フィルタの周波数を from から to へ動かす）
function sndNoise(dur, vol, filter, from, to, delay) {
  if (!SND.ctx) return;
  const t0 = SND.ctx.currentTime + (delay || 0), s = SND.ctx.createBufferSource(), f = SND.ctx.createBiquadFilter(), g = SND.ctx.createGain();
  s.buffer = SND.noise;
  f.type = filter; f.frequency.setValueAtTime(from, t0);
  f.frequency.exponentialRampToValueAtTime(Math.max(20, to), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(SND.out);
  s.start(t0); s.stop(t0 + dur + 0.02);
}

// 爆弾を打つ音。強打は「バシッ」、レシーブやトスは「ポン」
function sndHit(kind) {
  if (['attack', 'direct', 'standSpike', 'serve', 'block'].includes(kind)) {
    sndNoise(0.09, 0.9, 'bandpass', 2600, 1100);
    sndTone(150, 60, 0.12, 'sine', 0.7);
  } else {
    sndNoise(0.05, 0.4, 'bandpass', 1500, 900);
    sndTone(240, 130, 0.09, 'sine', 0.35);
  }
}
function sndWhistle() {                                   // 審判の笛（ピッ、ピー）
  sndTone(3100, 3000, 0.12, 'square', 0.12);
  sndTone(3100, 2950, 0.35, 'square', 0.12, 0.16);
}
function sndBoom() {                                      // 爆発：低い「ドーン」とザーッという爆風
  sndTone(80, 28, 1.3, 'sine', 1.0);
  sndNoise(1.6, 1.1, 'lowpass', 3500, 120);
  sndNoise(0.4, 0.6, 'highpass', 4000, 1500, 0.05);
}
function sndCrash() {                                     // 壁・天井・人に激突
  sndTone(110, 45, 0.25, 'sine', 0.8);
  sndNoise(0.15, 0.6, 'lowpass', 900, 200);
}
function sndLand() { sndTone(130, 60, 0.12, 'sine', 0.45); }   // 床に落ちる
function sndSlow() { sndNoise(0.5, 0.25, 'lowpass', 1400, 180); }   // スローになる「シュウッ」
// ===== 体育館・コート・ネット・光 =====
function buildGym(scene) {
  const C = CFG.court, N = CFG.net, G = CFG.gym;
  const mat = c => new THREE.MeshLambertMaterial({ color: c });
  function box(w, h, d, color, x, y, z, cast) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color));
    m.position.set(x, y, z);
    m.receiveShadow = true;
    if (cast) m.castShadow = true;
    scene.add(m);
    return m;
  }
  scene.background = new THREE.Color(0x20242a);

  // 床（木）とコート面
  box(G.halfX * 2, 0.1, G.halfZ * 2, 0xc89a62, 0, -0.05, 0);
  box(C.halfLen * 2, 0.01, C.halfWid * 2, 0xd77a3c, 0, 0.005, 0);
  // 線（幅 5cm）：外周、エンドライン、アタックライン（ネットから 3m）、センターライン
  const L = 0.05, ly = 0.012, white = 0xffffff;
  box(C.halfLen * 2 + L, 0.004, L, white, 0, ly,  C.halfWid);
  box(C.halfLen * 2 + L, 0.004, L, white, 0, ly, -C.halfWid);
  for (const x of [-C.halfLen, -3, 0, 3, C.halfLen]) box(L, 0.004, C.halfWid * 2, white, x, ly, 0);

  // 壁と天井（手前の壁はカメラの前なので作らない。当たり判定だけある）
  box(G.halfX * 2, G.ceil, 0.2, 0x9fb0a8, 0, G.ceil / 2, -G.halfZ - 0.1);
  box(0.2, G.ceil, G.halfZ * 2, 0xa9b6ad, -G.halfX - 0.1, G.ceil / 2, 0);
  box(0.2, G.ceil, G.halfZ * 2, 0xa9b6ad,  G.halfX + 0.1, G.ceil / 2, 0);
  box(G.halfX * 2, 0.2, G.halfZ * 2, 0x5b6168, 0, G.ceil + 0.1, 0);
  box(G.halfX * 2, 1.2, 0.05, 0x3f6f8f, 0, 0.6, -G.halfZ + 0.03);   // 奥の壁の腰板

  // 天井の照明
  const lampMat = new THREE.MeshBasicMaterial({ color: 0xfff6dd });
  for (const x of [-9, -3, 3, 9]) for (const z of [-5, 1, 7]) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.08, 0.6), lampMat);
    m.position.set(x, G.ceil - 0.05, z);
    scene.add(m);
  }

  // ネット：支柱・網・上の白帯
  for (const s of [-1, 1]) {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, N.top + 0.1, 12), mat(0xdddddd));
    post.position.set(0, (N.top + 0.1) / 2, s * (N.halfWid + 0.1));
    post.castShadow = true;
    scene.add(post);
  }
  const netMat = new THREE.MeshLambertMaterial({ color: 0x111111, transparent: true, opacity: 0.55, side: THREE.DoubleSide });
  const net = new THREE.Mesh(new THREE.PlaneGeometry(N.halfWid * 2, N.top - N.bottom), netMat);
  net.rotation.y = Math.PI / 2;
  net.position.set(0, (N.top + N.bottom) / 2, 0);
  scene.add(net);
  box(0.04, 0.07, N.halfWid * 2, white, 0, N.top - 0.035, 0, true);

  // 光
  scene.add(new THREE.HemisphereLight(0xfff8ee, 0x8a6a48, 0.75));
  const sun = new THREE.DirectionalLight(0xffffff, 0.55);
  sun.position.set(-4, 14, 6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 12, bottom: -12, near: 1, far: 40 });
  scene.add(sun);
}
// ===== 選手の人型（コードで組む。関節を回してポーズを作る） =====
// 関節は腰（hips）を根元にした木構造。体の前はローカルの +Z、左は +X
const JOINTS = ['hips', 'spine', 'neck', 'head', 'shoulderL', 'elbowL', 'shoulderR', 'elbowR', 'hipL', 'kneeL', 'hipR', 'kneeR'];
const TEAM_COLORS = [{ shirt: 0x2f6fdf, shorts: 0x1d2b4f }, { shirt: 0xd8433a, shorts: 0x4a1d1d }];

function makePlayer(scene, team) {
  const col = TEAM_COLORS[team];
  const lam = c => new THREE.MeshLambertMaterial({ color: c });
  const skin = lam(0xeec39a), shirt = lam(col.shirt), shorts = lam(col.shorts), shoe = lam(0xf2f2f2), hair = lam(0x2a1d14);
  const j = {};
  const grp = (name, parent, x, y, z) => { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); j[name] = g; return g; };
  const part = (parent, geo, m, x, y, z) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = true; parent.add(o); return o; };
  const limb = (len, r0, r1) => new THREE.CylinderGeometry(r0, r1, len, 10);

  const root = new THREE.Group();
  scene.add(root);
  const tumble = new THREE.Group();                       // 吹っ飛びで体の中心のまわりに回すための入れ物
  tumble.position.y = CFG.blast.center;
  root.add(tumble);
  const inner = new THREE.Group();
  inner.position.y = -CFG.blast.center;
  tumble.add(inner);
  const hips = grp('hips', inner, 0, CFG.player.hipY, 0);
  part(hips, new THREE.BoxGeometry(0.34, 0.2, 0.22), shorts, 0, 0, 0);
  const spine = grp('spine', hips, 0, 0.08, 0);
  part(spine, new THREE.BoxGeometry(0.38, 0.56, 0.24), shirt, 0, 0.3, 0);
  const neck = grp('neck', spine, 0, 0.6, 0);
  part(neck, limb(0.1, 0.05, 0.06), skin, 0, 0.03, 0);
  const head = grp('head', neck, 0, 0.1, 0);
  head.rotation.order = 'YXZ';                            // 横を向いてから上下を向く
  part(head, new THREE.SphereGeometry(0.12, 16, 12), skin, 0, 0.1, 0);
  part(head, new THREE.SphereGeometry(0.125, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), hair, 0, 0.115, -0.01);

  for (const [s, L] of [[1, 'L'], [-1, 'R']]) {
    const sh = grp('shoulder' + L, spine, s * 0.25, 0.54, 0);
    part(sh, limb(0.12, 0.07, 0.065), shirt, 0, -0.04, 0);          // 袖
    part(sh, limb(0.3, 0.05, 0.045), skin, 0, -0.15, 0);
    const el = grp('elbow' + L, sh, 0, -0.3, 0);
    part(el, limb(0.27, 0.045, 0.04), skin, 0, -0.135, 0);
    part(el, new THREE.SphereGeometry(0.05, 10, 8), skin, 0, -0.3, 0);   // 手
    const hp = grp('hip' + L, hips, s * 0.1, -0.05, 0);
    part(hp, limb(0.45, 0.085, 0.065), skin, 0, -0.225, 0);
    part(hp, limb(0.2, 0.095, 0.09), shorts, 0, -0.08, 0);          // 短パンの裾
    const kn = grp('knee' + L, hp, 0, -0.45, 0);
    part(kn, limb(0.42, 0.06, 0.045), skin, 0, -0.21, 0);
    part(kn, new THREE.BoxGeometry(0.11, 0.08, 0.24), shoe, 0, -0.41, 0.04);
  }
  return { root, tumble, j, team, phase: Math.random() * 6, look: { yaw: 0, pitch: 0 }, tx: 0, tz: 0 };
}

// 足元を (x, z) に置き、ネットのほうを向かせる
function placePlayer(pl, x, z) {
  pl.root.position.set(x, 0, z);
  pl.root.rotation.y = pl.team === 0 ? Math.PI / 2 : -Math.PI / 2;
}

function applyPose(pl, pose) {
  for (const name of JOINTS) {
    const r = pose[name] || [0, 0, 0];
    pl.j[name].rotation.set(r[0], r[1], r[2]);
  }
  pl.j.hips.position.y = CFG.player.hipY - (pose.hipsDrop || 0);
}

// 頭（と少し胴）を target へ向ける。ポーズを当てたあとに呼ぶ
function lookAtTarget(pl, target, dt) {
  const p = pl.root.position;
  const dx = target.x - p.x, dy = target.y - (p.y + 1.75), dz = target.z - p.z;
  let yaw = Math.atan2(dx, dz) - pl.root.rotation.y;
  yaw = Math.atan2(Math.sin(yaw), Math.cos(yaw));
  yaw = Math.max(-1.3, Math.min(1.3, yaw));
  const pitch = Math.max(-1.0, Math.min(0.7, -Math.atan2(dy, Math.hypot(dx, dz))));
  const k = Math.min(1, dt * 8);
  pl.look.yaw += (yaw - pl.look.yaw) * k;
  pl.look.pitch += (pitch - pl.look.pitch) * k;
  pl.j.head.rotation.y += pl.look.yaw * 0.7;
  pl.j.head.rotation.x += pl.look.pitch;
  pl.j.spine.rotation.y += pl.look.yaw * 0.3;
}

// 選手の見た目を actor（15-actors.js）に合わせる。ポーズは目標へなめらかに寄せ、focus（爆弾）を目で追う。
// 吹っ飛んでいる間（actor.fly）は、体の中心で回し、倒れて、起き上がる
function updatePlayer(pl, a, dt, simT, focus) {
  const f = a.fly;
  const target = f ? flyPose(f, simT) : poseFor(a, simT);
  if (!pl.cur) pl.cur = { hipsDrop: 0 };
  const k = Math.min(1, dt * 14);
  for (const name of JOINTS) {
    const to = target[name] || [0, 0, 0];
    const c = pl.cur[name] || (pl.cur[name] = [0, 0, 0]);
    for (let i = 0; i < 3; i++) c[i] += (to[i] - c[i]) * k;
  }
  pl.cur.hipsDrop += ((target.hipsDrop || 0) - pl.cur.hipsDrop) * k;
  applyPose(pl, pl.cur);
  if (f) { placeFlying(pl, f, dt); return; }
  pl.tumble.rotation.set(0, 0, 0);
  pl.root.rotation.y = pl.team === 0 ? Math.PI / 2 : -Math.PI / 2;   // 吹っ飛びで回った向きを戻す
  pl.tx = pl.tz = 0;
  pl.root.position.set(a.x, a.y, a.z);
  if (!a.moving && a.y === 0 && !a.task) pl.j.hips.position.y += Math.sin(simT * 3 + pl.phase) * 0.012;   // 構えたまま小さく揺れる
  lookAtTarget(pl, focus, dt);
}

// 吹っ飛んでいる人の置き方。空中・ぶら下がり・張り付きは物理の回転のまま。
// 滑る・倒れているときは、あお向けかうつ伏せの近いほうへ倒し、起き上がるときは立てる
function placeFlying(pl, f, dt) {
  const B = CFG.blast, T = pl.tumble, G = CFG.gym;
  let yaw = pl.team === 0 ? Math.PI / 2 : -Math.PI / 2;   // 普段の向き（ネットのほう）
  if (f.state === 'stick') {                              // 壁に張り付くときは、壁のほうを向いて大の字になる
    const onX = Math.abs(f.pos.x) + B.r >= G.halfX - 0.01;
    yaw = onX ? Math.atan2(Math.sign(f.pos.x), 0) : Math.atan2(0, Math.sign(f.pos.z));
  }
  const dy = Math.atan2(Math.sin(yaw - pl.root.rotation.y), Math.cos(yaw - pl.root.rotation.y));
  pl.root.rotation.y += dy * Math.min(1, dt * 10);
  if (f.state === 'air' || f.state === 'hang' || f.state === 'stick') {
    T.rotation.set(f.rx, 0, f.rz);
    pl.tx = Math.atan2(Math.sin(f.rx), Math.cos(f.rx));
    pl.tz = Math.atan2(Math.sin(f.rz), Math.cos(f.rz));
    pl.root.position.set(f.pos.x, f.pos.y - B.center, f.pos.z);
    return;
  }
  const up = f.state === 'getup' ? Math.min(1, f.t / B.getupTime) : 0;
  const goal = f.state === 'getup' ? 0 : (pl.tx >= 0 ? Math.PI / 2 : -Math.PI / 2);
  const k = Math.min(1, dt * 8);
  pl.tx += (goal - pl.tx) * k;
  pl.tz += (0 - pl.tz) * k;
  T.rotation.set(pl.tx, 0, pl.tz);
  const cy = 0.28 + (B.center - 0.28) * up;              // 寝ているとき体の中心は床から 0.28m
  pl.root.position.set(f.pos.x, cy - B.center, f.pos.z);
}
// ===== 爆弾の見た目（黒い球にバレーボールの縫い目、口金と導火線）と床の影 =====
function makeBombMesh(scene) {
  const r = CFG.ball.r;
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), new THREE.MeshPhongMaterial({ color: 0x1b1b1f, shininess: 80 }));
  body.castShadow = true;
  g.add(body);
  const seamMat = new THREE.MeshBasicMaterial({ color: 0xe8e8e8 });
  for (const rot of [[0, 0, 0], [Math.PI / 2, 0, 0], [0, 0, Math.PI / 2]]) {
    const s = new THREE.Mesh(new THREE.TorusGeometry(r * 1.005, 0.012, 6, 40), seamMat);
    s.rotation.set(rot[0], rot[1], rot[2]);
    g.add(s);
  }
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.08, 0.08, 12), new THREE.MeshLambertMaterial({ color: 0x777777 }));
  cap.position.y = r + 0.02;
  g.add(cap);
  const fuse = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.16, 6), new THREE.MeshLambertMaterial({ color: 0xc8b48a }));
  fuse.position.set(0.03, r + 0.12, 0);
  fuse.rotation.z = -0.4;
  g.add(fuse);
  const spark = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffd04a }));
  spark.position.set(0.07, r + 0.2, 0);
  g.add(spark);
  scene.add(g);
  // 真下の丸い影（高い所にあっても落ちる場所が分かるように）
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(r, 20),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2;
  scene.add(shadow);
  return { g, spark, shadow };
}

// ball が null なら隠す。飛んでいる間は進む向きに転がす
function updateBombMesh(m, ball, dt) {
  m.g.visible = m.shadow.visible = !!ball;
  if (!ball) return;
  m.g.position.set(ball.pos.x, ball.pos.y, ball.pos.z);
  if (ball.live) {
    m.g.rotation.x += ball.vel.z / CFG.ball.r * dt;
    m.g.rotation.z -= ball.vel.x / CFG.ball.r * dt;
  }
  m.spark.scale.setScalar(0.7 + Math.random() * 0.8);    // 導火線の火花のちらつき（時間で爆発はしない）
  m.shadow.position.set(ball.pos.x, 0.015, ball.pos.z);
  const k = Math.max(0.4, 1 - ball.pos.y / 14);
  m.shadow.scale.setScalar(k * 1.2);
  m.shadow.material.opacity = 0.35 * k;
}

POSES.run2 = mirrorPose(POSES.run1);                      // 走る（右脚が前）
POSES.flail2 = mirrorPose(POSES.flail1);

// 左右を入れ替えたポーズ（L ↔ R。ry と rz は向きが逆になる）
function mirrorPose(p) {
  const out = { hipsDrop: p.hipsDrop };
  for (const k in p) {
    if (k === 'hipsDrop') continue;
    const m = k.endsWith('L') ? k.slice(0, -1) + 'R' : k.endsWith('R') ? k.slice(0, -1) + 'L' : k;
    out[m] = [p[k][0], -p[k][1], -p[k][2]];
  }
  return out;
}

const HIT_POSE = { receive: 'receive', bump: 'receive', return: 'receive', toss: 'toss',
  attack: 'spikeHit', direct: 'spikeHit', standSpike: 'spikeHit', serve: 'spikeHit', block: 'block' };
const WAIT_POSE = { receive: 'receive', bump: 'receive', return: 'receive', toss: 'toss', serve: 'serveHold' };

// 選手の状態（15-actors.js の actor）から、今とるべきポーズを選ぶ
function poseFor(a, simT) {
  const t = a.task;
  if (a.stun > 0) return POSES.stagger;
  const recent = a.lastHit && simT - a.lastHit.at < 0.45;   // 打った直後はその形を残す
  if (a.y > 0) {
    if (t && (t.kind === 'block' || t.kind === 'blockNoop')) return POSES.block;
    if (recent) return POSES[HIT_POSE[a.lastHit.kind]] || POSES.jump;
    if (t && t.jump) return POSES.spikeBack;
    return POSES.jump;
  }
  if (recent) return POSES[HIT_POSE[a.lastHit.kind]] || POSES.ready;
  if (a.moving) return Math.sin(simT * 14 + a.id) > 0 ? POSES.run1 : POSES.run2;
  if (t && t.kind === 'whiff') return simT - t.start < 0.35 ? POSES.spikeBack : POSES.spikeHit;
  if (t && WAIT_POSE[t.kind]) return POSES[WAIT_POSE[t.kind]];
  return POSES.ready;
}

// 吹っ飛んでいる人のポーズ（20-blast.js の fly.state から）
function flyPose(f, simT) {
  if (f.state === 'air' || f.state === 'hang') return Math.sin(simT * 18) > 0 ? POSES.flail1 : POSES.flail2;
  if (f.state === 'stick') return POSES.splat;
  if (f.state === 'getup') return f.t < CFG.blast.getupTime * 0.5 ? POSES.lie : POSES.ready;
  return POSES.lie;
}
// ===== 爆発（一瞬の静止と白い光 → 火の玉 2 重 → 爆風の輪 → 煙・火花・床板の破片 → 揺れ。煙は数秒で晴れる） =====
const FX = { scene: null, light: null, geo: null, list: [], shake: 0, freeze: 0, glow: 0 };

function initFx(scene) {
  FX.scene = scene;
  FX.light = new THREE.PointLight(0xffb040, 0, 40);       // 最初から置いておく（途中で光を足すと描画が一瞬止まるため）
  scene.add(FX.light);
  FX.geo = {                                              // 形は使い回す（材質は 1 つずつ作って、消えるときに捨てる）
    sphere: new THREE.SphereGeometry(1, 20, 14),
    small: new THREE.SphereGeometry(1, 6, 4),
    box: new THREE.BoxGeometry(1, 1, 1),
    ring: new THREE.RingGeometry(0.85, 1, 48),
  };
}

function addPart(kind, geo, mat, pos, vel, life, size, extra) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(pos.x, pos.y, pos.z);
  m.scale.setScalar(size);
  FX.scene.add(m);
  FX.list.push(Object.assign({ kind, m, vel, life, size, t: 0 }, extra));
}

function spawnExplosion(x, z) {
  const rnd = Math.random, basic = (c, o) => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: o === undefined ? 1 : o, depthWrite: false });
  // 一瞬の静止・白い光・揺れ
  FX.freeze = CFG.fx.freeze;
  FX.shake = 1.0;
  FX.glow = 9;
  FX.light.position.set(x, 2.5, z);
  const flash = document.getElementById('flash');
  flash.style.transition = 'none';
  flash.style.opacity = '0.85';
  requestAnimationFrame(() => { flash.style.transition = 'opacity .35s'; flash.style.opacity = '0'; });
  // 火の玉（白っぽい芯と、外側のオレンジ）と、床を走る輪
  addPart('fire', FX.geo.sphere, basic(0xfff2b0), { x, y: 0.8, z }, null, 0.6, 0.6, { grow: 4.5, hue: 0.13 });
  addPart('fire', FX.geo.sphere, basic(0xff8a20, 0.9), { x, y: 1.0, z }, null, 1.0, 0.8, { grow: 6.5, hue: 0.07 });
  addPartRing(x, z);
  // 煙：まわりに広がりながら上がり、ゆっくり薄くなる（＝煙が晴れる）
  for (let i = 0; i < 14; i++) {
    const a = rnd() * Math.PI * 2, r = 0.5 + rnd() * 2;
    const mat = new THREE.MeshLambertMaterial({ color: 0x5a5a5a, transparent: true, opacity: 0.5, depthWrite: false });
    addPart('smoke', FX.geo.sphere, mat, { x: x + Math.cos(a) * r, y: 0.5 + rnd() * 2, z: z + Math.sin(a) * r },
      { x: Math.cos(a) * (1 + rnd() * 1.5), y: 0.8 + rnd() * 1.2, z: Math.sin(a) * (1 + rnd() * 1.5) }, 3.2 + rnd() * 1.2, 1.1 + rnd() * 0.8);
  }
  // 火花
  for (let i = 0; i < 36; i++) {
    const a = rnd() * Math.PI * 2, up = 0.3 + rnd() * 0.9, sp = 8 + rnd() * 8;
    addPart('spark', FX.geo.small, basic(0xffd060), { x, y: 0.6, z },
      { x: Math.cos(a) * sp * (1 - up * 0.5), y: sp * up, z: Math.sin(a) * sp * (1 - up * 0.5) }, 0.8 + rnd() * 0.6, 0.07);
  }
  // 床板の破片
  for (let i = 0; i < 12; i++) {
    const a = rnd() * Math.PI * 2, sp = 4 + rnd() * 5;
    const mat = new THREE.MeshLambertMaterial({ color: 0xb07840, transparent: true, opacity: 1 });
    addPart('debris', FX.geo.box, mat, { x, y: 0.3, z },
      { x: Math.cos(a) * sp, y: 6 + rnd() * 6, z: Math.sin(a) * sp }, 2.5, 1,
      { dims: [0.35 + rnd() * 0.3, 0.05, 0.12 + rnd() * 0.1], spin: { x: rnd() * 12 - 6, y: rnd() * 12 - 6, z: rnd() * 12 - 6 } });
  }
}

function addPartRing(x, z) {
  const mat = new THREE.MeshBasicMaterial({ color: 0xffe0a0, transparent: true, opacity: 0.85, side: THREE.DoubleSide, depthWrite: false });
  addPart('ring', FX.geo.ring, mat, { x, y: 0.03, z }, null, 0.9, 1);
  FX.list[FX.list.length - 1].m.rotation.x = -Math.PI / 2;
}

function updateFx(dt) {
  for (const p of FX.list) {
    p.t += dt;
    const a = Math.min(1, p.t / p.life), m = p.m, v = p.vel;
    if (p.kind === 'fire') {
      m.scale.setScalar(p.size + p.grow * Math.sqrt(a));
      m.material.opacity = (1 - a) * (1 - a);
      m.material.color.setHSL(p.hue * (1 - a), 1, 0.65 - 0.4 * a);
    } else if (p.kind === 'ring') {
      m.scale.setScalar(1 + 15 * a);
      m.material.opacity = 0.85 * (1 - a);
    } else if (p.kind === 'smoke') {
      m.position.x += v.x * dt; m.position.y += v.y * dt; m.position.z += v.z * dt;
      const drag = Math.max(0, 1 - dt * 0.7);
      v.x *= drag; v.z *= drag;
      m.scale.setScalar(p.size * (1 + 1.3 * a));
      m.material.opacity = 0.5 * Math.pow(1 - a, 1.5);   // 濃すぎると爆心のまわりが何も見えないので薄め
    } else if (p.kind === 'spark') {
      v.y -= CFG.gravity * dt;
      m.position.x += v.x * dt; m.position.y += v.y * dt; m.position.z += v.z * dt;
      if (m.position.y < 0.05) { m.position.y = 0.05; v.y = -v.y * 0.3; }
      m.scale.setScalar(p.size * (1 - a));
    } else if (p.kind === 'debris') {
      v.y -= CFG.gravity * dt;
      m.position.x += v.x * dt; m.position.y += v.y * dt; m.position.z += v.z * dt;
      if (m.position.y < 0.03) { m.position.y = 0.03; v.y = -v.y * 0.35; v.x *= 0.7; v.z *= 0.7; p.spin.x *= 0.6; p.spin.y *= 0.6; p.spin.z *= 0.6; }
      m.rotation.x += p.spin.x * dt; m.rotation.y += p.spin.y * dt; m.rotation.z += p.spin.z * dt;
      m.scale.set(p.dims[0], p.dims[1], p.dims[2]);
      m.material.opacity = a < 0.7 ? 1 : (1 - a) / 0.3;
    }
  }
  for (let i = FX.list.length - 1; i >= 0; i--) {
    const p = FX.list[i];
    if (p.t < p.life) continue;
    FX.scene.remove(p.m);
    p.m.material.dispose();                               // 形は使い回しなので捨てない
    FX.list.splice(i, 1);
  }
  FX.glow = Math.max(0, FX.glow - dt * 12);
  FX.light.intensity = FX.glow;
  FX.shake = Math.max(0, FX.shake - dt * 1.2);
}
// ===== カメラ（中継の角度：コートの横、斜め上から）。爆発の間は画角を広げて爆発のほうへ振り、天井まで飛ぶ人も倒れた人も入れる =====
const CAM = { cam: null, x: 0, y: null, lx: 0, ly: null, lz: 0, fov: null };

// focusX：爆弾の x（少しだけ追って横に振る）。boomAt：爆発した場所（爆発の間だけ）
function updateCamera(dt, focusX, boomAt) {
  const c = CFG.camera, s = FX.shake;
  const goal = boomAt
    ? { x: boomAt.x * 0.3, y: c.y, lx: boomAt.x * 0.45, ly: c.boomLookY, lz: boomAt.z * 0.2, fov: c.boomFov }
    : { x: focusX * c.follow, y: c.y, lx: focusX * c.follow, ly: c.lookY, lz: 0, fov: c.fov };
  const k = Math.min(1, dt * (boomAt ? 3 : 1.5));
  for (const key in goal) CAM[key] = CAM[key] === null ? goal[key] : CAM[key] + (goal[key] - CAM[key]) * k;
  if (Math.abs(CAM.cam.fov - CAM.fov) > 0.01) { CAM.cam.fov = CAM.fov; CAM.cam.updateProjectionMatrix(); }
  CAM.cam.position.set(CAM.x + (Math.random() - 0.5) * s, CAM.y + (Math.random() - 0.5) * s, c.z);
  CAM.cam.lookAt(CAM.lx, CAM.ly, CAM.lz);
}
// ===== 入力：4 つの行動ボタン（スマホはタップ）と 1〜4 キー =====
function initInput(onAction) {
  for (const btn of document.querySelectorAll('#actions button')) {
    btn.addEventListener('pointerdown', e => { e.preventDefault(); onAction(btn.dataset.act); });
  }
  const keys = {
    Digit1: 'receive', Digit2: 'attack', Digit3: 'block', Digit4: 'serve',
    Numpad1: 'receive', Numpad2: 'attack', Numpad3: 'block', Numpad4: 'serve',
  };
  addEventListener('keydown', e => { if (keys[e.code]) onAction(keys[e.code]); });
}
// ===== 画面の文字 =====
let __toastTimer = 0;
function showToast(text, sec) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('on');
  clearTimeout(__toastTimer);
  __toastTimer = setTimeout(() => el.classList.remove('on'), (sec || 1.6) * 1000);
}

const SCENE_TEXT = { serve: 'サーブ番', incoming: '相手が打った！', tossed: 'トスが上がった！' };
function showChoice(scene, attack) {
  document.getElementById('actions').classList.add('on');
  const el = document.getElementById('scene');
  el.textContent = scene === 'incoming' && attack ? 'アタックが来る！' : SCENE_TEXT[scene];
  el.classList.add('on');
}
function hideChoice() {
  document.getElementById('actions').classList.remove('on');
  document.getElementById('scene').classList.remove('on');
  setTimer(0);
}
function setTimer(frac) {
  document.querySelector('#timer i').style.width = (Math.max(0, Math.min(1, frac)) * 100) + '%';
}
function setScore(s) {
  document.getElementById('s0').textContent = s[0];
  document.getElementById('s1').textContent = s[1];
}
function showResult(winner, s) {
  document.getElementById('resultText').textContent = winner === 0 ? '勝ち！' : '負け……';
  document.getElementById('resultScore').textContent = '味方 ' + s[0] + ' - ' + s[1] + ' 相手';
  document.getElementById('result').classList.add('on');
}
function hideResult() { document.getElementById('result').classList.remove('on'); }
// ===== 起動とメインループ =====
(function boot() {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  buildGym(scene);
  initFx(scene);
  const camera = new THREE.PerspectiveCamera(CFG.camera.fov, innerWidth / innerHeight, 0.1, 200);
  CAM.cam = camera;

  const R = newRally();
  const players = R.actors.map(a => {
    const pl = makePlayer(scene, a.team);
    placePlayer(pl, a.x, a.z);                            // 向き（ネットのほう）を決める
    return pl;
  });
  const bombMesh = makeBombMesh(scene);
  initInput(act => choose(R, act));
  addEventListener('pointerdown', sndInit);
  addEventListener('keydown', sndInit);
  window.GAME = { R, choose: act => choose(R, act) };     // 確認用

  addEventListener('resize', () => {
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  });

  document.getElementById('againBtn').addEventListener('click', () => {
    hideResult();
    newGame(R);
    setScore(R.score);
  });
  newGame(R);                                             // 0-0、最初のサーブはプレイヤーのチーム
  const clock = new THREE.Clock();
  function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 1 / 30);
    if (FX.freeze > 0) { FX.freeze -= dt; renderer.render(scene, camera); return; }   // 爆発の瞬間の一瞬の静止
    tickRally(R, dt);
    for (const e of R.events) {
      if (e.type === 'choose') { showChoice(e.scene, e.attack); sndSlow(); }
      else if (e.type === 'chosen') { hideChoice(); if (e.action === null) showToast('時間切れ！', 1.0); }
      else if (e.type === 'floor') hideChoice();         // 選んでいる途中で床に落ちたら、ボタンを消す
      else if (e.type === 'explode') {
        sndBoom();
        spawnExplosion(e.x, e.z);
        showToast(e.side === 0 ? '味方コートで爆発！' : '相手コートで爆発！');
      }
      else if (e.type === 'point') {
        sndWhistle();
        setScore(e.score);
        if (e.score[e.scorer] < CFG.winScore) showToast(e.scorer === 0 ? '味方に 1 点！' : '相手に 1 点……', 1.4);   // 最後の 1 点は勝敗の画面に任せる
      }
      else if (e.type === 'gameover') showResult(e.winner, e.score);
      else if (e.type === 'bump') showToast('ゴツン！', 0.8);
      else if (e.type === 'crash') { FX.shake = Math.min(1.2, FX.shake + 0.35); sndCrash(); }   // 壁・天井に激突
      else if (e.type === 'hit') sndHit(e.kind);
      else if (e.type === 'land' || e.type === 'net') sndLand();
      else if (e.type === 'collide') sndCrash();
    }
    R.events.length = 0;
    if (R.state === 'choose') setTimer(R.choose.left / CFG.choiceTime);
    const slow = R.state === 'choose' ? CFG.slowScale : 1;
    const shown = R.ball && !(R.state === 'boom' && R.boom.fired) ? R.ball : null;   // 爆発したら爆弾を消す
    const focus = R.ball ? R.ball.pos : { x: 0, y: 3, z: 0 };
    R.actors.forEach((a, i) => updatePlayer(players[i], a, dt, R.simT, focus));
    updateBombMesh(bombMesh, shown, dt * slow);
    updateFx(dt);
    updateCamera(dt, R.ball ? R.ball.pos.x : 0, R.state === 'boom' && R.boom.fired ? R.boom.hit : null);
    renderer.render(scene, camera);
  }
  frame();
})();
</script>
