<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>爆弾バレー</title>
<style>
  :root{--ink:#fff;--jp:"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Meiryo","Noto Sans JP",sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#20242a;color:var(--ink);font-family:var(--jp);
    touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100%;height:100%}

  /* ---- 操作の案内 ---- */
  #hint{position:fixed;left:16px;top:14px;z-index:5;font-size:13px;opacity:.8;pointer-events:none;text-shadow:0 1px 6px #000}

  /* ---- 4 つの行動ボタン（選ぶ場面だけ明るくなる） ---- */
  #actions{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;
    display:flex;flex-wrap:wrap;gap:8px 10px;width:min(640px,calc(100vw - 32px));opacity:.35;transition:opacity .15s;pointer-events:none}
  #actions.on{opacity:1;pointer-events:auto}
  #actions button{flex:1 1 0;min-width:0;padding:8px 4px;border:2px solid rgba(255,255,255,.55);border-radius:12px;
    background:rgba(20,24,30,.72);color:#fff;font:700 clamp(14px,2.6vw,18px) var(--jp);letter-spacing:.06em;cursor:pointer;touch-action:manipulation;
    position:relative;display:flex;align-items:center;justify-content:center;gap:6px}
  #actions.on button{border-color:#ffd04a;background:rgba(60,44,10,.85)}
  #actions button b{position:absolute;left:7px;top:3px;font-size:11px;font-weight:400;opacity:.7}
  /* ピクトグラム（どんな動きか一目で分かる絵。白い棒人間と、小さな爆弾） */
  #actions button svg{width:clamp(26px,4vw,34px);height:clamp(26px,4vw,34px);flex:none;fill:none;stroke:currentColor;stroke-width:3.4;
    stroke-linecap:round;stroke-linejoin:round}
  #actions button svg .f{fill:currentColor;stroke:none}
  #actions button svg .s{fill:#ffd04a;stroke:none}
  #actions button svg .t{stroke-width:2.2;opacity:.7}
  #actions button:active{transform:scale(.96)}
  #timer{flex:0 0 100%;height:5px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden}
  #timer i{display:block;height:100%;width:0;background:#ffd04a}

  /* ---- 選ぶ場面の文字 ---- */
  #scene{position:fixed;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 84px);transform:translateX(-50%);z-index:6;
    font-size:clamp(16px,3vw,22px);font-weight:700;letter-spacing:.1em;text-shadow:0 2px 10px #000;white-space:nowrap;
    opacity:0;transition:opacity .15s;pointer-events:none}
  #scene.on{opacity:1}
  #count{margin-left:14px;font-size:1.5em;color:#ffd04a;font-variant-numeric:tabular-nums}

  /* ---- お知らせ ---- */
  #toast{position:fixed;left:50%;top:22%;z-index:7;transform:translate(-50%,-50%);width:max-content;max-width:90vw;
    font-size:clamp(22px,5vw,40px);font-weight:700;letter-spacing:.08em;text-align:center;
    text-shadow:0 2px 16px rgba(0,0,0,.8);opacity:0;transition:opacity .25s;pointer-events:none}
  #toast.on{opacity:1}
  /* ---- 爆発の白い光 ---- */
  #flash{position:fixed;inset:0;z-index:4;background:#fff;opacity:0;pointer-events:none}

  /* ---- スマホが縦向きのときの案内 ---- */
  #rotate{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;
    text-align:center;font-size:20px;background:#20242a}
  @media (orientation: portrait) and (pointer: coarse){#rotate{display:flex}}
  /* ---- 点数 ---- */
  #score{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:10px;
    padding:6px 16px;border-radius:20px;background:rgba(10,12,16,.6);font-size:15px;letter-spacing:.08em;pointer-events:none}
  #score b{font-size:24px;min-width:1ch;text-align:center}
  #score .t0{color:#8fb6ff}
  #score .t1{color:#ff9a8f}
  @media (max-width:820px){#hint{display:none}}

  /* ---- 勝敗の画面 ---- */
  #result{position:fixed;inset:0;z-index:12;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:16px;text-align:center;background:rgba(10,12,16,.72)}
  #result.on{display:flex}
  #result h2{font-size:clamp(30px,7vw,56px);letter-spacing:.08em}
  #result p{font-size:20px;letter-spacing:.12em}
  #againBtn{margin-top:8px;font:700 18px var(--jp);letter-spacing:.15em;color:#fff;background:#d8433a;border:0;
    border-radius:28px;padding:12px 34px;cursor:pointer}

  /* ---- 実況テロップ（中継の字幕） ---- */
  #caption{position:fixed;left:16px;top:56px;z-index:6;max-width:calc(100vw - 32px);display:flex;align-items:stretch;
    opacity:0;transform:translateX(-12px);transition:opacity .2s,transform .2s;pointer-events:none}
  #caption.on{opacity:1;transform:none}
  #caption i{font-style:normal;font-size:11px;letter-spacing:.2em;background:#ffd04a;color:#1a1a1a;padding:6px 8px;display:flex;align-items:center}
  #caption span{background:rgba(12,18,32,.88);padding:6px 14px;font-size:clamp(14px,2.4vw,18px);letter-spacing:.06em;font-weight:700}

  /* ---- リプレイ ---- */
  #replayTag{position:fixed;right:16px;top:14px;z-index:8;display:none;flex-direction:column;align-items:flex-end;gap:4px;pointer-events:none}
  #replayTag.on{display:flex}
  #replayTag b{background:#d8433a;color:#fff;font-size:18px;letter-spacing:.2em;padding:4px 12px}
  #replayTag small{font-size:12px;opacity:.85;text-shadow:0 1px 6px #000}

  /* ---- タイトル（真面目なスポーツ中継風。後ろで試合が続いている） ---- */
  #title{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:center;gap:10px;
    padding:24px max(24px,6vw);background:linear-gradient(90deg,rgba(8,12,22,.92) 0%,rgba(8,12,22,.7) 45%,rgba(8,12,22,.1) 100%)}
  #title.off{display:none}
  #title .cup{font-size:clamp(12px,1.8vw,15px);letter-spacing:.25em;color:#ffd04a}
  #title h1{font-size:clamp(40px,8vw,84px);letter-spacing:.12em;line-height:1.1}
  #title .sub{font-size:clamp(12px,1.8vw,15px);letter-spacing:.4em;opacity:.75}
  #title ul{list-style:none;margin:10px 0 6px;font-size:clamp(13px,2vw,16px);line-height:1.9;border-left:3px solid #ffd04a;padding-left:14px}
  #startBtn,#titleBtn{align-self:flex-start;font:700 18px var(--jp);letter-spacing:.2em;color:#fff;background:#d8433a;border:0;border-radius:4px;
    padding:12px 40px;cursor:pointer}
  #title small{font-size:12px;opacity:.6}
  body.titleMode #score,body.titleMode #actions,body.titleMode #hint,body.titleMode #scene{display:none}
  #titleBtn{align-self:center;background:transparent;border:2px solid rgba(255,255,255,.6);padding:10px 30px;font-size:15px}
  body.titleMode #caption{top:auto;bottom:16px;left:auto;right:16px;z-index:21}   /* タイトルの文字と重ならない所へ */
</style>
</head>
<body class="titleMode">
<div id="hint">スローになったら 1〜4 キー（スマホはボタン）で次の行動を選ぶ</div>
<div id="scene"><span id="sceneText"></span><b id="count"></b></div>
<div id="actions">
  <button data-act="receive"><b>1</b>
    <svg viewBox="0 0 48 48" aria-hidden="true"><!-- 腰を落とし、組んだ腕で爆弾を上げる -->
      <circle class="f" cx="20" cy="12" r="4.6"/><path d="M20 17 L16 28 M19 19 L32 26 M16 28 L25 33 L24 44 M16 28 L11 36 L8 44"/>
      <circle class="f" cx="35" cy="17" r="4.4"/><path class="t" d="M37.5 13 L39.5 9.5"/><circle class="s" cx="40.5" cy="8" r="1.8"/>
    </svg>レシーブ</button>
  <button data-act="attack"><b>2</b>
    <svg viewBox="0 0 48 48" aria-hidden="true"><!-- 跳んで、振り上げた腕で爆弾を叩き込む -->
      <circle class="f" cx="18" cy="13" r="4.6"/><path d="M18 18 L15 29 M18 20 L30 10 M18 20 L9 23 M15 29 L10 34 L4 35 M15 29 L15 36 L9 40"/>
      <circle class="f" cx="35" cy="7" r="4.4"/><path class="t" d="M38 14 L44 25 M34 15 L38 23 M4 46 L24 46"/>
    </svg>アタック</button>
  <button data-act="block"><b>3</b>
    <svg viewBox="0 0 48 48" aria-hidden="true"><!-- ネット際で両腕を上へ伸ばして跳ぶ -->
      <circle class="f" cx="18" cy="15" r="4.6"/><path d="M18 20 L17 32 M18 22 L23 6 M18 22 L27 8 M17 32 L15 42 M17 32 L20 42"/>
      <path class="t" d="M31 20 L46 20 M32 20 L32 46 M32 26 L46 26 M32 32 L46 32 M37 20 L37 34 M42 20 L42 34"/>
      <circle class="f" cx="38" cy="10" r="4.2"/><path class="t" d="M41 4 L45 1"/>
    </svg>ブロック</button>
  <button data-act="serve"><b>4</b>
    <svg viewBox="0 0 48 48" aria-hidden="true"><!-- 爆弾を高く上げ、腕を振りかぶって踏み込む -->
      <circle class="f" cx="20" cy="15" r="4.6"/><path d="M20 20 L20 31 M20 22 L26 10 M20 22 L13 18 L15 11 M20 31 L26 37 L28 44 M20 31 L15 38 L12 44"/>
      <circle class="f" cx="29" cy="6" r="4.2"/><path class="t" d="M4 30 L9 30 M3 36 L8 36"/>
    </svg>サーブ</button>
  <div id="timer"><i></i></div>
</div>
<div id="score"><span class="t0">味方</span><b id="s0">0</b><span>-</span><b id="s1">0</b><span class="t1">相手</span></div>
<div id="result"><h2 id="resultText"></h2><p id="resultScore"></p><button id="againBtn">もう一回</button><button id="titleBtn">タイトルへ</button></div>
<div id="caption"><i>実況</i><span id="captionText"></span></div>
<div id="replayTag"><b>REPLAY</b><small>タップかキーで飛ばす</small></div>
<div id="title">
  <p class="cup">第 1 回 全日本 爆弾バレーボール選手権</p>
  <h1>爆弾バレー</h1>
  <p class="sub">BOMB VOLLEYBALL ── 2 vs 2</p>
  <ul>
    <li>スローになったら、4 つの行動から次の一手を選ぶ</li>
    <li>爆弾は、床に落ちた瞬間だけ爆発する</li>
    <li>相手コートで 3 回爆発させたら勝ち</li>
  </ul>
  <button id="startBtn">試合開始</button>
  <small>PC は 1〜4 キー、スマホは画面下のボタン</small>
</div>
<div id="flash"></div>
<div id="toast"></div>
<div id="rotate">横画面にしてください</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
