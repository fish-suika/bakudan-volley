<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>検証 — 爆弾バレー</title>
<style>
  body{font-family:"Yu Gothic UI",system-ui,sans-serif;background:#1c1c1e;color:#eee;padding:24px;line-height:1.7}
  h1{font-size:18px;margin-bottom:16px}
  .r{padding:4px 0;border-bottom:1px solid #333}
  .ok::before{content:"PASS ";color:#6bd07a;font-weight:bold}
  .ng::before{content:"FAIL ";color:#ff6b6b;font-weight:bold}
  .ng{color:#ffb0b0}
  .why{color:#ff8f8f;padding-left:3em;font-size:13px}
  #sum{margin-top:18px;font-size:16px;font-weight:bold}
</style>
</head>
<body>
<h1>爆弾バレー — 検証</h1>
<div id="out"></div>
<div id="sum"></div>

<script>
"use strict";
// ===== 数値（遊びながら調整する） =====
const CFG = {
  gravity: 9.8,
  court: { halfLen: 9, halfWid: 4.5 },                    // コートは x:-9..9, z:-4.5..4.5。ネットは x=0
  net: { top: 2.43, bottom: 1.43, halfWid: 5.5, thick: 0.06 },
  gym: { halfX: 15, halfZ: 11, ceil: 12 },                // 壁は x=±15, z=±11、天井は 12m
  ball: { r: 0.3, bounce: 0.65, netBounce: 0.25, playerBounce: 0.5, maxStep: 1 / 240 },
  player: { r: 0.4, h: 1.9, hipY: 0.95 },                 // 当たり判定は足元から高さ h の円柱
  startSpots: [                                           // 構える位置（team 0 = 味方・左、1 = 敵・右）
    { team: 0, x: -5, z: -2 }, { team: 0, x: -5, z: 2 },
    { team: 1, x: 5, z: -2 },  { team: 1, x: 5, z: 2 },
  ],
  explodeDelay: 0.25,                                     // 床に触れてから爆発するまでの「一瞬の間」（秒）
  // ---- Phase 2：行動と選択 ----
  slowScale: 0.08,                                        // 選ぶ間の時間の速さ
  choiceTime: 4.0,                                        // 選べる時間（実時間・秒）。過ぎたら味方に任せる
  afterBoom: 1.6,                                         // 爆発してから次のサーブまで（秒）
  runSpeed: 7,                                            // 選手が走る速さ m/s
  reach: 1.0,                                             // 爆弾に手が届く横の距離 m
  jumpH: 0.9,                                             // アタック・ブロック・サーブで跳ぶ高さ m
  contactH: { receive: 0.8, toss: 2.3, attack: 3.4, direct: 2.4, serve: 3.3 },   // 爆弾に触る高さ m
  serveSpot: 12,                                          // サーブを打つ位置（ネットからの距離）。エンドラインの 3m 後ろ。ジャンプサーブの助走を始める所
  jumpServe: {
    tossTime: 1.3,                                        // トスを上げてから打つまで（秒）。トスが高さ contactH.serve を降りてくる時刻
    takeoffX: 9.15,                                       // 踏み切る位置（ネットからの距離）。エンドラインの 0.15m 手前
    contactIn: 0.8,                                       // 打つ所（エンドラインからコートの中へ m）
    approachDelay: 0.2,                                   // トスを上げてから助走を始めるまで（秒）
    speed: 15,                                            // 打球の速さ m/s（ネットにかかるなら自動で遅くなる）
  },
  serveHold: 0.9,                                         // サーブ前に構える「真剣な間」（秒）
  hardSpeed: 13,                                          // これより速い球は「強い球」（直接打ち返しにくい）
  shots: {
    pass: { toX: 2.0, apex: 5.5 },                        // レシーブ → ネットから 2m の自陣へ高く上げる
    set: { toX: 1.2, apex: 6.0 },                         // トス → ネットから 1.2m のアタック位置へ
    spikeSpeed: 17, serveApex: 4.2, returnApex: 5.0,
  },
  success: {                                              // 場面 × 行動の成功率（仕様書 3.3）
    serve: { receive: 0.3, attack: 0.4, serve: 0.9 },
    incoming: { receive: 0.9, directSoft: 0.7, directHard: 0.25, block: 0.6 },
    tossed: { receive: 0.95, attack: 0.9 },
  },
  ai: {                                                   // 味方と敵の AI（ミスの確率は両チーム同じ）
    receive: 0.85, dig: 0.45, toss: 0.9, attack: 0.8, serve: 0.9, block: 0.5,   // 成功率（dig は強い球のレシーブ）
    blockTry: 0.35,                                       // 相手のアタックにブロックへ跳ぶ確率
    delay: [0.05, 0.3], slowChance: 0.15, slowDelay: 0.5, // 反応の遅れ（秒）。slowChance の確率でさらに slowDelay 遅れる
    bothGo: 0.12,                                         // 2 人とも同じ球へ向かってしまう確率
    earlyJump: 0.1,                                       // アタックでジャンプが早すぎて空振りする確率
    bumpStun: 0.7,                                        // ぶつかったときによろけて動けない時間（秒）
  },
  // ---- Phase 3：ラリーと点数 ----
  winScore: 3,                                            // 先に取ったほうの勝ち
  resetMax: 3.0,                                          // 点が決まってから、定位置へ戻るのを待つ最長（秒）
  // ---- Phase 4a：吹っ飛び・爆発 ----
  blast: {
    radius: 12, minPower: 0.45,                           // 爆発した側：中心から遠いほど弱まるが、最低でもこの強さで飛ぶ
    nearRadius: 4, nearPower: 0.4,                        // 反対側：この距離以内なら軽く飛ぶ
    speed: 11, up: 13, jitter: 0.35,                      // 横・上の初速（強さ 1 のとき m/s）と毎回のばらつき（±35%）
    superChance: 0.15, superMul: 1.7,                     // たまに 1 人だけ異常に高く飛ぶ（上の初速が 1.7 倍）
    spin: 14,                                             // 空中で回る速さの幅（rad/s）
    center: 1.0, r: 0.45,                                 // 体の中心の高さ、体の当たり判定（球）の半径
    bounce: 0.45, floorBounce: 0.3, landSpeed: 4,         // 跳ね返り。床へ秒速 landSpeed 以上で落ちたら弾む
    friction: 4,                                          // 床を滑るときの減速 m/s²（秒速 8m なら 8m 滑る）
    stickSpeed: 8, stickTime: 0.35, slideDown: 3.5,       // この速さ以上で壁に当たると張り付き、少ししてずり落ちる
    netHang: 0.25, hangTime: 1.0,                         // ネットに引っかかる確率と、ぶら下がる時間
    downTime: 0.8, getupTime: 0.6,                        // 倒れている時間、起き上がるのにかかる時間
    maxTime: 6,                                           // 爆発からこれ以上は待たずに点を進める（秒）
    outward: 0.5,                                         // 飛ぶ向きを自陣の奥（横の壁）へ寄せる強さ
    zFront: 0.15, zBack: 0.8,                             // 手前（カメラ側）・奥へ飛ぶ速さの倍率。手前へ飛ぶと画面の外へ出るので弱める
  },
  fx: { freeze: 0.12 },                                   // 爆発の瞬間に画面を止める時間（秒）
  // ---- Phase 4b：モーション ----
  motion: {
    approachDist: 2.6,                                    // アタックの助走を始める所（打つ所からネットと反対へ m）
    approachTime: 0.75,                                   // 跳ぶ何秒前から助走するか
    broad: 0.6,                                           // 踏み切り位置（打つ所の手前 m）。空中で前へ流れて打つ所の真下に来る
    strideLen: 1.5,                                       // 走るとき脚が一回りする距離 m
    shuffleDist: 2.5,                                     // これより近い所へはサイドステップ（ネットを向いたまま）
  },
  // ---- Phase 5：演出 ----
  comment: { hold: 2.2 },                                 // 実況の文を出しておく秒数（この間は、より大事な出来事だけ差し替える）
  replay: { before: 0.5, after: 2.0, speed: 0.5, keep: 8, fov: 50 },   // 爆発の何秒前から何秒後まで、何倍の速さで。記録は 8 秒ぶん
  camera: { y: 8.5, z: 17, lookY: 2.0, fov: 42, follow: 0.25, boomFov: 58, boomLookY: 3.3 },   // 爆発の間は画角を広げて、天井・横の壁・倒れた人まで入れる
};
// ===== 爆弾の物理（three.js 非依存） =====
// 爆弾は床に触れたときだけ爆発する。天井・壁・ネット・選手には跳ね返るだけ。
function newBall(x, y, z) {
  return { pos: { x, y, z }, vel: { x: 0, y: 0, z: 0 }, live: true };
}
function sideOf(x) { return x < 0 ? 0 : 1; }             // 0 = 味方（左）、1 = 敵（右）
function inCourt(x, z) { return Math.abs(x) <= CFG.court.halfLen && Math.abs(z) <= CFG.court.halfWid; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

// dt 秒進める。床に触れたら { x, z, side } を返して live=false にする。それ以外は null。
// players: [{ x, z }] 選手の足元。rand: 0..1 の乱数（テストで固定するため）
function stepBall(b, dt, players, rand) {
  if (!b.live) return null;
  rand = rand || Math.random;
  const n = Math.max(1, Math.ceil(dt / CFG.ball.maxStep - 1e-9));   // すり抜けないよう細かく刻む
  const h = dt / n, g = CFG.gravity;
  for (let i = 0; i < n; i++) {
    b.pos.x += b.vel.x * h;
    b.pos.y += (b.vel.y - 0.5 * g * h) * h;              // 重力一定なので、この刻みでも放物線は正確
    b.pos.z += b.vel.z * h;
    b.vel.y -= g * h;
    const hit = collideBall(b, players || [], rand);
    if (hit) return hit;
  }
  return null;
}

function collideBall(b, players, rand) {
  const r = CFG.ball.r, G = CFG.gym, e = CFG.ball.bounce, p = b.pos, v = b.vel;
  // 床：ここだけ爆発する
  if (p.y - r <= 0) {
    p.y = r;
    b.live = false;
    return { x: p.x, z: p.z, side: sideOf(p.x) };
  }
  // 天井・壁（手前の壁は見えないが当たる）
  if (p.y + r > G.ceil)   { p.y = G.ceil - r;   if (v.y > 0) v.y = -v.y * e; }
  if (p.x - r < -G.halfX) { p.x = -G.halfX + r; if (v.x < 0) v.x = -v.x * e; }
  if (p.x + r >  G.halfX) { p.x =  G.halfX - r; if (v.x > 0) v.x = -v.x * e; }
  if (p.z - r < -G.halfZ) { p.z = -G.halfZ + r; if (v.z < 0) v.z = -v.z * e; }
  if (p.z + r >  G.halfZ) { p.z =  G.halfZ - r; if (v.z > 0) v.z = -v.z * e; }
  // ネット（白帯から下 1m の薄い板）
  const N = CFG.net;
  sphereBox(b, { minX: -N.thick / 2, maxX: N.thick / 2, minY: N.bottom, maxY: N.top, minZ: -N.halfWid, maxZ: N.halfWid }, CFG.ball.netBounce);
  for (const pl of players) hitPlayer(b, pl, rand);
  return null;
}

// 球と箱。重なっていれば外へ押し出し、面の向きの速さを反転して e 倍にする
function sphereBox(b, box, e) {
  const p = b.pos, v = b.vel, r = CFG.ball.r;
  let dx = p.x - clamp(p.x, box.minX, box.maxX);
  let dy = p.y - clamp(p.y, box.minY, box.maxY);
  let dz = p.z - clamp(p.z, box.minZ, box.maxZ);
  const d2 = dx * dx + dy * dy + dz * dz;
  if (d2 >= r * r) return false;
  let d = Math.sqrt(d2);
  if (d < 1e-6) {                                         // 中心が箱の中：x の向きに押し出す（ネットは薄いので）
    const left = p.x < (box.minX + box.maxX) / 2;
    p.x = left ? box.minX - r : box.maxX + r;
    dx = left ? -1 : 1; dy = 0; dz = 0; d = 1;
  } else {
    const k = (r - d) / d;
    p.x += dx * k; p.y += dy * k; p.z += dz * k;
  }
  const nx = dx / d, ny = dy / d, nz = dz / d;
  const vn = v.x * nx + v.y * ny + v.z * nz;
  if (vn < 0) { const j = (1 + e) * vn; v.x -= j * nx; v.y -= j * ny; v.z -= j * nz; }
  return true;
}

// 選手は足元から高さ h の円柱。横から当たれば横へ、頭の上なら上へ弾く
function hitPlayer(b, pl, rand) {
  const R = CFG.player.r, H = CFG.player.h, r = CFG.ball.r, e = CFG.ball.playerBounce, p = b.pos, v = b.vel;
  const dx = p.x - pl.x, dz = p.z - pl.z, d = Math.hypot(dx, dz);
  if (p.y - r >= H || d >= R + r) return false;
  if (p.y > H && d < R) {                                 // 頭の上：上へ弾く。真上で止まらないよう横にも押す
    p.y = H + r;
    if (v.y < 0) v.y = -v.y * e;
    const a = rand() * Math.PI * 2;
    v.x += Math.cos(a) * 1.2; v.z += Math.sin(a) * 1.2;
    return true;
  }
  const nx = d < 1e-6 ? 1 : dx / d, nz = d < 1e-6 ? 0 : dz / d;
  p.x = pl.x + nx * (R + r); p.z = pl.z + nz * (R + r);
  const vn = v.x * nx + v.z * nz;
  if (vn < 0) { const j = (1 + e) * vn; v.x -= j * nx; v.z -= j * nz; }
  return true;
}
// ===== 打ち出しの計算（three.js 非依存） =====
// from から打ち出し、床からの高さ apex の最高点を通って、to（x, z）の地点で床に触れる初速を返す。
// 「床に触れる」は爆弾の中心が半径 r の高さになったとき。apex が打つ高さより低いときは打つ高さを最高点とする
function shotVelocity(from, to, apex) {
  const g = CFG.gravity, r = CFG.ball.r;
  const top = Math.max(apex, from.y + 0.01, r + 0.01);
  const vy = Math.sqrt(2 * g * (top - from.y));
  const t = vy / g + Math.sqrt(2 * (top - r) / g);          // 上がる時間＋最高点から床までの時間
  return { x: (to.x - from.x) / t, y: vy, z: (to.z - from.z) / t };
}

// 爆弾を試しに動かして（選手は無視）、高さ h まで降りてきたときの位置と、今からの時間を返す。
// 上りの途中で h を通っても数えない。先に床に触れるなら null
function predictDescent(ball, h, maxT) {
  const b = { pos: { ...ball.pos }, vel: { ...ball.vel }, live: true };
  const dt = 1 / 120;
  for (let t = 0; t < (maxT || 6); ) {
    const hit = stepBall(b, dt, [], () => 0.5);
    t += dt;
    if (hit) return h <= CFG.ball.r + 0.05 ? { x: hit.x, z: hit.z, t } : null;   // 床の高さを聞かれたなら、床に触れた場所が答え（刻みの間に抜けるため）
    if (b.vel.y < 0 && b.pos.y <= h) return { x: b.pos.x, z: b.pos.z, t };
  }
  return null;
}

// 強打：from から to（x, z の床）へ、横の速さ speed で叩き込む初速。
// ネットの白帯にかかるなら、速さを落として（＝山なりにして）越えられる速さを探す
function spikeVelocity(from, to, speed) {
  const g = CFG.gravity, r = CFG.ball.r, N = CFG.net;
  const dx = to.x - from.x, dz = to.z - from.z, dist = Math.hypot(dx, dz);
  for (let s = speed; s >= 6; s -= 0.5) {
    const t = dist / s;
    const v = { x: dx / t, y: (r - from.y + 0.5 * g * t * t) / t, z: dz / t };
    if (from.x * to.x >= 0) return v;                     // ネットを越えない打球は確かめない
    const tc = -from.x / v.x;                             // ネットの真上を通る時刻
    const yc = from.y + v.y * tc - 0.5 * g * tc * tc;
    if (yc - r > N.top + 0.05) return v;
  }
  return shotVelocity(from, to, from.y + 1.5);            // どうしても越えないなら山なりで
}
// ===== 選手の動き（three.js 非依存） =====
// actor = { id, team, x, z, y（跳んでいる高さ）, vy, home（仕事が無いとき戻る所）, base（定位置）, task, moving, lastHit }
// task  = { kind, ok, contact, h, at, pending, jump, jumpAt, jumped, jumpOnArrive, whiff, end, then, target, hold, contactAt, start }
function newActor(id, team, x, z) {
  return { id, team, x, z, y: 0, vy: 0, home: { x, z }, base: { x, z }, task: null, moving: false, lastHit: null, stun: 0, fly: null,
    stride: 0, mdx: 0, mdz: 0, moveLeft: 0, dvx: 0, dvz: 0, landT: null, soot: false };
}
function dirOf(team) { return team === 0 ? 1 : -1; }      // 相手コートの向き（x の符号）
function riseTime() { return Math.sqrt(2 * CFG.jumpH / CFG.gravity); }   // 踏み切ってから最高点まで

// dt 進める。地上なら task.at（仕事が無ければ home）へ走る。jumpAt を過ぎたら跳ぶ。
// アタックの助走（planApproach）があれば、approachStart までは手前で待ち、そこから踏み切り位置へ走って跳び、空中で前へ流れる
function stepActor(a, dt, simT) {
  const t = a.task;
  if (a.y > 0) {
    a.vy -= CFG.gravity * dt;
    a.y += a.vy * dt;
    a.x += a.dvx * dt; a.z += a.dvz * dt;
    a.x = a.team === 0 ? Math.min(a.x, -0.35) : Math.max(a.x, 0.35);   // 空中でもネットは越えない
    if (a.y <= 0) { a.y = 0; a.vy = 0; a.dvx = a.dvz = 0; a.landT = simT; }
  }
  let g = t ? t.at : a.home, speed = CFG.runSpeed;
  if (t && t.approachSpot && !t.jumped) {
    if (simT < t.approachStart) g = t.approachSpot;
    else {
      g = t.takeoff;
      const left = Math.max(0.05, t.jumpAt - simT);
      speed = Math.min(CFG.runSpeed * 1.2, Math.max(2, Math.hypot(g.x - a.x, g.z - a.z) / left));   // 踏み切りの時刻に着く速さ
    }
  }
  a.moving = false;
  if (a.stun > 0) a.stun = Math.max(0, a.stun - dt);
  const waiting = t && t.delay && simT < t.start + t.delay;   // 反応が遅れて、まだ動き出さない
  if (a.y === 0 && !waiting && !(a.stun > 0)) {
    const dx = g.x - a.x, dz = g.z - a.z, d = Math.hypot(dx, dz), step = speed * dt;
    if (d > 0.02) {
      a.moving = true;
      a.mdx = dx / d; a.mdz = dz / d; a.moveLeft = d;
      const moved = Math.min(d, step);
      a.stride += moved;
      if (d <= step) { a.x = g.x; a.z = g.z; } else { a.x += a.mdx * step; a.z += a.mdz * step; }
    }
  }
  if (t && t.jumpOnArrive && t.jumpAt == null && !a.moving) t.jumpAt = simT;
  if (t && t.jumpAt != null && !t.jumped && simT >= t.jumpAt && a.y === 0) {
    t.jumped = true;
    a.vy = Math.sqrt(2 * CFG.gravity * CFG.jumpH);
    a.y = 1e-4;
    if (t.approachSpot) {                                 // 助走の勢いで前へ流れ、最高点で打つ所の上に来る
      const r = riseTime();
      a.dvx = (t.at.x - a.x) / r; a.dvz = (t.at.z - a.z) / r;
    }
  }
}

// アタックの助走を決める（t.at・t.jumpAt が決まったあとに呼ぶ）
function planApproach(a) {
  const t = a.task, M = CFG.motion, d = dirOf(a.team), G = CFG.gym;
  t.takeoff = { x: t.at.x - d * M.broad, z: t.at.z };
  t.approachSpot = { x: clamp(t.at.x - d * M.approachDist, -G.halfX + 0.5, G.halfX - 0.5), z: t.at.z };
  t.approachStart = t.jumpAt - M.approachTime;
}

// 爆弾に触れたか。'hit' / 'miss' / null（まだ）
function checkContact(a, ball) {
  const t = a.task;
  if (!t || !t.contact || t.pending || !ball.live || ball.held) return null;
  const p = ball.pos;
  if (t.kind === 'block') {                               // 手の範囲（ネット側へ 0.15m、肩幅＋腕 ±0.45m、跳んだ高さ＋1.8〜2.3m）に触れたら止める
    const hx = a.x + dirOf(a.team) * 0.15, r = CFG.ball.r;
    const dx = Math.max(Math.abs(p.x - hx) - 0.12, 0);
    const dz = Math.max(Math.abs(p.z - a.z) - 0.45, 0);
    const dy = Math.max(a.y + 1.8 - p.y, p.y - (a.y + 2.3), 0);
    if (a.y > 0.1 && dx * dx + dy * dy + dz * dz <= r * r) return 'hit';
    if (p.x * dirOf(a.team) < -1.0) return 'miss';        // 自陣の奥へ抜けた
    return null;
  }
  if (ball.vel.y > 0 || p.y > t.h) return null;           // まだ上にある
  if (Math.hypot(p.x - a.x, p.z - a.z) <= CFG.reach) return t.whiff ? 'miss' : 'hit';
  if (p.y < t.h - 0.6) return 'miss';
  return null;
}

// 選手どうしが重ならないよう押し合う。2 人とも爆弾へ走っていてぶつかったら、よろけて少し動けない
function separateActors(R) {
  const A = R.actors, min = CFG.player.r * 2;
  for (let i = 0; i < A.length; i++) for (let j = i + 1; j < A.length; j++) {
    const a = A[i], b = A[j];
    if (a.y > 0 || b.y > 0 || a.fly || b.fly) continue;
    const dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz);
    if (d >= min) continue;
    const nx = d > 1e-6 ? dx / d : 1, nz = d > 1e-6 ? dz / d : 0, push = (min - d) / 2;
    a.x -= nx * push; a.z -= nz * push;
    b.x += nx * push; b.z += nz * push;
    const chasing = o => o.task && o.task.contact && o.moving && !(o.stun > 0);
    if (chasing(a) && chasing(b)) {
      a.stun = b.stun = CFG.ai.bumpStun;
      R.events.push({ type: 'bump', a, b });
    }
  }
}
// ===== ラリーの流れ（three.js 非依存） =====
// R.state: 'choose'（スローで選択中）/ 'play'（それ以外の試合中）/ 'boom'（床に触れたあと）/ 'reset'（点のあと定位置へ戻る）/ 'over'（試合終了）
// 選ぶ場面: 'serve' ①自分のサーブ番 / 'incoming' ②相手が打った（attack なら相手のトス＝アタックが来る）/ 'tossed' ③味方が自分にトスした
// 描画側へは R.events に出来事を積む：choose / chosen / hit / miss / floor / explode / point / gameover / bump
const ACTIONS = ['receive', 'attack', 'block', 'serve'];

function newRally(rand) {
  const actors = CFG.startSpots.map((s, i) => newActor(i, s.team, s.x, s.z));
  return {
    state: 'play', simT: 0, ball: null, actors, me: actors[0], mate: actors[1],
    choose: null, boom: null, awaiting: false, events: [], rand: rand || Math.random,
    score: [0, 0], winner: null, resetT: 0, nextServe: 0, enemyServer: 0,
    idle: [false, false],                                 // テスト用：true のチームは AI が受けに行かない
  };
}
function partnerOf(R, a) { return R.actors.find(o => o.team === a.team && o !== a); }
function roll(R, p) { return R.rand() < p; }

function mishap(R, p) { return R.rand() >= 1 - p; }       // AI のミス（rand が 0 なら起きない）
function speedOf(b) { return Math.hypot(b.vel.x, b.vel.y, b.vel.z); }
// AI の反応の遅れ（秒）
function reaction(R) {
  const D = CFG.ai.delay;
  return D[0] + R.rand() * (D[1] - D[0]) + (mishap(R, CFG.ai.slowChance) ? CFG.ai.slowDelay : 0);
}
// AI のレシーブ（強い球なら成功率が下がる。反応の遅れあり）
function aiReceive(R, a, kind, hard) {
  const t = giveTask(R, a, kind || 'receive', roll(R, hard ? CFG.ai.dig : CFG.ai.receive), { h: CFG.contactH.receive });
  t.delay = reaction(R);
  return t;
}

// こちらの球が敵の側へ来た：落下地点に近いほうがレシーブ。bothGo なら 2 人とも向かう
function enemyDefend(R) {
  if (R.idle[1]) return;
  const land = predictDescent(R.ball, CFG.contactH.receive);
  const free = R.actors.filter(a => a.team === 1 && !(a.task && a.task.kind === 'block'));
  if (!land || !free.length) return;
  const dist = a => Math.hypot(a.x - land.x, a.z - land.z);
  free.sort((a, b) => dist(a) - dist(b));
  const hard = speedOf(R.ball) > CFG.hardSpeed;
  aiReceive(R, free[0], 'receive', hard);
  if (free[1] && mishap(R, CFG.ai.bothGo)) aiReceive(R, free[1], 'receive', hard);
}

// こちらのアタッカーがアタックに入った：blockTry の確率で、アタッカーに近い敵がブロックに跳ぶ
function enemyMaybeBlock(R, attacker) {
  if (R.idle[1] || !mishap(R, CFG.ai.blockTry)) return;
  const z = attacker.task.at.z;
  const opp = R.actors.filter(a => a.team === 1).sort((a, b) => Math.abs(a.z - z) - Math.abs(b.z - z));
  giveBlock(R, opp[0], roll(R, CFG.ai.block));
}

// サーブする人と、その立ち位置
function serverOf(R, team) { return team === 0 ? R.me : R.actors[2 + R.enemyServer]; }
function serveSpotOf(a) { return { x: -dirOf(a.team) * CFG.serveSpot, z: a.base.z * 0.5 }; }

// 試合を始める（0-0、自分のサーブ）
function newGame(R) {
  R.score = [0, 0]; R.winner = null;
  for (const a of R.actors) a.soot = false;
  startPoint(R, 0);
}

// 全員を定位置に置いて、すぐ team のサーブを始める（試合の最初とテスト用）
function startPoint(R, team) {
  for (const a of R.actors) {
    a.task = null; a.y = 0; a.vy = 0; a.lastHit = null; a.stun = 0; a.fly = null;
    a.home = { ...a.base }; a.x = a.base.x; a.z = a.base.z;
  }
  const s = serverOf(R, team);
  s.home = serveSpotOf(s); s.x = s.home.x; s.z = s.home.z;
  startServe(R, team);
}

// その場からサーブを始める。0 ならプレイヤーの①の選択、1 なら敵がサーブ（2 人が交代で打つ）
function startServe(R, team) {
  R.boom = null; R.choose = null; R.awaiting = false; R.state = 'play';
  const s = serverOf(R, team);
  R.ball = newBall(s.x, 1.2, s.z);
  R.ball.held = s;
  if (team === 0) { openChoice(R, 'serve'); return; }
  R.enemyServer ^= 1;
  giveServe(R, s, roll(R, CFG.ai.serve));
}

// 爆発を見せきったあと：点を入れ、勝敗が決まっていなければ定位置へ戻り始める
function endPoint(R, loser) {
  const scorer = 1 - loser;
  R.score[scorer]++;
  R.events.push({ type: 'point', scorer, score: R.score.slice() });
  R.boom = null; R.ball = null;
  for (const a of R.actors) { a.task = null; a.home = { ...a.base }; }
  if (R.score[scorer] >= CFG.winScore) {
    R.state = 'over'; R.winner = scorer;
    R.events.push({ type: 'gameover', winner: scorer, score: R.score.slice() });
    return;
  }
  R.state = 'reset'; R.resetT = 0; R.nextServe = loser;   // 取られた側がサーブ
  const s = serverOf(R, loser);
  s.home = serveSpotOf(s);
}

// 4 つの行動はどの場面でも押せる。場面に合わない行動は、合わないなりの動きになる（本人の判断、2026-10-05）
function openChoice(R, scene, attack) {
  R.state = 'choose';
  R.choose = { scene, attack: !!attack, left: CFG.choiceTime };
  R.events.push({ type: 'choose', scene, attack: !!attack });
}

// 爆弾がそのまま落ちると team の側か
function headingTo(R, team) {
  const l = predictDescent(R.ball, CFG.ball.r + 0.01);
  return !!l && sideOf(l.x) === team;
}

// 仕事を渡す。爆弾がもう自分の側へ来ているなら、すぐ行き先を決める（来ていなければ pending のまま）
function giveTask(R, a, kind, ok, extra) {
  a.task = Object.assign({ kind, ok, contact: true, pending: true, at: { x: a.x, z: a.z }, start: R.simT }, extra);
  const t = a.task;
  if (t.contact && t.pending && headingTo(R, a.team)) aimTask(R, a);
  return t;
}

// 落ちてくる場所を予測して行き先を決める。ネットを越えて相手側へは行かない
function aimTask(R, a) {
  const t = a.task, p = predictDescent(R.ball, t.h);
  if (!p) return;
  const G = CFG.gym;
  let x = clamp(p.x, -G.halfX + 0.5, G.halfX - 0.5);
  x = a.team === 0 ? Math.min(x, -0.4) : Math.max(x, 0.4);
  t.at = { x, z: clamp(p.z, -G.halfZ + 0.5, G.halfZ - 0.5) };
  t.pending = false;
  t.contactAt = R.simT + p.t;
  if (t.jump) t.jumpAt = t.contactAt - riseTime();
  if (t.kind === 'attack') planApproach(a);              // アタックは助走して跳ぶ
}
function retarget(R, team) {
  for (const a of R.actors) if (a.team === team && a.task && a.task.pending && a.task.kind !== 'block') aimTask(R, a);
}

// ジャンプサーブのトス：手（高さ 2.0m）から、tossTime 秒後に高さ contactH.serve を降りてくるとき、打つ所の真上に来る初速
function serveToss(a) {
  const J = CFG.jumpServe, d = dirOf(a.team), T = J.tossTime, x0 = a.x + d * 0.3, xc = -d * (CFG.court.halfLen - J.contactIn);
  return { pos: { x: x0, y: 2.0, z: a.z }, vel: { x: (xc - x0) / T, y: (CFG.contactH.serve - 2.0 + 0.5 * CFG.gravity * T * T) / T, z: 0 } };
}
// ジャンプサーブ：構えて、トスを上げ、エンドラインの 3m 後ろから助走し、ラインの手前で踏み切って、コートの中の空中で打つ
function giveServe(R, a, ok) {
  const J = CFG.jumpServe, d = dirOf(a.team);
  const t = giveTask(R, a, 'serve', ok, { h: CFG.contactH.serve, pending: false, hold: R.simT + CFG.serveHold, jump: true });
  t.approachSpot = { x: a.x, z: a.z };
  t.approachStart = t.hold + J.approachDelay;
  t.takeoff = { x: -d * J.takeoffX, z: a.z };
  t.at = { x: -d * (CFG.court.halfLen - J.contactIn), z: a.z };
  t.jumpAt = t.hold + J.tossTime - riseTime();
}
function giveReceive(R, a, ok) { return giveTask(R, a, 'receive', ok, { h: CFG.contactH.receive }); }
function giveReturn(R, a, ok) { return giveTask(R, a, 'return', ok, { h: CFG.contactH.receive }); }
function giveToss(R, a, target) { return giveTask(R, a, 'toss', roll(R, CFG.ai.toss), { h: CFG.contactH.toss, target }); }
function giveAttack(R, a, ok, kind) {
  const whiff = !ok && R.rand() < 0.5;                    // 失敗の半分は空振り、残りはネットにかける
  const t = giveTask(R, a, kind || 'attack', ok, { h: kind === 'direct' ? CFG.contactH.direct : CFG.contactH.attack, jump: true, whiff });
  if (a !== R.me && t.jumpAt != null && mishap(R, CFG.ai.earlyJump)) {   // AI：ジャンプが早すぎて空振り
    t.jumpAt -= 0.35;
    t.whiff = true;
  }
  if (a.team === 0) enemyMaybeBlock(R, a);
  return t;
}
// ブロック：相手のアタッカーの正面のネット際へ行き、打つ瞬間に合わせて跳ぶ
function giveBlock(R, a, ok) {
  const opp = R.actors.find(o => o.team !== a.team && o.task && (o.task.kind === 'attack' || o.task.kind === 'direct'));
  const z = opp ? opp.task.at.z : R.ball.pos.z;
  const t = giveTask(R, a, 'block', ok, { pending: false, at: { x: -dirOf(a.team) * 0.5, z: clamp(z, -4, 4) } });
  if (opp && opp.task.contactAt != null) t.jumpAt = opp.task.contactAt - riseTime() + 0.05;
  else t.jumpOnArrive = true;
  return t;
}
// 場面に合わない動き：'blockNoop' はネット際で跳ぶだけ、'whiff' はその場でサーブの構えをして空振り
function giveNoop(R, a, kind, then) {
  if (kind === 'blockNoop') return giveTask(R, a, kind, false, { contact: false, pending: false, at: { x: -dirOf(a.team) * 0.5, z: a.z }, jumpOnArrive: true, then });
  return giveTask(R, a, kind, false, { contact: false, pending: false, end: R.simT + 1.0, then });
}

// プレイヤーが選んだ（action が null なら時間切れ）
function choose(R, action) {
  if (R.state !== 'choose') return;
  const sc = R.choose.scene, attack = R.choose.attack, me = R.me, mate = R.mate, P = CFG.success, b = R.ball;
  R.choose = null; R.state = 'play';
  R.events.push({ type: 'chosen', action, scene: sc });
  if (sc === 'serve') {
    if (action === 'serve' || action === null) giveServe(R, me, roll(R, P.serve.serve));
    else if (action === 'block') giveNoop(R, me, 'blockNoop', () => openChoice(R, 'serve'));   // 爆弾を持ったままネット際で跳び、戻ってもう一度選ぶ
    else {                                                // その場で爆弾を放り上げ、レシーブかアタックで打つ
      const d = dirOf(me.team);
      b.held = null;
      b.pos = { x: me.x + d * 0.3, y: 1.3, z: me.z };
      b.vel = { x: 0, y: action === 'receive' ? 2.5 : 4, z: 0 };
      giveTask(R, me, action === 'receive' ? 'bump' : 'standSpike', roll(R, P.serve[action]),
        { h: action === 'receive' ? 0.9 : 1.9, pending: false });
    }
    return;
  }
  if (sc === 'incoming') {
    R.awaiting = true;
    const hard = attack || speedOf(b) > CFG.hardSpeed;
    if (action === 'receive') {
      giveReceive(R, me, roll(R, P.incoming.receive));
      if (mishap(R, CFG.ai.bothGo)) aiReceive(R, mate, 'receive', hard);   // 味方も向かってしまう
    } else if (action === 'attack') {
      giveAttack(R, me, roll(R, hard ? P.incoming.directHard : P.incoming.directSoft), 'direct');
    } else {
      if (action === 'block') giveBlock(R, me, attack && roll(R, P.incoming.block));
      else if (action === 'serve') giveNoop(R, me, 'whiff');
      aiReceive(R, mate, 'receive', hard);                // 空いた所は味方がカバー（時間切れも同じ）
    }
    return;
  }
  // 'tossed'
  if (action === 'attack') giveAttack(R, me, roll(R, P.tossed.attack));
  else if (action === 'receive') giveReturn(R, me, roll(R, P.tossed.receive));
  else if (action === 'block') giveNoop(R, me, 'blockNoop');
  else if (action === 'serve') giveNoop(R, me, 'whiff');
  else aiReceive(R, mate, 'return', false);              // 時間切れ：味方が返す
}

// 相手がブロックに跳んでいれば、そのブロックの成否に合わせてコースを決める：
// 成功（ok）なら手のある線へ打ち込む（＝手に当たって止まる）、失敗なら手の横 1.4m を抜く線にする
function spikeTarget(R, a, from, to) {
  const blk = R.actors.find(o => o.team !== a.team && o.task && o.task.kind === 'block');
  if (!blk) return to;
  const bx = blk.task.at.x + dirOf(blk.team) * 0.15;
  const bz = blk.task.at.z + (blk.task.ok ? 0 : (R.rand() < 0.5 ? -1.4 : 1.4));
  const W = CFG.court.halfWid - 0.3, dz = bz - from.z;
  let k = (to.x - from.x) / (bx - from.x);                // 手の位置を通る線を、床まで延ばす
  if (Math.abs(dz) > 1e-6) k = Math.min(k, (Math.sign(dz) * W - from.z) / dz);   // コートの横からはみ出さない所まで
  k = Math.max(k, 1.5);
  return { x: from.x + (bx - from.x) * k, z: from.z + dz * k };
}

// 打った球の初速。成功なら狙いどおり、失敗なら笑える方向へ
function shotFor(R, a, t) {
  const d = dirOf(a.team), p = R.ball.pos, rnd = R.rand, S = CFG.shots, W = CFG.court.halfWid - 0.7;
  const from = { x: p.x, y: p.y, z: p.z };
  const opp = (x0, x1) => ({ x: d * (x0 + rnd() * (x1 - x0)), z: (rnd() * 2 - 1) * W });   // 相手コートのネットから x0〜x1 m
  const shank = () => shotVelocity(from, { x: -d * (9.5 + rnd() * 3), z: (rnd() * 2 - 1) * 7 }, from.y + 1.5 + rnd() * 2);   // 自陣の後ろへ弾く
  const intoNet = () => { const dx = -p.x, dy = 1.7 - p.y, n = Math.hypot(dx, dy) || 1; return { x: dx / n * 14, y: dy / n * 14, z: 0 }; };
  switch (t.kind) {
    case 'receive': return t.ok ? shotVelocity(from, { x: -d * S.pass.toX, z: 0 }, S.pass.apex) : shank();
    case 'toss':
      return t.ok ? shotVelocity(from, { x: -d * S.set.toX, z: clamp(t.target.z, -3.5, 3.5) }, S.set.apex)
                  : shotVelocity(from, { x: -d * 0.3, z: p.z }, from.y + 0.8);          // 低いトスでネット際に落ちる
    case 'attack': case 'direct': case 'standSpike':
      return t.ok ? spikeVelocity(from, spikeTarget(R, a, from, opp(4.5, 8.5)), S.spikeSpeed) : intoNet();
    case 'block': return spikeVelocity(from, opp(1.5, 4), 10);
    case 'return': return t.ok ? shotVelocity(from, opp(5, 8.5), S.returnApex) : shank();
    case 'bump': return t.ok ? shotVelocity(from, opp(5, 8.5), S.returnApex) : shotVelocity(from, { x: p.x - d * 0.6, z: p.z + 0.4 }, from.y + 1.2);   // 足元に落とす
    case 'serve': return t.ok ? spikeVelocity(from, opp(4, 8.5), CFG.jumpServe.speed) : shotVelocity(from, { x: -d * 0.6, z: p.z * 0.5 }, from.y + 0.3);   // ネットに届かない
  }
  return { x: 0, y: 0, z: 0 };
}

// 打ったあと：レシーブ → 相方がトス、トス → 相方（レシーブした人）がアタック。相手側へ飛んだら相手の pending を決める
function afterHit(R, a, t) {
  const partner = partnerOf(R, a);
  if (a.team === 0) R.awaiting = false;
  if (t.ok && t.kind === 'receive') giveToss(R, partner, a);
  if (t.ok && t.kind === 'toss') {
    if (partner === R.me) openChoice(R, 'tossed');
    else giveAttack(R, partner, roll(R, CFG.ai.attack));
    if (a.team === 1 && !R.awaiting && R.state !== 'choose') openChoice(R, 'incoming', true);   // 敵のトス＝アタックが来る
  }
  if (!headingTo(R, a.team)) {                            // 相手側へ飛んだ
    retarget(R, 1 - a.team);
    if (a.team === 0) enemyDefend(R);
    if (a.team === 1 && !R.awaiting && R.state !== 'choose') openChoice(R, 'incoming', false);
  }
}

function resolveContact(R, a, c) {
  const t = a.task;
  a.task = null;
  a.home = { ...a.base };                                 // サーブを打ったら定位置へ戻る
  if (c === 'miss') { R.events.push({ type: 'miss', actor: a, kind: t.kind }); return; }   // 2 人で追っていれば、もう 1 人はそのまま追う
  const p = partnerOf(R, a);
  if (p.task && p.task.contact && p.task.kind === t.kind) p.task = null;   // もう 1 人が触った球は追わない
  a.lastHit = { kind: t.kind, at: R.simT };
  R.ball.vel = shotFor(R, a, t);
  R.events.push({ type: 'hit', actor: a, kind: t.kind, ok: t.ok });
  afterHit(R, a, t);
}

function onFloor(R, hit) {
  for (const a of R.actors) a.task = null;
  R.state = 'boom'; R.choose = null;
  R.boom = { t: 0, hit, fired: false };
  R.events.push({ type: 'floor', x: hit.x, z: hit.z, side: hit.side });
}

// realDt（実時間）進める。選択中はゲームの時間を slowScale 倍にする
function tickRally(R, realDt) {
  const dt = R.state === 'choose' ? realDt * CFG.slowScale : realDt;
  if (R.state === 'choose') R.choose.left -= realDt;
  R.simT += dt;
  for (const a of R.actors) { if (a.fly) stepFly(a, dt, R); else stepActor(a, dt, R.simT); }
  separateActors(R);
  collideFlyers(R);
  for (const a of R.actors) {                             // 爆弾に触らない動き（空振り・跳ぶだけ）の終わり
    const t = a.task;
    if (!t || t.contact) continue;
    if (t.end != null ? R.simT >= t.end : (t.jumped && a.y === 0)) { a.task = null; if (t.then) t.then(); }
  }
  const b = R.ball;
  if (b && b.held) {
    const a = b.held, d = dirOf(a.team), t = a.task;
    b.pos = { x: a.x + d * 0.35, y: a.y + 1.15, z: a.z };
    if (t && t.kind === 'serve' && R.simT >= t.hold) {    // 構えの間が終わったらトスを上げる
      b.held = null;
      const s = serveToss(a); b.pos = s.pos; b.vel = s.vel;
    }
  } else if (b && b.live) {
    for (const a of R.actors) { const c = checkContact(a, b); if (c) resolveContact(R, a, c); }
    const colliders = R.actors.filter(a => !(a.task && a.task.contact) && !(a.lastHit && R.simT - a.lastHit.at < 0.4)).map(a => ({ x: a.x, z: a.z }));   // 打とうとしている人・打ったばかりの人には当たらない（打った球を自分の体で弾かない）
    const hit = stepBall(b, dt, colliders, R.rand);
    if (hit) onFloor(R, hit);
  }
  if (R.state === 'choose' && R.choose.left <= 0) choose(R, null);   // 時間切れ：味方に任せる
  if (R.state === 'boom') {
    R.boom.t += realDt;
    if (!R.boom.fired && R.boom.t >= CFG.explodeDelay) {
      R.boom.fired = true;
      R.events.push({ type: 'explode', x: R.boom.hit.x, z: R.boom.hit.z, side: R.boom.hit.side });
      blastActors(R, R.boom.hit);                         // 選手を吹っ飛ばす
    }
    const settled = R.actors.every(a => !a.fly);          // 全員が起き上がった
    if (R.boom.t >= CFG.explodeDelay + CFG.afterBoom && (settled || R.boom.t >= CFG.blast.maxTime)) endPoint(R, R.boom.hit.side);
  }
  if (R.state === 'reset') {                              // 全員が定位置（サーブの人はサーブ位置）に着いたら次のサーブ
    R.resetT += realDt;
    const flying = R.actors.some(a => a.fly);
    if (flying) R.resetT = 0;
    const home = R.actors.every(a => Math.hypot(a.x - a.home.x, a.z - a.home.z) < 0.05);
    if (!flying && (home || R.resetT > CFG.resetMax)) startServe(R, R.nextServe);
  }
}
// ===== 吹っ飛び（three.js 非依存） =====
// 爆発で選手を体ごと飛ばす。体は中心の高さ center・半径 r の球として、天井・壁・床・ネット・他の選手に当たる
// actor.fly = { pos（体の中心）, vel, rx, rz（回転）, spinX, spinZ, state, t, hung }
// state: 'air' 飛んでいる / 'stick' 壁に張り付き→ずり落ちる / 'slide' 床を滑る / 'hang' ネットにぶら下がる / 'down' 倒れている / 'getup' 起き上がる
// 起き上がり終わると actor.fly は null に戻り、普段の動き（stepActor）に戻る

// 体ごと飛ばす（今の仕事は捨てる）
function launch(R, a, vel) {
  const B = CFG.blast;
  a.task = null; a.stun = 0; a.soot = true;   // 吹っ飛んだ人はすすだらけ
  a.fly = {
    pos: { x: a.x, y: a.y + B.center, z: a.z }, vel, rx: 0, rz: 0,
    spinX: (R.rand() - 0.5) * B.spin, spinZ: (R.rand() - 0.5) * B.spin, state: 'air', t: 0, hung: false,
  };
}

// 爆発（hit = { x, z, side }）で選手を飛ばす。爆発した側は全員、反対側は爆心の近くの人だけ軽く
function blastActors(R, hit) {
  const B = CFG.blast;
  for (const a of R.actors) a.soot = false;               // 前の爆発のすすは落ちる（次の爆発まではそのまま）
  for (const a of R.actors) {
    const dx = a.x - hit.x, dz = a.z - hit.z, d = Math.hypot(dx, dz);
    let k;
    if (a.team === hit.side) k = Math.max(B.minPower, 1 - d / B.radius);
    else if (d < B.nearRadius) k = B.nearPower * (1 - d / B.nearRadius);
    else continue;
    let nx, nz;
    if (d > 0.1) { nx = dx / d; nz = dz / d; }
    else { const ang = R.rand() * Math.PI * 2; nx = Math.cos(ang); nz = Math.sin(ang); }   // 真上で爆発したら向きはでたらめ
    nx += (a.x < 0 ? -1 : 1) * B.outward;                 // 自陣の奥（横の壁）のほうへ寄せる
    const nn = Math.hypot(nx, nz) || 1;
    nx /= nn; nz /= nn;
    nz *= nz > 0 ? B.zFront : B.zBack;                    // カメラのほう（+z）へはあまり飛ばさない（画面の外へ出るため）
    const jit = () => 1 + (R.rand() - 0.5) * 2 * B.jitter;
    const side = B.speed * k * jit();
    const up = B.up * k * jit() * (mishap(R, B.superChance) ? B.superMul : 1);
    launch(R, a, { x: nx * side, y: up, z: nz * side });
  }
}

// 体とネット（白帯から下 1m の薄い板）。引っかかったら true
function hitNetBody(a, R) {
  const f = a.fly, p = f.pos, v = f.vel, N = CFG.net, B = CFG.blast, r = B.r;
  const dx = p.x - clamp(p.x, -N.thick / 2, N.thick / 2);
  const dy = p.y - clamp(p.y, N.bottom, N.top);
  const dz = p.z - clamp(p.z, -N.halfWid, N.halfWid);
  const d = Math.hypot(dx, dy, dz);
  if (d >= r) return false;
  const side = p.x < 0 ? -1 : 1;
  if (!f.hung && mishap(R, B.netHang)) {                  // ネットに引っかかってぶら下がる
    f.hung = true; f.state = 'hang'; f.t = 0;
    p.x = side * 0.3; p.y = N.top - 0.35; p.z = clamp(p.z, -N.halfWid + 0.5, N.halfWid - 0.5);
    v.x = v.y = v.z = 0;
    R.events.push({ type: 'net', actor: a });
    return true;
  }
  if (d < 1e-6) {                                         // 中心がネットの中：来た側へ押し出す
    p.x = side * (N.thick / 2 + r);
    if (v.x * side < 0) v.x = -v.x * B.bounce;
    return false;
  }
  const k = (r - d) / d;
  p.x += dx * k; p.y += dy * k; p.z += dz * k;
  const nx = dx / d, ny = dy / d, nz = dz / d, vn = v.x * nx + v.y * ny + v.z * nz;
  if (vn < 0) { const j = (1 + B.bounce) * vn; v.x -= j * nx; v.y -= j * ny; v.z -= j * nz; }
  return false;
}

// 壁（x=±halfX, z=±halfZ）。速く当たったら張り付く（true）、遅ければ跳ね返る
function hitWallsBody(a, R, canStick) {
  const f = a.fly, p = f.pos, v = f.vel, G = CFG.gym, B = CFG.blast;
  for (const [ax, lim] of [['x', G.halfX], ['z', G.halfZ]]) {
    if (Math.abs(p[ax]) + B.r <= lim) continue;
    const s = Math.sign(p[ax]);
    p[ax] = s * (lim - B.r);
    if (v[ax] * s <= 0) continue;                         // 離れていく向き
    if (canStick && Math.abs(v[ax]) > B.stickSpeed) {
      f.state = 'stick'; f.t = 0;
      v.x = v.y = v.z = 0;
      R.events.push({ type: 'crash', actor: a, x: p.x, y: p.y, z: p.z });
      R.events.push({ type: 'stick', actor: a, axis: ax, sign: s, x: p.x, y: p.y, z: p.z });   // 壁の人型の跡を残す
      return true;
    }
    v[ax] = -v[ax] * B.bounce;
  }
  return false;
}

// 飛んでいる人を dt 進める
function stepFly(a, dt, R) {
  const f = a.fly, B = CFG.blast, G = CFG.gym, p = f.pos, v = f.vel;
  f.t += dt;
  if (f.state === 'air') {
    v.y -= CFG.gravity * dt;
    p.x += v.x * dt; p.y += v.y * dt; p.z += v.z * dt;
    f.rx += f.spinX * dt; f.rz += f.spinZ * dt;
    if (p.y + B.r > G.ceil) {                             // 天井
      p.y = G.ceil - B.r;
      if (v.y > 0) { v.y = -v.y * B.bounce; R.events.push({ type: 'crash', actor: a, x: p.x, y: p.y, z: p.z }); }
    }
    if (!hitWallsBody(a, R, true) && !hitNetBody(a, R) && p.y - B.r <= 0) {   // 床
      p.y = B.r;
      R.events.push({ type: 'land', actor: a, x: p.x, z: p.z });
      if (v.y < -B.landSpeed) { v.y = -v.y * B.floorBounce; f.spinX *= 0.6; f.spinZ *= 0.6; }
      else { v.y = 0; f.state = 'slide'; f.t = 0; }
    }
  } else if (f.state === 'stick') {                       // 壁に張り付いて、少ししたらずり落ちる
    if (f.t > B.stickTime) {
      p.y -= B.slideDown * dt;
      if (p.y - B.r <= 0) { p.y = B.r; f.state = 'down'; f.t = 0; }
    }
  } else if (f.state === 'slide') {                       // 床を滑る
    const s = Math.hypot(v.x, v.z), ns = Math.max(0, s - B.friction * dt);
    if (s > 0) { v.x *= ns / s; v.z *= ns / s; }
    p.x += v.x * dt; p.z += v.z * dt;
    hitWallsBody(a, R, false);
    f.spinX *= Math.max(0, 1 - dt * 3); f.spinZ *= Math.max(0, 1 - dt * 3);
    if (ns < 0.3) { f.state = 'down'; f.t = 0; }
  } else if (f.state === 'hang') {                        // ネットにぶら下がって、落ちる
    if (f.t > B.hangTime) { f.state = 'air'; f.t = 0; v.x = (p.x < 0 ? -1 : 1) * 0.8; v.y = 0; v.z = 0; }
  } else if (f.state === 'down') {
    if (f.t > B.downTime) { f.state = 'getup'; f.t = 0; }
  } else if (f.state === 'getup') {
    if (f.t > B.getupTime) {
      a.x = p.x; a.z = p.z; a.y = 0; a.vy = 0; a.fly = null;
      R.events.push({ type: 'getup', actor: a });
      return;
    }
  }
  a.x = p.x; a.z = p.z;
}

// 飛んでいる体どうし、飛んでいる体と立っている人のぶつかり。立っている人は一緒に吹っ飛ぶ
function collideFlyers(R) {
  const A = R.actors, B = CFG.blast, min = B.r * 2;
  const airborne = o => o.fly && o.fly.state === 'air';
  for (let i = 0; i < A.length; i++) for (let j = i + 1; j < A.length; j++) {
    const a = A[i], b = A[j];
    if (!airborne(a) && !airborne(b)) continue;
    if ((a.fly && !airborne(a)) || (b.fly && !airborne(b))) continue;   // 寝ている・張り付いている人とはぶつからない
    const pa = a.fly ? a.fly.pos : { x: a.x, y: B.center, z: a.z };
    const pb = b.fly ? b.fly.pos : { x: b.x, y: B.center, z: b.z };
    const dx = pb.x - pa.x, dy = pb.y - pa.y, dz = pb.z - pa.z, d = Math.hypot(dx, dy, dz);
    if (d >= min || d < 1e-6) continue;
    if (!b.fly || !a.fly) {                                // 立っている人に当たった：勢いを半分ずつ分ける
      const flyer = a.fly ? a : b, other = a.fly ? b : a, v = flyer.fly.vel;
      launch(R, other, { x: v.x * 0.5, y: Math.abs(v.y) * 0.5 + 3, z: v.z * 0.5 });
      v.x *= 0.5; v.y *= 0.5; v.z *= 0.5;
    } else {                                               // 飛んでいる体どうし：ぶつかる向きの速さを交換する
      const va = a.fly.vel, vb = b.fly.vel, nx = dx / d, ny = dy / d, nz = dz / d;
      const rel = (va.x - vb.x) * nx + (va.y - vb.y) * ny + (va.z - vb.z) * nz;
      if (rel <= 0) continue;                             // 離れていく向き
      const k = rel * 0.9;
      va.x -= k * nx; va.y -= k * ny; va.z -= k * nz;
      vb.x += k * nx; vb.y += k * ny; vb.z += k * nz;
    }
    R.events.push({ type: 'collide', a, b });
  }
}

// 爆弾が爆発しても、実況はあくまで真面目に。出来事の種類から文を選ぶ
const COMMENT_LINES = {

  receive: ['見事なレシーブ！', 'きれいに上げました', '落ち着いて拾いました'],

  bump: ['おっと、ぶつかった！', 'お見合い……ではなく、衝突です'],
  explodeUs: ['あーっと、自陣で爆発！', 'これは痛い！'],
  explodeThem: ['決まったー！ 相手コートで爆発！', '相手コート、爆発です！'],
  ceiling: ['天井まで飛んだ！', '天井に届きました'],
  stick: ['壁に、張り付いています', 'これは見事な大の字'],
  net: ['ネットに引っかかっています', 'ネットにぶら下がっています'],
  getup: ['何事もなかったかのように起き上がります', '平然と立ち上がりました', '試合は続きます'],
  gameover: ['試合終了！', 'ここで試合終了です'],
};
// 優先度：出している間は、これより大きいものだけ差し替える
const COMMENT_PRIO = { serve: 0, toss: 0, receive: 1, attack: 1, miss: 1, getup: 1, block: 2, bump: 2, ceiling: 2, stick: 2, net: 2,
  explodeUs: 3, explodeThem: 3, gameover: 3 };

// 出来事 → 実況の種類（言わないものは null）
function commentKey(e) {
  if (e.type === 'hit') {
    if (e.kind === 'serve') return 'serve';
    if (e.kind === 'toss') return 'toss';
    if (e.kind === 'block') return 'block';
    if (['attack', 'direct', 'standSpike'].includes(e.kind)) return e.ok ? 'attack' : null;
    if (['receive', 'return', 'bump'].includes(e.kind)) return e.ok ? 'receive' : null;
    return null;
  }
  if (e.type === 'explode') return e.side === 0 ? 'explodeUs' : 'explodeThem';
  if (e.type === 'crash') return e.y > CFG.gym.ceil - 1 ? 'ceiling' : null;
  if (['miss', 'bump', 'stick', 'net', 'getup', 'gameover'].includes(e.type)) return e.type;
  return null;
}

// C = { until, prio, last }（出している文の状態）。now は実時間。出すなら文、出さないなら null
function pickComment(C, e, now, rand) {
  const key = commentKey(e);
  if (!key) return null;
  const prio = COMMENT_PRIO[key];
  if (now < C.until && prio <= C.prio) return null;
  const lines = COMMENT_LINES[key].filter(s => s !== C.last);   // 同じ文は続けない
  const text = lines[Math.floor((rand || Math.random)() * lines.length)];
  C.until = now + CFG.comment.hold; C.prio = prio; C.last = text;
  return text;
}

POSES.run2 = mirrorPose(POSES.run1);                      // 走る（右脚が前）
POSES.flail2 = mirrorPose(POSES.flail1);
POSES.shuffle2 = mirrorPose(POSES.shuffle1);

// 左右を入れ替えたポーズ（L ↔ R。ry と rz は向きが逆になる）
function mirrorPose(p) {
  const out = { hipsDrop: p.hipsDrop };
  for (const k in p) {
    if (k === 'hipsDrop') continue;
    const m = k.endsWith('L') ? k.slice(0, -1) + 'R' : k.endsWith('R') ? k.slice(0, -1) + 'L' : k;
    out[m] = [p[k][0], -p[k][1], -p[k][2]];
  }
  return out;
}

// 2 つのポーズを k（0〜1）で混ぜる。無い関節は 0
function blendPose(a, b, k) {
  const out = { hipsDrop: (a.hipsDrop || 0) + ((b.hipsDrop || 0) - (a.hipsDrop || 0)) * k };
  for (const n of JOINTS) {
    const ra = a[n] || [0, 0, 0], rb = b[n] || [0, 0, 0];
    out[n] = [ra[0] + (rb[0] - ra[0]) * k, ra[1] + (rb[1] - ra[1]) * k, ra[2] + (rb[2] - ra[2]) * k];
  }
  return out;
}

// クリップ = [[時刻, ポーズ名], ...]。時刻 t のポーズを、前後のキーの間でなめらかに（smoothstep）混ぜて返す
function sampleClip(clip, t) {
  if (t <= clip[0][0]) return POSES[clip[0][1]];
  for (let i = 1; i < clip.length; i++) {
    if (t === clip[i][0]) return POSES[clip[i][1]];       // ちょうどキーの時刻（混ぜると小数の誤差が出るので、そのまま返す）
    if (t < clip[i][0]) {
      const [t0, p0] = clip[i - 1], [t1, p1] = clip[i];
      const k = (t - t0) / (t1 - t0), s = k * k * (3 - 2 * k);
      return blendPose(POSES[p0], POSES[p1], s);
    }
  }
  return POSES[clip[clip.length - 1][1]];
}

// クリップの時刻は「爆弾に触る瞬間」を 0 にする（ブロックは跳んだ最高点、空振りは振り下ろす瞬間）。
// アタック・ブロックの踏み切りは -0.43（riseTime）、着地は +0.43。ゲームの判定の時刻と合わせてある
const CLIPS = {
  attack: [[-1.2, 'approachReady'], [-0.75, 'step1'], [-0.6, 'step2'], [-0.5, 'armsBack'], [-0.43, 'takeoff'],
    [-0.25, 'spikeBack'], [-0.04, 'spikeBack'], [0, 'spikeHit'], [0.15, 'spikeFollow'], [0.43, 'landing'], [0.75, 'ready']],
  direct: [[-0.6, 'ready'], [-0.5, 'armsBack'], [-0.43, 'takeoff'], [-0.25, 'spikeBack'], [-0.04, 'spikeBack'],
    [0, 'spikeHit'], [0.15, 'spikeFollow'], [0.43, 'landing'], [0.75, 'ready']],
  standSpike: [[-0.5, 'ready'], [-0.25, 'spikeBack'], [-0.03, 'spikeBack'], [0, 'spikeHit'], [0.2, 'spikeFollow'], [0.6, 'ready']],
  receive: [[-0.6, 'receiveReady'], [-0.12, 'receive'], [0, 'receivePush'], [0.3, 'receivePush'], [0.6, 'ready']],
  toss: [[-0.6, 'tossReady'], [-0.1, 'toss'], [0, 'tossPush'], [0.3, 'tossPush'], [0.6, 'ready']],
  block: [[-0.75, 'blockReady'], [-0.55, 'blockDip'], [-0.43, 'blockTakeoff'], [-0.1, 'blockReach'], [0.15, 'blockReach'],
    [0.43, 'landing'], [0.75, 'ready']],
  serve: [[-2.2, 'serveHold'], [-1.35, 'serveHold'], [-1.25, 'serveToss'], [-1.0, 'approachReady'], [-0.8, 'step1'], [-0.62, 'step2'],
    [-0.5, 'armsBack'], [-0.43, 'takeoff'], [-0.25, 'spikeBack'], [-0.04, 'spikeBack'], [0, 'spikeHit'], [0.15, 'spikeFollow'], [0.43, 'landing'], [0.75, 'ready']],
  whiff: [[-0.4, 'ready'], [-0.2, 'spikeBack'], [0, 'spikeHit'], [0.2, 'spikeFollow'], [0.6, 'ready']],
};
CLIPS.return = CLIPS.receive;
CLIPS.bump = CLIPS.receive;
CLIPS.blockNoop = CLIPS.block;
const LAND_CLIP = [[0, 'landing'], [0.35, 'ready']];
const WAIT_POSE = { receive: 'receiveReady', bump: 'receiveReady', return: 'receiveReady', toss: 'tossReady',
  serve: 'serveHold', attack: 'approachReady', block: 'blockReady', blockNoop: 'blockReady' };

// クリップの 0 の時刻（まだ決まっていなければ null）
function clipAnchor(t) {
  if (t.kind === 'serve') return t.hold + CFG.jumpServe.tossTime;
  if (t.kind === 'block' || t.kind === 'blockNoop') return t.jumpAt != null ? t.jumpAt + riseTime() : null;
  if (t.kind === 'whiff') return t.start + 0.4;
  return t.contactAt != null ? t.contactAt : null;
}

// 近い所へ動くときはサイドステップ（ネットを向いたまま）
function isShuffle(a) { return a.moving && a.moveLeft < CFG.motion.shuffleDist; }

// 走る・サイドステップの脚は、歩いた距離で回す（時間で回すと、速さと脚が合わない）
function runPose(a) {
  const k = (Math.sin(a.stride / CFG.motion.strideLen * Math.PI * 2) + 1) / 2;
  return isShuffle(a) ? blendPose(POSES.shuffle1, POSES.shuffle2, k) : blendPose(POSES.run1, POSES.run2, k);
}

// 選手の状態（15-actors.js の actor）から、今とるべきポーズを返す
function motionFor(a, simT) {
  if (a.stun > 0) return POSES.stagger;
  const h = a.lastHit;
  if (h && CLIPS[h.kind] && simT - h.at < 0.8) return sampleClip(CLIPS[h.kind], simT - h.at);   // 打ったあとの続き
  const t = a.task;
  if (t && CLIPS[t.kind]) {
    const at = clipAnchor(t);
    if (at !== null && simT - at >= CLIPS[t.kind][0][0]) return sampleClip(CLIPS[t.kind], simT - at);   // 予定の時刻が近づいた
  }
  if (a.y > 0) return POSES.jump;
  if (a.landT != null && simT - a.landT < 0.35) return sampleClip(LAND_CLIP, simT - a.landT);
  if (a.moving) return runPose(a);
  if (t && WAIT_POSE[t.kind]) return POSES[WAIT_POSE[t.kind]];
  return POSES.ready;
}

// 体の向き（root の y 回転）。止まっている・近くへ動く・吹っ飛んでいるときはネットのほう、遠くへ走るときは進む向き
function facingFor(a) {
  const net = a.team === 0 ? Math.PI / 2 : -Math.PI / 2;
  if (!a.moving || isShuffle(a) || a.fly) return net;
  return Math.atan2(a.mdx, a.mdz);
}

// 吹っ飛んでいる人のポーズ（20-blast.js の fly.state から）
function flyPose(f, simT) {
  if (f.state === 'air' || f.state === 'hang') return Math.sin(simT * 18) > 0 ? POSES.flail1 : POSES.flail2;
  if (f.state === 'stick') return POSES.splat;
  if (f.state === 'getup') return f.t < CFG.blast.getupTime * 0.5 ? POSES.lie : POSES.ready;
  return POSES.lie;
}
// ===== 爆発のリプレイ（記録と当て直し。three.js の物は作らない） =====
// 毎フレーム、選手と爆弾の見た目（位置・回転・関節）を記録しておき、点が入ったら爆発の前後をスローで見せ直す
function makeRecorder() { return { frames: [] }; }

// t は実時間。keep 秒より古いフレームは捨てる
function recordFrame(rec, t, players, bomb, keep) {
  rec.frames.push({
    t,
    players: players.map(pl => ({
      p: [pl.root.position.x, pl.root.position.y, pl.root.position.z],
      ry: pl.root.rotation.y,
      tr: [pl.tumble.rotation.x, pl.tumble.rotation.z],
      hy: pl.j.hips.position.y,
      j: JOINTS.map(n => [pl.j[n].rotation.x, pl.j[n].rotation.y, pl.j[n].rotation.z]),
    })),
    ball: bomb.g.visible ? [bomb.g.position.x, bomb.g.position.y, bomb.g.position.z] : null,
  });
  while (rec.frames.length && rec.frames[0].t < t - keep) rec.frames.shift();
}

// 時刻 t 以前で一番新しいフレーム（t が最初より前なら最初）
function frameAt(rec, t) {
  const F = rec.frames;
  let lo = 0, hi = F.length - 1;
  if (t <= F[0].t) return F[0];
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (F[mid].t <= t) lo = mid; else hi = mid - 1;
  }
  return F[lo];
}

// フレームの見た目を、選手と爆弾に当て直す
function applyFrame(f, players, bomb) {
  f.players.forEach((s, i) => {
    const pl = players[i];
    pl.root.position.x = s.p[0]; pl.root.position.y = s.p[1]; pl.root.position.z = s.p[2];
    pl.root.rotation.y = s.ry;
    pl.tumble.rotation.x = s.tr[0]; pl.tumble.rotation.z = s.tr[1];
    JOINTS.forEach((n, k) => { const r = pl.j[n].rotation; r.x = s.j[k][0]; r.y = s.j[k][1]; r.z = s.j[k][2]; });
    pl.j.hips.position.y = s.hy;
  });
  bomb.g.visible = bomb.shadow.visible = !!f.ball;
  if (f.ball) {
    bomb.g.position.x = f.ball[0]; bomb.g.position.y = f.ball[1]; bomb.g.position.z = f.ball[2];
    bomb.shadow.position.x = f.ball[0]; bomb.shadow.position.z = f.ball[2];
  }
}
// ===== 検証ハーネス =====
const __results = [];
function test(name, fn) {
  try { fn(); __results.push({ name, ok: true }); }
  catch (e) { __results.push({ name, ok: false, why: e.message }); }
}
function eq(actual, expected, label) {
  const a = JSON.stringify(actual), b = JSON.stringify(expected);
  if (a !== b) throw new Error((label ? label + ': ' : '') + 'expected ' + b + ' but got ' + a);
}
function near(actual, expected, tol, label) {
  if (!(Math.abs(actual - expected) <= tol)) throw new Error((label ? label + ': ' : '') + 'expected ' + expected + ' ±' + tol + ' but got ' + actual);
}

// ===== 爆弾の物理 =====
const noRand = () => 0;
function run(b, sec, players) {          // sec 秒ぶん 1/60 ずつ進め、床に触れたらその結果を返す
  for (let i = 0; i < Math.round(sec * 60); i++) {
    const h = stepBall(b, 1 / 60, players || [], noRand);
    if (h) return h;
  }
  return null;
}

test('sideOf: ネットより左は 0（味方）、右は 1（敵）', () => {
  eq([sideOf(-0.1), sideOf(0.1), sideOf(-8), sideOf(14)], [0, 1, 0, 1]);
});

test('空中では爆発しない（放物線の途中）', () => {
  const b = newBall(-4, 5, 0); b.vel = { x: 2, y: 4, z: 0 };
  eq(run(b, 0.3), null);
  eq(b.live, true);
});

test('床に触れたら爆発の結果を返し、live が false になる', () => {
  const b = newBall(-4, 3, 1);
  const h = run(b, 1.0);
  eq(h && h.side, 0);
  near(h.x, -4, 0.001); near(h.z, 1, 0.001);
  eq(b.live, false);
  eq(stepBall(b, 1 / 60, [], noRand), null, '2回目は返さない');
});

// ===== ラリー =====
const zero = () => 0;
function runFor(R, sec) {
  const ev = R.events.splice(0);
  for (let i = 0; i < Math.round(sec * 60); i++) { tickRally(R, 1 / 60); ev.push(...R.events.splice(0)); }
  return ev;
}
function runUntilChoose(R, sec) {                          // 'choose' が出るまで進め、その間の出来事を返す
  const ev = R.events.splice(0);
  for (let i = 0; i < Math.round(sec * 60) && !ev.some(e => e.type === 'choose'); i++) {
    tickRally(R, 1 / 60);
    ev.push(...R.events.splice(0));
  }
  return ev;
}
function runUntil(R, type, sec) {                          // type の出来事が出るまで（最大 sec 秒）進め、その間の出来事を返す
  const ev = R.events.splice(0);
  for (let i = 0; i < Math.round(sec * 60) && !ev.some(e => e.type === type); i++) {
    tickRally(R, 1 / 60);
    ev.push(...R.events.splice(0));
  }
  return ev;
}
const hitBy = (ev, a, kind) => ev.some(e => e.type === 'hit' && e.actor === a && e.kind === kind);
const boomSide = ev => { const e = ev.find(e => e.type === 'explode'); return e ? e.side : null; };
function quietRally() { const R = newRally(zero); R.idle[1] = true; return R; }   // 敵が受けない（Phase 2 までのテスト用）
function enemyAttack(R) {                                  // 試し：敵がネット際でトスを上げ、もう 1 人がアタックしてくる
  startPoint(R, 1);
  for (const a of R.actors) a.task = null;
  R.events.length = 0;
  const setter = R.actors[2], hitter = R.actors[3];
  setter.home = { x: 2.5, z: 0 }; setter.x = 2.5; setter.z = 0;
  R.ball = newBall(2.5, 2.3, 0);
  R.ball.vel = shotVelocity(R.ball.pos, { x: CFG.shots.set.toX, z: hitter.base.z * 0.5 }, CFG.shots.set.apex);
  afterHit(R, setter, { kind: 'toss', ok: true });
}
function withAI(changes, fn) {                             // CFG.ai を一時的に変えて試す
  const old = {};
  for (const k in changes) { old[k] = CFG.ai[k]; CFG.ai[k] = changes[k]; }
  try { fn(); } finally { Object.assign(CFG.ai, old); }
}

// ===== 吹っ飛び =====
function withBlast(changes, fn) {                          // CFG.blast を一時的に変えて試す
  const old = {};
  for (const k in changes) { old[k] = CFG.blast[k]; CFG.blast[k] = changes[k]; }
  try { fn(); } finally { Object.assign(CFG.blast, old); }
}
function soloR(...actors) { return { actors, events: [], rand: zero }; }
function flyFor(R, a, sec) { for (let i = 0; i < Math.round(sec * 60) && a.fly; i++) stepFly(a, 1 / 60, R); }

test('blastActors: 爆発した側の 2 人は上へ・外へ飛び、反対側の遠い人は飛ばない', () => {
  const R = quietRally();
  startPoint(R, 0);
  blastActors(R, { x: 5, z: 0, side: 1 });
  const [me, mate, e2, e3] = R.actors;
  eq([!!me.fly, !!mate.fly, !!e2.fly, !!e3.fly], [false, false, true, true]);
  eq(e2.fly.vel.y > 0 && e2.fly.vel.z < 0, true, 'z=-2 の人は -z へ');

});

test('blastActors: 反対側でも爆心の近くなら、軽く飛ぶ', () => {

test('stepFly: 天井に当たっても突き抜けず、下へ跳ね返る（crash）', () => {

test('sampleClip: キーの時刻ではそのポーズ、間はなめらかに混ぜ、範囲の外は端のポーズ', () => {
  const clip = [[0, 'ready'], [1, 'receive']];
  eq(sampleClip(clip, 0).spine, POSES.ready.spine);
  eq(sampleClip(clip, 1).spine, POSES.receive.spine);
  eq(sampleClip(clip, 5).spine, POSES.receive.spine);
  eq(sampleClip(clip, -5).spine, POSES.ready.spine);

test('クリップ：時刻は増える順で、ポーズの名前はすべて POSES にある', () => {
  for (const k in CLIPS) {
    const c = CLIPS[k];
    for (let i = 0; i < c.length; i++) {
      eq(!!POSES[c[i][1]], true, k + ' の ' + c[i][1]);
      if (i > 0) eq(c[i][0] > c[i - 1][0], true, k + ' の時刻');

test('新しいポーズの hipsDrop は、脚の縦の長さに合っている（足が床から 3cm 以上浮かない・沈まない）', () => {
  for (const name of ['armsBack', 'landing', 'receiveReady', 'receivePush', 'tossReady', 'blockReady', 'blockDip', 'approachReady']) {
    const p = POSES[name];
    for (const s of ['L', 'R']) {
      const hip = (p['hip' + s] || [0, 0, 0])[0], knee = (p['knee' + s] || [0, 0, 0])[0];
      const len = 0.45 * Math.cos(hip) + 0.45 * Math.cos(hip + knee);
      eq(Math.abs((0.9 - len) - (p.hipsDrop || 0)) < 0.06 || s === 'R' && name === 'approachReady', true, name + ' ' + s + ' の脚 ' + len.toFixed(3));
    }
  }
});

function nearJoint(p, q, joint, label) {                  // ポーズ p と q の関節 joint の角度が（小数の誤差の範囲で）同じ
  for (let i = 0; i < 3; i++) near(p[joint][i], q[joint][i], 1e-6, (label || '') + ' ' + joint + '[' + i + ']');
}

test('助走：打つ所の手前で待ち、跳ぶ approachTime 秒前から走り、踏み切って前へ流れ、最高点で打つ所の上に来る', () => {
  const a = newActor(0, 0, -5, 0);
  const rise = riseTime();
  a.task = { kind: 'attack', contact: true, jump: true, at: { x: -1.3, z: 0 }, contactAt: 3, jumpAt: 3 - rise, start: 0 };
  planApproach(a);
  near(a.task.approachSpot.x, -1.3 - CFG.motion.approachDist, 1e-9);
  let simT = 0, atTakeoff = null, atPeak = null;
  while (simT < 3.8) {
    simT += 1 / 120;
    stepActor(a, 1 / 120, simT);
    if (atTakeoff === null && a.y > 0) atTakeoff = a.x;
    if (atPeak === null && simT >= 3) atPeak = { x: a.x, y: a.y };
    if (Math.abs(simT - (a.task.approachStart - 0.05)) < 1 / 240) near(a.x, a.task.approachSpot.x, 0.05, '助走の前は手前で待つ');
  }
  near(atTakeoff, -1.3 - CFG.motion.broad, 0.15, '踏み切り位置');
  near(atPeak.x, -1.3, 0.12, '最高点で打つ所の上');
  near(atPeak.y, CFG.jumpH, 0.05);
  eq(a.y, 0);
  eq(a.landT !== null && a.landT > 3, true, '着地の時刻');
  eq(a.x <= -0.35, true, 'ネットを越えない');
});

});

// ===== リプレイ =====
function fakePlayer(x) {                                   // 記録に使う項目だけを持つ選手の見た目
  const j = {};
  for (const n of JOINTS) j[n] = { rotation: { x: 0, y: 0, z: 0 }, position: { y: 0 } };
  return { root: { position: { x, y: 0, z: 0 }, rotation: { y: 0 } }, tumble: { rotation: { x: 0, z: 0 } }, j };
}
function fakeBomb() { return { g: { visible: true, position: { x: 1, y: 2, z: 3 } }, shadow: { visible: true, position: { x: 0, y: 0, z: 0 } } }; }

test('リプレイ：記録は keep 秒より古いものを捨て、frameAt はその時刻以前で一番新しいフレームを返す', () => {
  const rec = makeRecorder(), pl = fakePlayer(0), bomb = fakeBomb();
  for (let i = 0; i <= 100; i++) { pl.root.position.x = i; recordFrame(rec, i * 0.1, [pl], bomb, 5); }
  eq(rec.frames[0].t >= 10 - 5 - 1e-9, true, '古いものは捨てる');
  eq(frameAt(rec, 7.25).players[0].p[0], 72);
  eq(frameAt(rec, 0).players[0].p[0], rec.frames[0].players[0].p[0], '範囲より前は最初');
  eq(frameAt(rec, 99).players[0].p[0], 100, '範囲より後は最後');
});

test('リプレイ：applyFrame で、記録した位置・回転・関節・爆弾を当て直す', () => {
  const rec = makeRecorder(), pl = fakePlayer(0), bomb = fakeBomb();
  pl.root.position.x = 3; pl.root.rotation.y = 1; pl.tumble.rotation.x = 2; pl.j.kneeL.rotation.x = 1.5; pl.j.hips.position.y = 0.8;
  recordFrame(rec, 0, [pl], bomb, 5);
  bomb.g.visible = false;
  recordFrame(rec, 1, [pl], bomb, 5);
  const target = fakePlayer(0), b2 = fakeBomb();
  applyFrame(frameAt(rec, 0), [target], b2);
  eq([target.root.position.x, target.root.rotation.y, target.tumble.rotation.x, target.j.kneeL.rotation.x, target.j.hips.position.y], [3, 1, 2, 1.5, 0.8]);
  eq([b2.g.visible, b2.g.position.x], [true, 1]);
  applyFrame(frameAt(rec, 1), [target], b2);
  eq([b2.g.visible, b2.shadow.visible], [false, false]);
});

test('ジャンプサーブ：エンドラインの外から助走し、ラインの手前で踏み切り、コートの中の空中で打って、相手コートに落ちる', () => {
  const R = quietRally();
  startPoint(R, 0);
  choose(R, 'serve');
  let takeoffX = null, hit = null;
  const ev = [];
  for (let i = 0; i < 6 * 60; i++) {
    tickRally(R, 1 / 60);
    if (takeoffX === null && R.me.y > 0) takeoffX = R.me.x;
    for (const e of R.events.splice(0)) { ev.push(e); if (!hit && e.type === 'hit' && e.kind === 'serve') hit = { x: R.ball.pos.x, y: R.ball.pos.y, mx: R.me.x }; }
  }
  near(takeoffX, -CFG.jumpServe.takeoffX, 0.25, '踏み切りはラインの手前');
  eq(takeoffX <= -CFG.court.halfLen, true, 'ラインを踏み越えていない');
  eq(hit !== null && hit.x > -CFG.court.halfLen, true, 'コートの中の空中で打つ');
  near(hit.y, CFG.contactH.serve, 0.3, '打つ高さ');
  eq(boomSide(ev), 1);
});
